<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бизнес-академия</title>
<meta name="apple-mobile-web-app-title" content="Академия">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="academy-icon.png">
<link rel="icon" href="academy-icon.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1c1a;--mut:#6b6760;--acc:#1d4ed8;--acc2:#c2410c;--line:#e4e0d8;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#22201d;--ink:#eeeae2;--mut:#a29d93;--line:#38352f;--acc:#60a5fa;--acc2:#fb923c;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:auto;padding:12px 16px 80px}
h1{font-size:24px;margin:12px 0 2px}h2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:0 0 6px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.blk{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:20px 0 4px}
.sph{display:flex;align-items:center;gap:12px;cursor:pointer}
.sph .num{flex:none;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700}
.sph .t{flex:1}.sph .lv{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--line);white-space:nowrap}
.lv.l0{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}.lv.l1{background:color-mix(in srgb,var(--acc2) 15%,transparent);color:var(--acc2)}.lv.l2{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.btn{display:inline-block;border:0;background:var(--acc);color:#fff;font-weight:600;border-radius:12px;padding:13px 18px;margin:10px 8px 0 0;font-size:16px;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.w{width:100%;text-align:center}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;margin:8px 0;font-size:15px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.opt.badc{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.steps{display:flex;gap:4px;margin:6px 0}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--acc)}
textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:110px}
.back{background:none;border:0;color:var(--acc);font-size:16px;padding:8px 0}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.map div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--line);color:var(--mut)}
.map .l0{background:var(--bad);color:#fff}.map .l1{background:var(--acc2);color:#fff}.map .l2{background:var(--ok);color:#fff}
ul.core{padding-left:18px;margin:6px 0}ul.core li{margin:6px 0}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body><main id="app"></main><div class="toast" id="toast"></div>
<script>
const BLOCKS=["Создать то, что купят","Продать","Управлять деньгами и бизнесом","Расти"];
/* сфера: n — название, b — блок, link — отдельный тренажёр, core — ключевые понятия, q — [вопрос,[варианты],верный,пояснение], t — практические задания */
const SP=[
{n:"Ценностные предложения",b:0,link:"vp.html",core:["Профиль клиента: работы, боли, выгоды","Карта ценности: продукты, обезболивающие, создатели выгод","Формула: кто → боль → измеримый результат → отличие от альтернативы","Тест подстановки: подставь конкурента — если правда, переделывай","12 приёмов прорыва: убрать боль целиком, плата за результат, ускорить в 10 раз…"],
q:[["Что относится к профилю клиента?",["Продукты и услуги","Работы, боли, выгоды","Каналы продаж"],1,"Профиль клиента — правая часть канвы: работы, боли, выгоды."],
["Какое предложение сильнее?",["Качественные услуги по подбору помещений","5 помещений за 72 часа, оплата только после подписания"],1,"Конкретный срок, результат и снятый риск."],
["Главный дефект: «Инновационные решения для вашего бизнеса»",["Нет конкретного клиента","Слишком дорого","Слишком длинно"],0,"Кто клиент — неизвестно."],
["Что такое «работа клиента»?",["Его должность","То, что он пытается сделать или решить","Задача продавца"],1,"Job to be done — задача, ради которой «нанимают» продукт."],
["Что делает предложение трудно копируемым?",["Скидка 10%","Уникальная связка ресурсов или модели, которую долго строить","Красивый логотип"],1,"Скидку повторят завтра, систему — нет."]],
t:["Придумай ценностное предложение для автомойки рядом с бизнес-центром.","Оцени по шкале 0–10 предложение любого банка из рекламы, которую видел сегодня."]},

{n:"Бизнес-модели и юнит-экономика",b:0,core:["Бизнес-модель — как ты создаёшь, доставляешь и забираешь ценность","Юнит — одна единица: заказ, клиент, точка","CAC — стоимость привлечения клиента","LTV — сколько маржи принесёт клиент за всё время","LTV/CAC ≥ 3 — здоровая модель; < 1 — каждый клиент в минус","Маржинальность = (цена − переменные затраты) / цена"],
q:[["Клиент приносит 3 000 ₽ маржи в месяц и остаётся 10 месяцев. LTV?",["3 000 ₽","30 000 ₽","300 000 ₽"],1,"3 000 × 10 = 30 000 ₽."],
["LTV = 30 000 ₽, CAC = 12 000 ₽. Модель здоровая?",["Да, отлично","Пограничная: 2,5 — ниже ориентира 3","Убыточная"],1,"30 000 / 12 000 = 2,5. Работает, но запаса мало."],
["Цена 500 ₽, себестоимость 300 ₽. Маржинальность?",["40%","60%","67%"],0,"(500 − 300) / 500 = 40%."],
["Что такое юнит-экономика?",["Бухгалтерия по юнитам компании","Прибыль или убыток на одной единице продаж","Экономика стартапов"],1,"Если в минусе один юнит — масштаб только умножит убыток."],
["Модель «база бесплатно, расширенные функции платно» называется…",["Подписка","Freemium","Франшиза"],1,"Freemium: Duolingo, Zoom, Telegram Premium."]],
t:["Посчитай юнит-экономику кофейни навынос: средний чек, себестоимость, сколько чашек в день нужно для окупаемости аренды 150 000 ₽.","Распиши бизнес-модель своей работы в «Хлебнике»: кто платит, за что, какие затраты на одно подписанное помещение."]},

{n:"Проверка идей и MVP",b:0,core:["Гипотеза + критерий успеха: «если X, то Y, проверим так, успех = Z»","MVP — самая дешёвая версия, чтобы проверить гипотезу, а не «плохой продукт»","Лучший сигнал спроса — деньги (предоплата), а не «интересно»","Интервью: спрашивай о прошлом поведении, не «купили бы вы»","Smoke test: лендинг или пост с кнопкой «купить» до создания продукта"],
q:[["Какой сигнал спроса самый надёжный?",["«Классная идея!»","Лайки под постом","Предоплата"],2,"Слова бесплатны, деньги — нет."],
["Какой вопрос в интервью правильный?",["Купили бы вы такой сервис?","Как вы решали эту задачу в последний раз?","Сколько бы вы заплатили?"],1,"Прошлое поведение не врёт, прогнозы про будущее — врут."],
["MVP — это…",["Первая полная версия продукта","Минимальный способ проверить ключевую гипотезу","Дешёвая копия конкурента"],1,"Иногда MVP — это таблица и Telegram, а не приложение."],
["Чего не хватает гипотезе «Людям понравится доставка хлеба»?",["Красивого названия","Измеримого критерия успеха и сегмента","Инвестора"],1,"Кому, сколько, как поймём, что «да»."],
["Лендинг с кнопкой «Заказать» до создания продукта — это…",["Обман клиентов","Smoke test для проверки спроса","Таргет"],1,"Измеряешь клики и заявки и честно сообщаешь о запуске позже."]],
t:["Сформулируй 3 гипотезы для идеи «лиды для брокеров в США» с критериями успеха.","Придумай MVP для своей идеи, который можно запустить за 3 дня и за 0 ₽."]},

{n:"Продажи и переговоры",b:1,core:["Воронка: лиды → контакт → встреча → предложение → сделка","SPIN: ситуационные, проблемные, извлекающие, направляющие вопросы","На хорошей встрече больше говорит клиент","Возражение — запрос информации: сначала уточни, потом отвечай","Закрытие: всегда договорённость о следующем шаге с датой","Переговоры: знай свою BATNA — лучшую альтернативу без сделки"],
q:[["200 лидов → 20 встреч → 5 сделок. Конверсия из лида в сделку?",["2,5%","5%","25%"],0,"5 / 200 = 2,5%."],
["Клиент говорит «дорого». Первое действие?",["Дать скидку","Уточнить: по сравнению с чем?","Перечислить преимущества"],1,"Сначала пойми, с чем он сравнивает."],
["Кто больше говорит на сильной встрече?",["Продавец","Клиент","Поровну"],1,"Вопросы продают лучше презентаций."],
["Что такое BATNA?",["Скидка для клиента","Лучшая альтернатива, если сделка не состоится","Тип контракта"],1,"Сильная альтернатива — сильная позиция."],
["Как закончить встречу правильно?",["«Подумайте и позвоните»","Договориться о конкретном следующем шаге и дате","Отправить прайс"],1,"Без следующего шага сделка умирает."]],
t:["Напиши 5 SPIN-вопросов для собственника помещения, который не хочет сдавать пекарне.","Отработай возражение «у нас уже есть брокер» — 3 разных ответа."]},

{n:"Маркетинг",b:1,core:["Позиционирование — какое место ты занимаешь в голове клиента относительно альтернатив","Сегментация: не «все», а группы с общей болью","4P: продукт, цена, место, продвижение","AIDA: внимание → интерес → желание → действие","Бренд — обещание, которое ты стабильно выполняешь","Каналы: выбирай 1–2, где точно есть твой клиент"],
q:[["Позиционирование — это…",["Логотип и цвета","Место в голове клиента относительно альтернатив","Расположение магазина"],1,"«Самый быстрый», «самый надёжный» — выбери одно."],
["Что входит в 4P?",["Продукт, цена, место, продвижение","План, прибыль, персонал, процесс","Партнёры, платформа, покупатель, пиар"],0,"Product, Price, Place, Promotion."],
["Порядок AIDA?",["Действие → интерес → желание → внимание","Внимание → интерес → желание → действие","Интерес → внимание → действие → желание"],1,"Attention, Interest, Desire, Action."],
["Лучший старт для малого бизнеса с маленьким бюджетом?",["Реклама везде понемногу","1–2 канала, где точно есть клиент","Билборды"],1,"Фокус бьёт распыление."],
["Бренд — это прежде всего…",["Дизайн","Обещание, которое стабильно выполняется","Слоган"],1,"Дизайн — упаковка обещания."]],
t:["Опиши позиционирование ВкусВилла и Пятёрочки в одном предложении каждое.","Выбери 2 канала продвижения для сорсинга из Вэньчжоу и объясни, почему именно они."]},

{n:"Цифровой маркетинг и аналитика",b:1,core:["CTR = клики / показы","CPA (CPL) = расход / число заявок","Конверсия = целевые действия / посетители","ROMI = (доход от маркетинга − расход) / расход","UTM-метки — видно, из какого источника пришёл клиент","Решения по цифрам, а не по ощущениям"],
q:[["10 000 показов, 150 кликов. CTR?",["0,15%","1,5%","15%"],1,"150 / 10 000 = 1,5%."],
["Бюджет 30 000 ₽, 60 заявок. Стоимость заявки?",["200 ₽","500 ₽","2 000 ₽"],1,"30 000 / 60 = 500 ₽."],
["1 000 визитов на сайт, 20 заявок. Конверсия?",["2%","20%","0,2%"],0,"20 / 1 000 = 2%."],
["Вложили 50 000 ₽, получили 150 000 ₽ дохода. ROMI?",["300%","200%","150%"],1,"(150 − 50) / 50 = 200%."],
["Зачем UTM-метки?",["Для SEO","Чтобы понять, какой источник привёл клиента","Для дизайна"],1,"Без них не понять, какой канал работает."]],
t:["Реклама: 40 000 ₽, 80 заявок, 8 сделок по 25 000 ₽ маржи. Посчитай CPL, стоимость сделки и ROMI. Стоит продолжать?","Придумай, какие 3 метрики ты бы отслеживал для своего будущего бизнеса каждую неделю."]},

{n:"Финансы",b:2,core:["Прибыль ≠ деньги на счёте: кассовый разрыв убивает прибыльные бизнесы","P&L (ОПиУ): доходы − расходы = прибыль за период","ДДС: реальное движение денег — когда пришли, когда ушли","Баланс: что есть (активы) и откуда (обязательства + капитал)","Точка безубыточности = постоянные расходы / маржа на единицу","Валовая прибыль = выручка − себестоимость"],
q:[["Постоянные расходы 300 000 ₽, маржа с единицы 150 ₽. Точка безубыточности?",["2 000 единиц","450 единиц","20 000 единиц"],0,"300 000 / 150 = 2 000."],
["Компания прибыльна по отчёту, но нечем платить зарплату. Это…",["Невозможно","Кассовый разрыв","Ошибка бухгалтера"],1,"Деньги застряли в дебиторке или запасах."],
["Какой отчёт показывает реальные поступления и платежи?",["P&L","ДДС","Баланс"],1,"P&L — про начисления, ДДС — про живые деньги."],
["Выручка 1 млн, себестоимость 600 тыс., аренда и зарплаты 300 тыс. Валовая прибыль?",["400 тыс.","100 тыс.","700 тыс."],0,"Валовая = 1 000 − 600. Операционная = 100 тыс."],
["Что показывает баланс?",["Прибыль за месяц","Что у компании есть и откуда эти ресурсы на дату","План продаж"],1,"Снимок на дату, а не фильм за период."]],
t:["Составь P&L своей месячной «экономики»: доходы (оклад + бонусы) и расходы. Сколько свободных денег на учёбу в США?","Посчитай точку безубыточности пекарни: аренда 250 000, зарплаты 400 000, маржа с чека 180 ₽."]},

{n:"Бухучёт и налоги",b:2,core:["Формы: самозанятый (НПД), ИП, ООО — разные риски и налоги","УСН «доходы» — базово 6%, «доходы минус расходы» — базово 15% (регионы и законы меняют ставки)","НПД: 4% с физлиц, 6% с юрлиц, есть лимит дохода","ИП отвечает всем имуществом, участник ООО — в пределах доли","Первичка: договоры, акты, накладные — без них расход не расход","Цель — понимать своего бухгалтера и не платить штрафов. Ставки проверяй перед решением"],
q:[["Базовая ставка УСН «доходы»?",["6%","13%","20%"],0,"Регионы могут снижать; с 2025 года при больших доходах добавился НДС — проверяй актуальные правила."],
["Чем рискует ИП по долгам бизнеса?",["Только уставным капиталом","Всем личным имуществом","Ничем"],1,"У ООО риск обычно ограничен долей — поэтому ООО для партнёрств."],
["Самозанятый продаёт услугу компании. Ставка НПД?",["4%","6%","13%"],1,"4% с физлиц, 6% с юрлиц и ИП."],
["Зачем нужна «первичка»?",["Для красоты","Подтверждает операции и расходы для налоговой","Для банка"],1,"Нет акта — нет подтверждённого расхода."],
["Когда выгоднее УСН «доходы минус расходы»?",["Когда расходы большие (больше ~60% выручки)","Всегда","Когда нет расходов"],0,"При высокой доле расходов 15% с разницы меньше, чем 6% со всего."]],
t:["Сравни для бизнеса с выручкой 5 млн и расходами 3,5 млн: УСН 6% против 15%. Что выгоднее?","Выбери форму (НПД, ИП или ООО) для запуска лидогенерации для брокеров и объясни выбор."]},

{n:"Право",b:2,core:["Договор: существенные условия (предмет, цена, сроки), ответственность, расторжение","Партнёрство — только с письменным соглашением о долях, ролях и выходе","Корпоративный договор / устав: кто решает, что при выходе партнёра","51% — контроль над большинством решений","Товарный знак регистрируется (в РФ — Роспатент), иначе бренд не твой","NDA — защита конфиденциальной информации"],
q:[["Инвестор получает 51% в пекарне. Что это значит?",["Ничего особенного","Он контролирует большинство решений","У вас равные права"],1,"Считай, у него контроль. Защищайся правами вето в корпоративном договоре."],
["Что обязательно в договоре оказания услуг?",["Логотипы сторон","Предмет — что именно делается","Печать"],1,"Без предмета договор может считаться незаключённым."],
["Партнёры договорились устно о 50/50. Риск?",["Никакого","Конфликт при выходе, споре или первых деньгах","Только налоговый"],1,"Устные доли — источник войн. Всё письменно."],
["Как защитить название бренда?",["Купить домен","Зарегистрировать товарный знак","Заказать логотип"],1,"Домен не защищает название."],

SP.forEach(s=>{if(!s.link)s.link=null});

/* state */
const K='academy1';
let S=(()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}})();S.res=S.res||{};S.ans=S.ans||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2000)}
const LVN=["Новичок","Практик","Уверенно"];
const lvl=sc=>sc<=1?0:sc<=3?1:2;

function home(){const done=Object.keys(S.res).length;
let h=`<h1>Бизнес-академия</h1><p class="mut">15 сфер предпринимателя. Пройди тест уровня в каждой — получишь карту сильных и слабых сторон. Тренажёры по сферам будут добавляться.</p>
<div class="card"><h3>Карта уровня · ${done}/15</h3><div class="map">${SP.map((s,i)=>{const r=S.res[i];return `<div class="${r!=null?'l'+lvl(r):''}">${i+1}</div>`}).join('')}</div>
<p class="mut" style="margin-top:8px">🟥 новичок · 🟧 практик · 🟩 уверенно · серый — не пройдено</p>
${done<15?`<button class="btn w" id="all">${done?'Продолжить тестирование':'Пройти все тесты подряд (~20 мин)'}</button>`:`<button class="btn w" id="rep">Скопировать результаты для Claude</button>`}</div>`;
BLOCKS.forEach((b,bi)=>{h+=`<div class="blk">${bi+1}. ${b}</div>`;
SP.forEach((s,i)=>{if(s.b!==bi)return;const r=S.res[i];
h+=`<div class="card sph" data-i="${i}"><div class="num">${i+1}</div><div class="t"><b>${s.n}</b>${s.link?'<div class="mut">есть полный тренажёр</div>':''}</div><div class="lv ${r!=null?'l'+lvl(r):''}">${r!=null?LVN[lvl(r)]+' · '+r+'/5':'тест'}</div></div>`})});
$('#app').innerHTML=h;window.scrollTo(0,0);
document.querySelectorAll('.sph').forEach(c=>c.onclick=()=>sphere(+c.dataset.i));
const a=$('#all');if(a)a.onclick=()=>{const n=SP.findIndex((_,i)=>S.res[i]==null);test(n,true)};
const rp=$('#rep');if(rp)rp.onclick=copyRes}

function sphere(i){const s=SP[i],r=S.res[i];
$('#app').innerHTML=`<button class="back" id="bk">‹ Все сферы</button><h1>${i+1}. ${s.n}</h1><p class="mut">Блок: ${BLOCKS[s.b]}</p>
<div class="card"><h3>Уровень</h3>${r!=null?`<p><b>${LVN[lvl(r)]}</b> — ${r} из 5</p>`:'<p class="mut">Тест не пройден</p>'}<button class="btn" id="tt">${r!=null?'Пройти заново':'Тест уровня (5 вопросов)'}</button>${s.link?`<a class="btn alt" href="${s.link}">Открыть тренажёр</a>`:''}</div>
<div class="card"><h3>Суть сферы</h3><ul class="core">${s.core.map(c=>`<li>${c}</li>`).join('')}</ul></div>
<div class="card"><h3>Практика</h3><p class="mut">Ответь письменно и отправь Claude на разбор.</p>${s.t.map((t,k)=>`<p><b>Задание ${k+1}.</b> ${t}</p><textarea data-k="${k}" placeholder="Твой ответ…">${(S.ans[i+'_'+k]||'').replace(/</g,'&lt;')}</textarea>`).join('')}
<button class="btn w" id="cp">Скопировать ответы на разбор</button></div>`;window.scrollTo(0,0);
$('#bk').onclick=home;$('#tt').onclick=()=>test(i,false);
document.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{S.ans[i+'_'+t.dataset.k]=t.value;save()});
$('#cp').onclick=()=>copy(`Разбери мои ответы как наставник-предприниматель. Сфера: ${s.n}. Оцени каждый ответ 0–10, укажи ошибки и дай сильную версию.\n\n`+s.t.map((t,k)=>`Задание ${k+1}: ${t}\nМой ответ: ${S.ans[i+'_'+k]||'(пусто)'}`).join('\n\n'))}

function test(i,chain){const s=SP[i];let k=0,ok=0,lock=0;
const draw=()=>{const q=s.q[k];
$('#app').innerHTML=`<button class="back" id="bk">‹ Выйти</button><h2>${i+1}. ${s.n}</h2><div class="steps">${s.q.map((_,j)=>`<i class="${j<=k?'on':''}"></i>`).join('')}</div>
<div class="card"><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}<div id="ex"></div></div>`;
$('#bk').onclick=home;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;lock=1;const good=+b.dataset.j===q[2];if(good)ok++;
document.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.j===q[2])x.classList.add('good');else if(x===b)x.classList.add('badc')});
$('#ex').innerHTML=`<p class="mut">${good?'✅':'❌'} ${q[3]}</p><button class="btn w" id="nx">${k<4?'Дальше':'Результат'}</button>`;
$('#nx').onclick=()=>{lock=0;k++;if(k<5)draw();else fin()}})};
const fin=()=>{S.res[i]=ok;save();const nxt=chain?SP.findIndex((_,j)=>S.res[j]==null):-1;
$('#app').innerHTML=`<div class="card"><h2>${s.n}: ${ok}/5</h2><p>Уровень: <b>${LVN[lvl(ok)]}</b></p><p class="mut">${ok<=1?'Начни с карточки «Суть сферы».':ok<=3?'База есть — закрепи практикой.':'Сильно. Переходи к практическим заданиям.'}</p>
${nxt>=0?`<button class="btn w" id="nn">Следующая сфера: ${SP[nxt].n}</button>`:''}<button class="btn alt w" id="hh">К карте</button></div>`;
if(nxt>=0)$('#nn').onclick=()=>test(nxt,true);$('#hh').onclick=home};
draw()}

function copyRes(){copy('Результаты моего теста по 15 сферам предпринимателя. Составь план обучения на 3 месяца с приоритетами, начиная со слабых и самых нужных сфер.\n\n'+SP.map((s,i)=>`${i+1}. ${s.n}: ${S.res[i]!=null?S.res[i]+'/5 ('+LVN[lvl(S.res[i])]+')':'не пройден'}`).join('\n'))}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Скопировано — вставь в чат с Claude')}catch(e){toast('Не удалось скопировать')}}
home();
</script>
