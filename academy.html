terms:[["Общий объём рынка","TAM — Total addressable market"],["Доступный рынок","SAM — Serviceable available market"],["Достижимая доля","SOM — Serviceable obtainable market"],["Расчёт снизу вверх","Bottom-up analysis"],["Размер рынка","Market size"]],
task:{q:"В нише 20 000 малых брендов на Amazon (допущение), 30% из них закупают в Китае, годовой чек за услугу сорсинга — 3 000 $. Чему равен SAM, $?",a:18000000,tol:0,u:"$",ex:"20 000 × 30% = 6 000 брендов × 3 000 $ = 18 000 000 $. Если за 3 года взять 1% — это 60 клиентов и 180 000 $ в год. Реальная цель для одного человека с командой."},
real:"Посчитай снизу вверх TAM, SAM и SOM для лидогенерации брокерам: число брокеров × цена подписки × доля, которую реально взять. Подпиши источник каждой цифры."},

"9-2":{c:["Конкуренты бывают <b>прямые</b> (то же решение), <b>косвенные</b> (другое решение той же задачи) и <b>«ничего не делать»</b> — самый частый твой конкурент.","Таблица конкурентов: оффер, цена, каналы, сильные и слабые стороны, отзывы. Заполни для 5–7 игроков, и пробелы на рынке станут видны.","<b>Отзывы на 1–3 звезды</b> — золото. Там клиенты сами пишут, чего им не хватает. Это готовые идеи для твоего ценностного предложения.","<b>Тайный покупатель</b>: обратись к конкуренту как клиент. Скорость ответа, качество, цена, процесс — узнаешь больше, чем из любого отчёта.","Цель анализа — не скопировать лидера, а найти, где ты можешь быть <b>заметно лучше</b> для конкретного сегмента."],
terms:[["Конкурентный анализ","Competitive analysis"],["Прямой конкурент","Direct competitor"],["Товар-заменитель","Substitute"],["Тайный покупатель","Mystery shopper"],["Пробел на рынке","Market gap"]],
task:{q:"Из 50 отзывов о конкуренте 18 — жалобы на сроки. Какая доля жалоб на сроки, %?",a:36,tol:0,u:"%",ex:"18 / 50 = 36%. Это главная боль клиентов конкурента и твой шанс: предложение с гарантированным сроком бьёт прямо в неё."},
real:"Стань тайным покупателем: напиши 2 конкурентам (сорсинг-агентам или агентствам по поиску помещений). Сравни скорость ответа, вопросы, цену и впечатление."},

"9-3":{c:["Модель <b>5 сил Портера</b> объясняет, почему в одних отраслях зарабатывают много, а в других — копейки. Чем сильнее силы, тем ниже прибыль.","1. <b>Конкуренция</b> внутри отрасли<br>2. <b>Угроза новичков</b>: легко ли войти<br>3. <b>Заменители</b>: решают ту же задачу иначе","4. <b>Сила поставщиков</b>: могут ли диктовать цены<br>5. <b>Сила покупателей</b>: могут ли давить на цену","Пример: авиакомпании — сильные поставщики (Boeing, Airbus), сильные покупатели, жёсткая конкуренция. Отсюда низкая прибыль, несмотря на огромную выручку.","Применение: выбирай ниши со слабыми силами или строй защиту: уникальная экспертиза, связи, данные, долгие контракты, несколько поставщиков."],
terms:[["Пять сил Портера","Porter's Five Forces"],["Барьеры входа","Barriers to entry"],["Рыночная власть поставщиков","Supplier power"],["Рыночная власть покупателей","Buyer power"],["Угроза заменителей","Threat of substitutes"]],
task:{q:"Один поставщик даёт 70% закупок. Закупки — это 60% твоей выручки. Поставщик поднял цены на 10%, а цены для клиентов ты не менял. На сколько процентных пунктов упадёт маржа?",a:4.2,tol:0.05,u:"п.п.",ex:"Доля этого поставщика в выручке: 60% × 70% = 42%. Рост на 10% → +4,2% к затратам → маржа −4,2 п.п. Вот что такое сила поставщика. Защита — второй поставщик."},
real:"Разбери рынок пекарен по 5 силам Портера: по одному предложению на каждую силу. Где самая большая угроза для пекарни у станции МЦД?"},

"9-4":{c:["<b>Красный океан</b> — переполненный рынок, где все бьются ценой. <b>Голубой океан</b> — новое пространство спроса, где конкуренция ещё не началась.","Главный инструмент — сетка <b>ERRC</b>: что <b>убрать</b>, что <b>снизить</b>, что <b>повысить</b>, что <b>создать</b> по сравнению с отраслью. Цель — одновременно снизить затраты и поднять ценность.","Cirque du Soleil убрал животных и звёзд-клоунов (дорого), снизил опасные трюки, повысил артистизм и создал сюжет и музыку как в театре. Получился новый рынок с ценами театра.","<b>Канва стратегии</b> — график: по горизонтали факторы конкуренции, по вертикали уровень предложения. У тебя должна получиться кривая не как у всех.","Связь с ЦП-тренажёром: приёмы «убери боль целиком» и «забытый сегмент» — это инструменты голубого океана."],
terms:[["Стратегия голубого океана","Blue ocean strategy"],["Инновация ценности","Value innovation"],["Сетка ERRC","Eliminate-Reduce-Raise-Create grid"],["Канва стратегии","Strategy canvas"],["Неклиенты","Noncustomers"]],
task:{q:"Ты убрал 2 элемента, которые стоили 15% и 10% себестоимости, и добавил новый за 5%. На сколько процентов снизилась себестоимость?",a:20,tol:0,u:"%",ex:"−15 − 10 + 5 = −20%. Себестоимость упала на пятую часть, и при этом появилось новое отличие. Это и есть инновация ценности."},
real:"Сделай сетку ERRC для пекарни у станции МЦД: по 2 пункта в каждый квадрат — убрать, снизить, повысить, создать."},

"9-5":{c:["Ниша выбирается не по вдохновению, а по <b>матрице</b>: 5–8 критериев с весами и оценки идей от 1 до 5.","Критерии: размер рынка, сила боли и готовность платить, доступ к клиентам, <b>твоё нечестное преимущество</b>, конкуренция, стартовый капитал, масштабируемость, совместимость с учёбой и визой.","<b>Нечестное преимущество</b> — то, что трудно купить или скопировать: опыт, связи, место, данные, язык. У тебя это опыт с помещениями, жизнь в Вэньчжоу, парсер.","После матрицы — быстрая проверка 2 лучших ниш: 10 интервью, лендинг, первые предоплаты. Цифры важнее любых оценок.","Ошибка новичков — выбирать «модное», а не то, где у тебя есть преимущество. Лучшая ниша там, где пересекаются <b>боль рынка</b>, <b>твои сильные стороны</b> и <b>деньги</b>."],
terms:[["Выбор ниши","Niche selection"],["Взвешенная матрица решений","Weighted decision matrix"],["Нечестное преимущество","Unfair advantage"],["Масштабируемость","Scalability"],["Проверка идеи","Validation"]],
task:{q:"Ниша А получила оценки 4, 3 и 5 по критериям с весами 0,5, 0,3 и 0,2. Какой итоговый балл?",a:3.9,tol:0.01,u:"балла",ex:"4 × 0,5 + 3 × 0,3 + 5 × 0,2 = 2 + 0,9 + 1 = 3,9. Сравни так все идеи — и спор с самим собой превратится в расчёт."},
real:"Выпиши свои 3 нечестных преимущества: что есть у тебя и почти нет у конкурентов. Для каждого придумай, в какой нише оно даёт максимум."},
/* ---------- НЕДЕЛЯ 10 · ИНВЕСТИЦИИ ---------- */
"10-1":{c:["<b>Pre-money</b> — оценка компании до вложений. <b>Post-money</b> = pre-money + инвестиции. Доля инвестора = инвестиции / post-money.","<b>Размывание</b>: в каждом новом раунде все старые доли уменьшаются пропорционально. 100% → 80% → 60% — нормальный путь, если стоимость компании растёт быстрее.","<b>Таблица долей</b> (cap table) показывает, кто чем владеет после каждого раунда. Держи её с первого дня, даже если вас двое.","Как оценивают: стартап — по сравнимым сделкам и потенциалу, малый офлайн-бизнес — чаще через <b>мультипликатор годовой прибыли</b> (часто 2–4 годовые прибыли). Итог — всегда результат переговоров.","Ловушка: высокая оценка с жёсткими условиями хуже нормальной оценки с честными условиями. Смотри на <b>всю сделку</b>, а не на одну цифру."],
terms:[["Оценка до инвестиций","Pre-money valuation"],["Оценка после инвестиций","Post-money valuation"],["Размывание доли","Dilution"],["Таблица долей","Cap table"],["Мультипликатор","Multiple"]],
task:{q:"У тебя 100%. В раунде 1 инвестор получает 20%. В раунде 2 новому инвестору отдают ещё 25%, все размываются пропорционально. Твоя доля после двух раундов, %?",a:60,tol:0,u:"%",ex:"100% × 0,8 = 80% → × 0,75 = 60%. При этом 60% от большой компании могут стоить намного больше, чем 100% от маленькой."},
real:"Разбери условие «инвестору 51% в пекарне»: какую оценку бизнеса подразумевает его вложение? Сколько тогда стоит твоя доля? Запиши расчёт."},

"10-2":{c:["Деньги бывают разные, и у каждого вида своя цена. <b>Собственные</b> — самые дешёвые: это бутстрэппинг, рост на выручке клиентов.","<b>Друзья и семья</b> — быстро, но рискуешь отношениями. Оформляй письменно, как с чужими.","<b>Кредит и лизинг</b>: доля остаётся твоей, но нужны залог, история и стабильный денежный поток. <b>Гранты</b> и господдержка — бесплатно, но с бюрократией и условиями.","<b>Бизнес-ангелы</b> — частные инвесторы на старте, часто с опытом и связями. <b>Венчурные фонды</b> — только для бизнесов, которые могут вырасти в 10–100 раз. Пекарне туда не нужно.","<b>Стратегический инвестор</b> — компания из твоей отрасли: даёт деньги и рынок, но может захотеть контроль. Правило: подбирай деньги под модель бизнеса, а не наоборот."],
terms:[["Рост на свои деньги","Bootstrapping"],["Бизнес-ангел","Angel investor"],["Венчурный капитал","Venture capital (VC)"],["Долговое финансирование","Debt financing"],["Долевое финансирование","Equity financing"]],
task:{q:"Кредит 2 000 000 ₽ на 1 год под 20% годовых, проценты платятся в конце срока. Сколько переплатишь, ₽?",a:400000,tol:0,u:"₽",ex:"2 000 000 × 20% = 400 000 ₽. Дорого, зато через год бизнес на 100% твой. Сравни: инвестору за те же деньги могли бы отдать 30–50% навсегда."},
real:"Узнай условия кредита или лизинга оборудования для ИП в своём банке: ставка, залог, требования к возрасту бизнеса. Запиши 3 главных ограничения."},

"10-3":{c:["<b>Term sheet</b> — короткий документ с главными условиями сделки до юридических договоров. Именно здесь решается, хорошая сделка или нет.","Ключевые пункты: <b>сумма и оценка</b>, тип сделки (доля, конвертируемый заём, SAFE), <b>ликвидационная привилегия</b>, места в совете директоров, <b>право вето</b>.","<b>Ликвидационная привилегия 1x неучаствующая</b> — стандарт: при продаже компании инвестор сначала забирает свои вложения или свою долю — что больше. Условия «2x» или «участвующая» — красный флаг.","<b>Вестинг</b> основателей: доли «зарабатываются» обычно 4 года с первым годом-порогом. Защищает всех, если кто-то уйдёт рано.","<b>Drag-along</b> — большинство может заставить остальных продать компанию. <b>Tag-along</b> — меньшинство может продать долю на тех же условиях. Читай каждую строку — потом поздно."],
terms:[["Предварительные условия сделки","Term sheet"],["Ликвидационная привилегия","Liquidation preference"],["Вестинг","Vesting"],["Право вето","Veto rights / Protective provisions"],["Простое соглашение о будущей доле","SAFE — Simple agreement for future equity"]],
task:{q:"Инвестор вложил 10 млн ₽ за 25% с ликвидационной привилегией 1x (неучаствующей). Компанию продали за 30 млн ₽. Сколько получит инвестор, ₽?",a:10000000,tol:0,u:"₽",ex:"Он выбирает большее: вернуть вложенное (10 млн) или 25% от 30 млн (7,5 млн). Получает 10 млн, а основателям остаётся 20 млн вместо 22,5. Вот как привилегия меняет деньги."},
real:"Найди шаблон SAFE на сайте Y Combinator или любой шаблон term sheet и выпиши 5 пунктов, которые тебе непонятны. Разберём их вместе."},

"10-4":{c:["<b>Питч-дек</b> — 10–12 слайдов, которые за 3 минуты объясняют, почему в тебя стоит вложить. На каждом слайде одна мысль и одна главная цифра.","Структура: <b>проблема</b> → <b>решение</b> → <b>почему сейчас</b> → <b>рынок</b> → <b>продукт</b> → <b>трекшн</b> (реальные результаты) → <b>бизнес-модель</b> → <b>конкуренты</b> → <b>команда</b> → <b>финансы</b> → <b>запрос</b>.","Самый сильный слайд — <b>трекшн</b>: продажи, рост, предоплаты, письма о намерениях. 10 платящих клиентов убеждают больше, чем рынок на миллиард.","<b>Elevator pitch</b> — 30 секунд: кто клиент, какая боль, твоё решение, почему ты, что просишь. Отрепетируй так, чтобы мог сказать в лифте.","Говори историей: живой пример клиента и его боли запоминается сильнее таблицы. Цифры — чтобы доказать, история — чтобы запомнили."],
terms:[["Питч-дек","Pitch deck"],["Короткая самопрезентация","Elevator pitch"],["Трекшн, подтверждённый рост","Traction"],["Запрос","The ask"],["Сторителлинг","Storytelling"]],
task:{q:"Питч — 10 слайдов за 3 минуты. Сколько секунд в среднем на один слайд?",a:18,tol:0,u:"сек.",ex:"180 / 10 = 18 секунд. Значит, на слайде максимум одна мысль и одна цифра — больше за 18 секунд никто не прочитает."},
real:"Запиши на телефон 60-секундный питч одной своей идеи и переслушай. Где звучит неуверенно? Перезапиши 3 раза, пока не будет чисто."},

"10-5":{c:["Сильная позиция в переговорах — <b>альтернатива</b>. Один инвестор диктует условия, три инвестора конкурируют за сделку. Веди разговоры параллельно.","Знай свои цифры наизусть: юнит-экономика, финмодель, риски. Инвестор проверяет не только бизнес, но и тебя: понимаешь ли ты свои деньги.","Структура важнее суммы. Альтернативы «51% навсегда»: <b>заём</b> с процентом, доля прибыли <b>до возврата суммы с премией</b>, а затем меньшая доля, <b>конвертируемый заём</b>, <b>право вето</b> на ключевые решения вместо контроля.","<b>Due diligence</b> — проверка инвестором документов, цифр и юридической чистоты. Готовь data room заранее: договоры, отчёты, регистрационные документы.","Красные флаги инвестора: давит со сроками, хочет контроль на старте, не может назвать прошлые сделки, «умные» деньги без ума. Плохой инвестор хуже, чем никакого."],
terms:[["Переговоры","Negotiation"],["Проверка компании","Due diligence"],["Виртуальная комната данных","Data room"],["Конвертируемый заём","Convertible note"],["Доля в прибыли","Profit share"]],
task:{q:"Инвестор вкладывает 3 млн ₽ в пекарню. Вариант: он получает 70% прибыли, пока не вернёт 4,5 млн ₽, затем 20% доли. Прибыль пекарни — 150 000 ₽ в месяц. Через сколько месяцев инвестор вернёт 4,5 млн ₽? (Округли вверх.)",a:43,tol:1,u:"мес.",ex:"70% × 150 000 = 105 000 ₽ в месяц. 4 500 000 / 105 000 ≈ 42,9 → 43 месяца. Потом у тебя 80% бизнеса вместо 49% — разница огромная на дистанции."},
real:"Составь 3 альтернативных предложения инвестору для пекарни вместо «51% навсегда». Посчитай для каждого, какая доля и сколько прибыли будет у тебя через 5 лет."},

/* ---------- НЕДЕЛЯ 11 · ТЕХНОЛОГИИ И АВТОМАТИЗАЦИЯ ---------- */
"11-1":{c:["<b>CRM</b> — система, где живут все клиенты, сделки и касания. Без неё сделки теряются в голове, мессенджерах и блокнотах.","Основа — <b>воронка этапов</b>: новый лид → контакт → встреча → предложение → сделка. У каждой карточки есть <b>следующий шаг с датой</b>. Сделка без следующего шага мертва.","Популярные системы: amoCRM и Битрикс24 в России, HubSpot (есть бесплатный тариф) и Pipedrive в мире. Для старта хватит и Google Таблицы с правильными колонками.","Правило: лид попадает в CRM в течение 5 минут. История общения фиксируется сразу. Задачи и напоминания ставит система, а не память.","Главная ценность — <b>цифры</b>: конверсия каждого этапа, длина цикла сделки, источники клиентов. По ним видно, где теряются деньги."],
terms:[["Система управления клиентами","CRM — Customer relationship management"],["Воронка продаж","Sales pipeline"],["Лид","Lead"],["Следующий шаг","Next step"],["Цикл сделки","Sales cycle"]],
task:{q:"В CRM 120 сделок на этапе «выезд», конверсия в «подписано» — 5%, бонус за подписание — 100 000 ₽. Каков ожидаемый бонус с этой части воронки, ₽?",a:600000,tol:0,u:"₽",ex:"120 × 5% = 6 подписаний × 100 000 = 600 000 ₽. Подними конверсию с 5% до 7% — получишь +240 000 ₽ без новых объектов."},
real:"Перенеси свои текущие объекты по работе в простую CRM (хотя бы Google Таблица): этап, контакт, следующий шаг, дата. Обновляй её неделю."},

"11-2":{c:["<b>No-code</b> — инструменты, где продукт собирают без программирования. Идеально, чтобы проверить идею за дни, а не за месяцы.","Лендинги: Tilda. Базы и простые приложения: Notion, Airtable, Glide, Softr. Веб-приложения: Bubble. Автоматизация: Make, Zapier. Боты: конструкторы Telegram-ботов.","Автоматизация связывает сервисы: заявка с сайта → карточка в CRM → сообщение в Telegram → задача менеджеру. Без единой строчки кода.","Ограничения: при росте становится дорого, есть зависимость от платформы, сложная логика упирается в потолок. Тогда переходят на код.","Правило: <b>no-code для проверки идеи, код — для масштаба</b>. Первые 100 клиентов можно обслужить на Tilda, таблице и боте."],
terms:[["Без кода","No-code"],["Минимум кода","Low-code"],["Автоматизация процессов","Workflow automation"],["Целевая страница, лендинг","Landing page"],["Зависимость от поставщика","Vendor lock-in"]],
task:{q:"Допустим, бесплатный тариф сервиса автоматизации даёт 1 000 операций в месяц, а твой сценарий тратит 4 операции на одну заявку. Сколько заявок в месяц влезет в бесплатный лимит?",a:250,tol:0,u:"заявок",ex:"1 000 / 4 = 250 заявок. Упрости сценарий до 2 операций — и бесплатно пройдёт 500."},
real:"Собери за 30 минут лендинг для одной идеи на Tilda или в Notion: заголовок с ценностным предложением, 3 выгоды, форма заявки."},

"11-3":{c:["<b>ИИ-ассистенты</b> (Claude, ChatGPT и другие) уже экономят часы в день: тексты, письма, исследования, анализ таблиц, код, перевод.","<b>ИИ-агент</b> — модель плюс инструменты плюс цикл: сам ищет, читает, считает, делает шаги. Ты уже работаешь с агентом: парсер, трекер и эта академия собраны так.","Хороший промпт: <b>роль</b>, <b>контекст</b>, <b>задача</b>, <b>пример</b> хорошего результата, <b>формат</b> ответа. Плохой промпт — «сделай красиво».","Риски: ИИ может уверенно ошибаться — проверяй факты и цифры. Не загружай чужие персональные и конфиденциальные данные без разрешения.","Бизнес-применения: ответы клиентам, квалификация лидов, анализ отзывов, черновики договоров для юриста, исследование рынка, отчёты. Начни с самой скучной рутины."],
terms:[["Искусственный интеллект","AI — Artificial intelligence"],["Большая языковая модель","LLM — Large language model"],["ИИ-агент","AI agent"],["Промпт","Prompt"],["Галлюцинация модели","Hallucination"]],
task:{q:"ИИ-ассистент экономит тебе 1,5 часа в день, в месяце 22 рабочих дня, твой час стоит 600 ₽. Сколько экономия в месяц, ₽?",a:19800,tol:0,u:"₽",ex:"1,5 × 22 × 600 = 19 800 ₽ в месяц, около 237 600 ₽ в год. И это только время — без учёта качества."},
real:"Выбери одну рутинную задачу на работе (письма собственникам, отчёт по объектам) и сделай для неё шаблон промпта: роль, контекст, пример, формат ответа."},

"11-4":{c:["<b>API</b> — договор между программами: как одна программа может попросить данные или действие у другой. Через API работает почти весь современный софт.","Обычно это <b>REST</b>: запрос по адресу → ответ в формате <b>JSON</b>. Доступ по <b>ключу</b> или токену. Ключ — как пароль: не публикуй его и не отправляй в чатах.","<b>Вебхук</b> — обратная схема: сервис сам присылает данные, когда что-то произошло (новая заявка, оплата). Это быстрее и дешевле, чем каждые 5 минут спрашивать «есть новое?».","У API есть <b>лимиты</b> запросов в минуту или день. Большие задачи делят на порции и ставят паузы.","Пример интеграции: сайт → вебхук → CRM → бот в Telegram сообщает менеджеру → после сделки данные уходят в бухгалтерию. Человек не переносит данные руками."],
terms:[["Программный интерфейс","API — Application programming interface"],["Вебхук","Webhook"],["API-ключ","API key"],["Лимит запросов","Rate limit"],["Интеграция","Integration"]],
task:{q:"API разрешает 60 запросов в минуту. Нужно обновить 9 000 объявлений, по одному запросу на объявление. Сколько минут минимум займёт обновление?",a:150,tol:0,u:"мин.",ex:"9 000 / 60 = 150 минут — 2,5 часа. Значит, обновление запускают ночью или по частям в течение дня."},
real:"Открой документацию Telegram Bot API или API любой CRM и выпиши: как получить доступ, какой лимит запросов и какие 3 полезных действия можно автоматизировать."},

"11-5":{c:["<b>Данные</b> — актив бизнеса, который дорожает со временем. Кто собирает их с первого дня, через год видит закономерности, которых не видят конкуренты.","Принцип <b>единого источника правды</b>: каждая цифра живёт в одном месте (CRM, учётная система), а не в пяти таблицах с разными значениями.","<b>Дашборд</b> — экран с 5–10 главными метриками, который обновляется сам. Инструменты: Google Таблицы, Looker Studio, Yandex DataLens.","Ритуал: <b>каждую неделю 15 минут</b> на дашборд. Что выросло, что упало, почему, какое одно действие делаем. Без ритуала дашборд никто не открывает.","Персональные данные клиентов в России регулирует закон 152-ФЗ: согласие на обработку, хранение, защита. Штрафы за утечки серьёзные — продумай это заранее."],
terms:[["Дашборд","Dashboard"],["Единый источник правды","Single source of truth"],["Визуализация данных","Data visualization"],["Персональные данные","Personal data"],["Решения на основе данных","Data-driven decisions"]],
task:{q:"В первом квартале — 30 подписаний на 600 выездов, во втором — 36 на 600. На сколько процентных пунктов выросла конверсия?",a:1,tol:0,u:"п.п.",ex:"5% → 6%: рост на 1 п.п., или на 20% относительно. Без дашборда этот рост было бы не заметно, а это +20% денег."},
real:"Собери мини-дашборд своей работы в Google Таблице: выезды, одобрения, подписания и конверсия по месяцам. Добавь один график."},

/* ---------- НЕДЕЛЯ 12 · ИТОГ И РЕТЕСТ ---------- */
"12-1":{c:["12 недель позади. Время честно измерить прогресс: <b>пройди тесты всех 15 сфер заново</b> во вкладке «Сферы».","Стартовые результаты 22 ноября: ЦП 5, бизнес-модели 4, MVP 4, продажи 4, маркетинг 3, цифровой маркетинг 3, финансы 3, налоги 2, право 4, операционка 5, команда 5, стратегия 3, инвестиции 3, технологии 3, международный бизнес 2.","Средний балл на старте — 3,53 из 5. Самые слабые были налоги и международный бизнес — именно им ушло больше всего недель.","Тест из 5 вопросов — грубый инструмент. Настоящий показатель — <b>сделанные проекты</b>: финмодели, налоговая карта, маркетинговый план, питч. Пересмотри их.","После ретеста нажми «Скопировать результаты для Claude» — составим следующий план на 3 месяца."],
terms:[["Повторный тест","Retest"],["Исходные данные","Baseline"],["Прогресс","Progress"],["Оценка","Assessment"],["Пробел в знаниях","Knowledge gap"]],
task:{q:"Средний балл на старте — 3,53 из 5. Если после ретеста стал 4,4, на сколько процентов вырос результат? (Округли до целых.)",a:25,tol:1,u:"%",ex:"(4,4 − 3,53) / 3,53 ≈ 0,246 → около 25% роста за 3 месяца по средней оценке. А по слабым сферам рост может быть вдвое больше."},
real:"Пройди тесты всех 15 сфер во вкладке «Сферы» и запиши, где вырос, где остался на месте, где неожиданно просел."},

"12-2":{c:["Ошибки — самые ценные данные для обучения. Только их нужно <b>собирать и разбирать</b>, а не забывать.","<b>Журнал ошибок</b>: тема, твой ответ, правильный ответ, причина. Причин всего три: <b>не знал</b>, <b>не понял</b>, <b>невнимательность</b>.","На каждую причину своё лекарство. «Не знал» — повтори урок. «Не понял» — объясни своими словами или спроси Claude. «Невнимательность» — заведи правило проверки.","<b>Метод Фейнмана</b>: объясни тему простыми словами, как ребёнку. Где запнулся — там пробел. Вернись к материалу и объясни снова.","Самые частые ошибки предпринимателей те же, что в задачах: путать прибыль и деньги, забывать налоги и спред, верить средним цифрам."],
terms:[["Журнал ошибок","Error log"],["Корневая причина","Root cause"],["Метод Фейнмана","Feynman technique"],["Обратная связь","Feedback"],["Рефлексия","Reflection"]],
task:{q:"Из 40 ошибок за 3 месяца 22 — из-за невнимательности. Какая это доля, %?",a:55,tol:0,u:"%",ex:"22 / 40 = 55%. Больше половины ошибок лечится не учёбой, а привычкой проверять: перечитай условие и пересчитай ответ."},
real:"Выпиши 10 своих главных ошибок за 3 месяца в академии и на работе. Для каждой — причина и правило, чтобы не повторять."},

"12-3":{c:["Мозг забывает до 70% нового за первые дни — это <b>кривая забывания</b>. Лекарство — <b>интервальное повторение</b>.","Схема: повтори через <b>1, 3, 7 и 21 день</b> после изучения. Каждое повторение короче предыдущего, а память крепче.","<b>Активное вспоминание</b> работает лучше перечитывания: закрой материал и попробуй сам рассказать или решить. Трудно — значит работает.","<b>Чередование</b>: смешивай темы в одной сессии — финансы, налоги, маркетинг. Сложнее, но знания связываются и лучше применяются в жизни.","Лучший способ запомнить — <b>научить другого</b>. Расскажи коллеге про точку безубыточности или про Инкотермс — и тема станет твоей навсегда."],
terms:[["Интервальное повторение","Spaced repetition"],["Кривая забывания","Forgetting curve"],["Активное вспоминание","Active recall"],["Чередование тем","Interleaving"],["Закрепление","Retention"]],
task:{q:"Повторения по схеме: через 1, 3, 7 и 21 день после урока. На какой день после урока будет 4-е повторение?",a:21,tol:0,u:"день",ex:"1-е — на 1-й день, 2-е — на 3-й, 3-е — на 7-й, 4-е — на 21-й. Потом можно повторять раз в 2 месяца."},
real:"Выбери 3 самые слабые темы и объясни каждую вслух за 2 минуты, как будто учишь друга. Где запнулся — вернись к уроку."},

"12-4":{c:["Учёба без действия — хобби. Следующие 3 месяца — переход <b>от знаний к первым деньгам</b> своего бизнеса.","Формат <b>OKR</b>: одна вдохновляющая <b>цель</b> и 3 измеримых <b>ключевых результата</b>. Например: «Запустить сорсинг» → 30 интервью, 3 пробных заказа, первые 1 000 $ комиссии.","<b>12 недель — это «год»</b>: короткий горизонт создаёт срочность. План по неделям, обзор каждое воскресенье, как в академии.","Баланс — главное: работа в «Хлебнике», 2 часа английского, IELTS, поступление в WKU и бизнес. Реши, что важнее в каждом месяце, и защищай это время.","Считай воронку от цели: нужное число клиентов → разговоров → сообщений. Так цель превращается в ежедневное действие."],
terms:[["Цели и ключевые результаты","OKR — Objectives and key results"],["Ключевой результат","Key result"],["Цель","Objective"],["Приоритет","Priority"],["Обзор итогов","Review"]],
task:{q:"Цель — 3 платящих клиента за 12 недель. Из разговора в клиента конвертируется 10%, из сообщения в разговор — 20%. Сколько сообщений нужно отправить?",a:150,tol:0,u:"сообщений",ex:"3 / 10% = 30 разговоров / 20% = 150 сообщений — примерно 13 в неделю или 2 в день. Цель стала ежедневной задачей."},
real:"Сформулируй OKR на следующие 3 месяца: 1 цель и 3 измеримых ключевых результата. Посчитай, что нужно делать каждый день."},

"12-5":{c:["Ты прошёл путь, который большинство предпринимателей проходит годами на ошибках: финансы, налоги, международная торговля, маркетинг, стратегия, инвестиции, технологии.","Посмотри на профиль: ранг, опыт, серия дней, достижения, сданные проекты. Это не баллы, а <b>доказательство дисциплины</b> — главного навыка основателя.","Что дальше: новые полные тренажёры по сферам (продажи, переговоры, финмодели), запуск MVP одной идеи, подготовка к WKU и поездке в США.","Привычки, которые надо сохранить: утренняя ЦП-тренировка, еженедельный обзор цифр, разбор ошибок, интервальное повторение.","Отметь результат. Ты стал предпринимателем, который <b>считает, проверяет и действует</b>, а не просто мечтает."],
terms:[["Подведение итогов","Wrap-up"],["Веха","Milestone"],["Дисциплина","Discipline"],["Привычка","Habit"],["Следующие шаги","Next steps"]],
task:{q:"За 12 недель было 60 уроков. Ты прошёл 54. Какой процент выполнения?",a:90,tol:0,u:"%",ex:"54 / 60 = 90%. Отличный результат. Оставшиеся 6 уроков — первые кандидаты на повторение."},

"fm-1":{c:["Финмодель читают в определённом порядке, а не сверху вниз. За 5 минут: <b>допущения</b> → <b>выручка</b> → <b>маржа</b> → <b>точка безубыточности</b> → <b>график денег</b> → <b>сколько нужно денег</b> → <b>сценарии</b>.","Первым делом открой <b>допущения</b>. Модель не умнее своих вводных: если средний чек или трафик взяты с потолка, всё остальное — красивая фантазия.","Главный вопрос — не «какая прибыль», а <b>сколько денег нужно до выхода в плюс</b>. Это самая глубокая точка накопленного денежного потока, а не сумма вложений: к ним добавляются убытки первых месяцев.","Второй главный вопрос — <b>когда окупится</b>: месяц, в котором накопленный поток выходит в ноль. И сравни с депозитом: окупаемость 4 года при риске — плохая сделка.","Третий — <b>что сломает модель</b>. Найди 2–3 допущения, от которых зависит всё (обычно трафик, чек, аренда), и спроси: а если они хуже на 20%?"],
terms:[["Финансовая модель","Financial model"],["Допущения","Assumptions"],["Накопленный денежный поток","Cumulative cash flow"],["Потребность в финансировании","Funding requirement"],["Окупаемость","Payback"]],
task:{q:"Вложения в точку — 4 млн ₽. Но самая глубокая точка накопленного денежного потока — минус 5,2 млн ₽ на 7-м месяце. Сколько денег нужно с запасом 20%, ₽?",a:6240000,tol:0,u:"₽",ex:"5,2 млн × 1,2 = 6,24 млн ₽. Если взять только 4 млн «на вложения», деньги кончатся на 4–5-м месяце — с открытой, но ещё убыточной точкой."},
real:"Открой сайт любой франшизы пекарни или кофейни с обещанием «окупаемость за N месяцев». Выпиши, какие цифры они показывают, а каких не хватает, чтобы им поверить."},

"fm-2":{c:["Сердце модели — лист <b>«Допущения»</b>: все вводные цифры в одном месте. Средний чек, трафик, конверсия, аренда за м², зарплаты, себестоимость, налоги, вложения.","Правила профи: ячейки ввода — <b>синим</b>, формулы — <b>чёрным</b>. <b>Никаких цифр внутри формул</b>: только ссылки на допущения. Поменял чек в одном месте — пересчиталась вся модель.","У каждой цифры есть <b>единица</b> (₽, ₽/м²/мес, чеков/день, %) и <b>источник</b>: «данные «Хлебника»», «Авито, 5 объявлений», «допущение». Так модель можно проверить.","Аренду в коммерции часто дают <b>за м² в месяц или в год</b> — переводи всё к одной единице. Ошибка в единицах — самая частая и дорогая.","Структура файла: Допущения → Выручка → Затраты → P&L → Денежный поток → Итоги и графики. Каждый лист опирается на предыдущие."],
terms:[["Входные данные","Inputs"],["Захардкоженное значение","Hardcoded value"],["Ссылка на ячейку","Cell reference"],["Единица измерения","Unit"],["Источник данных","Data source"]],
task:{q:"Аренда — 2 400 ₽ за м² в месяц, площадь — 85 м². Сколько стоит аренда за год, ₽?",a:2448000,tol:0,u:"₽",ex:"2 400 × 85 = 204 000 ₽ в месяц × 12 = 2 448 000 ₽ в год. Перепутай «за месяц» и «за год» — и ошибка в модели будет в 12 раз."},
real:"Создай в Google Таблицах лист «Допущения» для пекарни: 15 вводных с единицами и источником. Ячейки ввода выдели синим."},

"fm-3":{c:["Выручку строят <b>по драйверам</b>: чеков в день × средний чек × дни. Для чеков — трафик × конверсия. Каждый драйвер проверяется отдельно.","Точка не выходит на план в первый день. Закладывай <b>выход на план</b> (ramp-up): например, 40% → 60% → 80% → 100% за 4 месяца. Модель с «100% с первого месяца» — красный флаг.","<b>Сезонность</b>: у пекарни летом может быть спад, у кофейни у офиса — провал в праздники. Добавь коэффициенты по месяцам, если знаешь их по факту.","Средний чек тоже растёт: допродажи, повышение цен раз в год. Но расти он должен медленно и обоснованно, не на 20% в год «просто так».","Сверяйся с реальностью: выручка твоей точки на м² и в день должна быть похожа на выручку похожих точек сети. Если твоя в 2 раза выше — ищи ошибку."],
terms:[["Выход на плановые показатели","Ramp-up"],["Сезонность","Seasonality"],["Средний чек","Average check / Ticket size"],["Выручка на м²","Sales per square meter"],["Драйвер","Driver"]],
task:{q:"План — 3 000 чеков в месяц. Выход на план: 1-й месяц 40%, 2-й 60%, 3-й 80%, дальше 100%. Сколько чеков за первые 3 месяца?",a:5400,tol:0,u:"чеков",ex:"3 000 × (0,4 + 0,6 + 0,8) = 5 400 чеков вместо 9 000 при «плане с первого дня». Минус 40% выручки за квартал — и это нормально."},
real:"Найди на сайте франшизы пекарни заявленную выручку точки и переведи её в чеки в день: выручка / средний чек / 30. Реалистично для их локаций?"},

"fm-4":{c:["Затраты делятся на три группы. <b>Разовые вложения</b> (CAPEX): ремонт, оборудование, вывеска, депозит аренды, первая закупка.","<b>Постоянные</b> (OPEX): аренда, зарплаты, коммуналка, связь, бухгалтерия, охрана. Есть, даже если нет продаж.","<b>Переменные</b>: сырьё и заморозка, упаковка, эквайринг (~1,5–2%), роялти и маркетинговый сбор франшизы — в процентах от выручки.","Типичные ошибки: зарплаты без взносов (закладывай × 1,5 к сумме «на руки»), аренда без индексации (обычно +5–10% в год), нет резерва на ремонт оборудования, забыты налоги.","Отдельной строкой — <b>непредвиденные расходы</b>: 5–10% от вложений. Ремонт всегда дороже сметы."],
terms:[["Капитальные затраты","CAPEX — Capital expenditures"],["Операционные затраты","OPEX — Operating expenses"],["Фонд оплаты труда","Payroll"],["Индексация","Indexation"],["Непредвиденные расходы","Contingency"]],
task:{q:"В точке 4 сотрудника, каждый хочет 60 000 ₽ «на руки». Сколько закладывать в модель на зарплаты в месяц с коэффициентом 1,5, ₽?",a:360000,tol:0,u:"₽",ex:"4 × 60 000 × 1,5 = 360 000 ₽, а не 240 000. Разница — 120 000 ₽ в месяц, или 1,44 млн ₽ в год, которых не было бы в модели."},
real:"Раздели затраты пекарни на разовые, постоянные и переменные — минимум по 5 статей в каждой группе, с примерными суммами."},

"fm-5":{c:["P&L по месяцам: Выручка − Себестоимость = <b>Валовая прибыль</b> − Постоянные расходы = <b>EBITDA</b> − Амортизация − Проценты − Налоги = <b>Чистая прибыль</b>.","<b>EBITDA</b> — прибыль до процентов, налогов и амортизации. Её любят инвесторы и франчайзеры: она показывает, сколько денег генерирует сама операционная деятельность.","На УСН 6% налог считается от выручки, а не от прибыли. В модели он зависит от продаж даже в убыточный месяц.","Смотри на <b>доли</b> каждой строки в выручке. Ориентиры для общепита: себестоимость 30–40%, аренда до 15–20%, ФОТ 20–30%. Выходишь за них — проблема.","P&L отвечает на вопрос «зарабатываем ли». На вопрос «хватит ли денег» отвечает денежный поток — следующий урок."],
terms:[["Прибыль до процентов, налогов и амортизации","EBITDA"],["Амортизация","Depreciation & amortization"],["Операционная прибыль","Operating profit / EBIT"],["Структура затрат","Cost structure"],["Доля в выручке","% of revenue"]],
task:{q:"Выручка — 1,5 млн ₽, себестоимость — 35% выручки, аренда — 250 тыс., ФОТ — 360 тыс., прочее — 90 тыс. Чему равна EBITDA, ₽?",a:275000,tol:0,u:"₽",ex:"1 500 000 − 525 000 − 250 000 − 360 000 − 90 000 = 275 000 ₽. Рентабельность по EBITDA — 18%. Для пекарни это нормально."},
real:"Собери в таблице P&L пекарни на 12 месяцев по своим допущениям: выручка, себестоимость, валовая прибыль, постоянные, EBITDA, налог, чистая прибыль."},

"fm-6":{c:["Денежный поток показывает, <b>хватит ли денег</b>. Начало: минус вложения в месяце 0. Дальше каждый месяц: плюс поступления, минус платежи.","График накопленного потока похож на букву <b>J</b>: сначала вниз (вложения и убытки на выходе на план), потом разворот и рост. Нижняя точка — сколько нужно денег, пересечение нуля — окупаемость.","Деньги и прибыль расходятся: депозит аренды, предоплата поставщикам, запасы, налоги по кварталам. Всё это — в денежном потоке, даже если не в P&L.","<b>Срок окупаемости</b> — месяц, когда накопленный поток впервые ≥ 0. <b>ROI за 3 года</b> = (накоплено к 36-му месяцу) / вложения.","Правило для франшиз: окупаемость меньше 12 месяцев обычно слишком хороша, чтобы быть правдой. 18–30 месяцев — честная зона для общепита."],
terms:[["Денежный поток","Cash flow"],["J-образная кривая","J-curve"],["Срок окупаемости","Payback period"],["Нижняя точка потока","Cash trough"],["Окупаемость инвестиций","ROI"]],
task:{q:"Вложения — 3 млн ₽ в месяце 0. Поток: 1-й месяц −200 тыс., 2-й −100 тыс., 3-й 0, дальше +200 тыс. каждый месяц. В каком месяце накопленный поток впервые станет ≥ 0?",a:20,tol:0,u:"месяц",ex:"После 3-го месяца накоплено −3,3 млн. Нужно 3,3 / 0,2 = 16,5 месяца плюсов → 17 месяцев. Окупаемость — 3 + 17 = 20-й месяц. Нужно было денег: 3,3 млн, а не 3."},
real:"Добавь в свою модель денежный поток: найди самую глубокую точку и месяц окупаемости. Построй график накопленного потока."},

"fm-7":{c:["Одна модель — это одна догадка. Профи строят <b>3 сценария</b>: пессимистичный, базовый, оптимистичный — и показывают все три.","<b>Анализ чувствительности</b>: меняешь по одному допущению на ±10–20% и смотришь, как меняется прибыль. Так видно, какие цифры критичны.","<b>Операционный рычаг</b>: при больших постоянных расходах небольшое падение выручки сильно бьёт по прибыли. −10% выручки может дать −35% EBITDA.","Таблица «торнадо» ранжирует допущения по влиянию — сверху самые опасные. Обычно это трафик, средний чек и аренда. Их и проверяй лучше всего.","Вывод для решений: идём в проект, только если в пессимистичном сценарии бизнес выживает (деньги не кончаются), а в базовом окупается в разумный срок."],
terms:[["Анализ сценариев","Scenario analysis"],["Анализ чувствительности","Sensitivity analysis"],["Операционный рычаг","Operating leverage"],["Диаграмма «торнадо»","Tornado chart"],["Худший сценарий","Downside case"]],
task:{q:"Базовая модель: выручка 1,5 млн ₽, себестоимость 35% выручки, постоянные расходы 700 тыс. ₽ (EBITDA = 275 тыс.). Выручка упала на 10%, постоянные не изменились. Какая теперь EBITDA, ₽?",a:177500,tol:0,u:"₽",ex:"1 350 000 − 472 500 − 700 000 = 177 500 ₽. Выручка −10%, а EBITDA −35%. Это и есть операционный рычаг."},
real:"Сделай в своей модели 3 сценария и таблицу: как меняется месячная прибыль, если чек и трафик по отдельности меняются на ±10%."},

"fm-8":{c:["Чужие модели — особенно франшиз и стартапов — часто рисуют под продажу. Умение найти враньё экономит миллионы.","<b>10 красных флагов</b>, часть 1: 1) выручка 100% с первого месяца; 2) рост 20–30% каждый месяц годами; 3) нет налогов; 4) зарплаты без взносов; 5) аренда без индексации.","Часть 2: 6) нет оборотного капитала и запасов; 7) нет маркетинга или CAC = 0; 8) выручка посчитана «от рынка», а не по драйверам; 9) нет сценариев; 10) окупаемость меньше 12 месяцев в общепите.","Как проверять: попроси <b>фактические цифры</b> 3–5 работающих точек, а не плановые. Поговори с 2–3 действующими франчайзи без продавца франшизы.","Финальный тест: построй свою модель по их допущениям, но со своими поправками по красным флагам. Разница между их и твоей окупаемостью — честная цена их маркетинга."],
terms:[["Красный флаг","Red flag"],["Проверка обоснованности","Sanity check"],["Фактические данные","Actuals"],["Завышенный прогноз","Overly optimistic forecast"],["Франчайзи","Franchisee"]],
task:{q:"Модель франшизы обещает рост выручки на 30% в месяц 12 месяцев подряд. Во сколько раз вырастет выручка за год? (Округли до целых.)",a:23,tol:1,u:"раз",ex:"1,3¹² ≈ 23,3 раза. Пекарня, которая за год растёт в 23 раза, — фантастика. Красный флаг № 2: такую модель продают, а не считают."},
real:"Возьми финмодель франшизы «Жуковского хлеба» или любую другую и проверь по 10 красным флагам. Запиши, что нашёл и какие цифры попросишь."},

/* ---------- СПЕЦКУРС · КЕЙС «ЖУКОВСКИЙ ХЛЕБ» ---------- */
"fm-9":{c:["Финальный кейс: франшиза <b>«Жуковского хлеба»</b> на заморозке. Разбираем экономику одной точки франчайзи. Публичных цифр сети пока нет, поэтому ниже — <b>учебные допущения</b>. После встречи с сетью заменишь их реальными.","Формат — <b>пекарня-кафе 40–60 м² без производства</b> (bake-off): замороженная выпечка приходит с производства сети, точка только допекает. Плюсы: не нужен пекарь-технолог, меньше площадь и мощность, стабильное качество. Минусы: зависимость от логистики заморозки и дорогое морозильное оборудование.","Допущения: чек <b>380 ₽</b>, <b>160 чеков в день</b> на плане, выход на план за 4 месяца. Себестоимость 38%, роялти 4% + маркетинговый сбор 1%, УСН 6%. Аренда 50 м² × 3 000 ₽ = 150 000. Зарплаты: 4 человека × 55 000 «на руки» × 1,5 = 330 000. Прочие расходы — 80 000.","Вложения ≈ <b>3,2 млн ₽</b>: паушальный взнос 500 тыс., ремонт 900 тыс., оборудование 1,1 млн (конвекционные печи, морозильники, витрины, кофемашина), депозит аренды 150 тыс., первая закупка 150 тыс., запуск 100 тыс., резерв около 300 тыс.","Итог на плане: выручка ≈ <b>1,82 млн ₽</b> в месяц, прибыль ≈ <b>370 тыс. ₽</b>. Сверка с рынком: франшизы пекарен заявляют прибыль 300–350 тыс. ₽ при вложениях 2,7–3,8 млн ₽. Наши допущения в том же коридоре — модель правдоподобна, но не доказана. В конструкторе база окупается примерно за 12 месяцев: это на грани красного флага № 10. В пессимисте (−20% чеков) — за 23 месяца. Честный ответ где-то между, и проверить его можно только фактическими цифрами точек сети."],
terms:[["Точка без производства, допекание","Bake-off store"],["Замороженные полуфабрикаты","Frozen dough products"],["Паушальный взнос","Initial franchise fee"],["Роялти","Royalty"],["Ориентир по рынку","Benchmark"]],
task:{q:"По допущениям кейса: чек 380 ₽, переменные затраты 49% выручки (себестоимость 38% + роялти и сбор 5% + налог 6%), постоянные 560 000 ₽ в месяц. Сколько чеков в день нужно для безубыточности? (Месяц = 30 дней, округли вверх.)",a:97,tol:1,u:"чеков",ex:"Маржа с чека: 380 × 51% = 193,8 ₽. 560 000 / 193,8 ≈ 2 890 чеков в месяц / 30 ≈ 96,3 → 97 чеков в день. При плане 160 запас прочности ≈ 40%."},

"fm-10":{c:["Теперь взгляд с другой стороны — <b>франчайзера</b>. Он зарабатывает тремя способами: <b>паушальный взнос</b> (разово), <b>роялти</b> (% выручки каждый месяц) и <b>наценка на продукцию</b>. Для сети с собственным производством заморозки третий источник часто главный.","Расчёт на одну точку на плане (учебно): роялти 4% × 1,82 млн ≈ <b>73 тыс. ₽</b> в месяц. Маркетинговый сбор 1% ≈ 18 тыс. уходит в рекламный фонд сети — это не прибыль.","Заморозка: если она составляет около 28% выручки точки (≈ 511 тыс. ₽) при марже производства 25%, сеть зарабатывает ≈ <b>128 тыс. ₽</b> в месяц. Итого одна точка приносит сети около <b>200 тыс. ₽</b> в месяц плюс 500 тыс. разово.","10 точек — около 2 млн ₽ в месяц без вложений в собственные точки. Это главный аргумент для собственника «Жуковского хлеба». Но производство должно выдержать объём: спроси про мощности.","Твоя доля — предмет переговоров. Пример: 30% паушального взноса за привлечение франчайзи и подбор помещения + 20% роялти в течение 3 лет с каждой твоей точки. Только письменно: срок, база расчёта, что будет при расторжении. Финал курса — проект: собери полную модель в таблице и принеси её на встречу."],

const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const T1=ld('academy1')||{};T1.res=T1.res||{};T1.ans=T1.ans||{};
let S=ld('academy2')||{xp:0,days:{},done:{},real:{},proj:{},notes:{},ach:[]};
const save=()=>{try{localStorage.setItem('academy2',JSON.stringify(S));localStorage.setItem('academy1',JSON.stringify(T1))}catch(e){}};
const $=s=>document.querySelector(s);
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());
function toast(t){const e=$('#toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2400)}
function vpDays(){const v=ld('vp2');return v&&v.days?Object.keys(v.days).filter(k=>v.days[k].done):[]}
function active(k){return !!S.days[k]||vpDays().includes(k)}
function streak(){let n=0,d=new Date();if(!active(dkey(d)))d.setDate(d.getDate()-1);while(active(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function totalXP(){return S.xp+vpDays().length*XP.vp}
function rank(x){let r=0;RANKS.forEach((k,i)=>{if(x>=k[1])r=i});return r}
function stats(){return{lessons:Object.keys(S.done).length,streak:streak(),real:Object.keys(S.real).length,projects:Object.keys(S.proj).length,vp:vpDays().length,xp:totalXP(),mastered:Object.values(T1.res).filter(v=>v>=5).length}}
function addXP(n,why){const before=rank(totalXP());S.xp+=n;S.days[today()]=1;save();toast('+'+n+' XP · '+why);
const after=rank(totalXP());if(after>before)setTimeout(()=>toast('👑 Новый ранг: '+RANKS[after][0]),2600);checkAch()}
function checkAch(){const s=stats();ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[3](s)){S.ach.push(a[0]);save();setTimeout(()=>toast(a[1]+' Достижение: '+a[2]),5200)}})}
function weekIdx(){const d=(new Date(today())-new Date(START))/864e5;return Math.max(0,Math.min(11,Math.floor(d/7)))}
function dayIdx(){const g=new Date().getDay();return g===0?6:g-1} // 0=пн

<div class="card hl"><div class="row"><div class="grow"><div class="mut">Ранг</div><h2 style="margin:0">${RANKS[r][0]}</h2></div><div style="text-align:right"><div class="mut">Опыт</div><b class="gold serif" style="font-size:22px">${x} XP</b></div></div>
<div class="bar"><i style="width:${nx?Math.min(100,(x-RANKS[r][1])/(nx[1]-RANKS[r][1])*100):100}%"></i></div><div class="mut">${nx?'До ранга «'+nx[0]+'» — '+(nx[1]-x)+' XP':'Максимальный ранг'}</div></div>
<div class="stats"><div class="stat"><b>${streak()}</b><span>дней подряд</span></div><div class="stat"><b>${Object.keys(S.done).length}</b><span>уроков</span></div><div class="stat"><b>${Object.keys(S.real).length}</b><span>дел в жизни</span></div></div>

const FMDEF={check:450,perDay:120,ramp:4,cogs:35,roy:0,rent:250000,fot:360000,other:90000,tax:6,invest:3500000};

const FMLAB=[["check","Средний чек","₽"],["perDay","Чеков в день при выходе на план","шт."],["ramp","Месяцев до выхода на план (старт с 40%)","мес."],["cogs","Себестоимость","% выручки"],["roy","Роялти и маркетинговый сбор","% выручки"],["rent","Аренда","₽/мес"],["fot","Зарплаты с взносами","₽/мес"],["other","Прочие постоянные","₽/мес"],["tax","Налог (УСН 6% — от выручки)","% выручки"],["invest","Вложения на старте","₽"]];
let FM=Object.assign({},FMDEF,S.fm||{}),SC=1;

function fmCalc(p,sc){const rows=[];let cum=-p.invest,min=cum,minM=0,pay=null;const fixed=p.rent+p.fot+p.other;
for(let m=1;m<=36;m++){const r=p.ramp<=1?1:Math.min(1,0.4+0.6*(m-1)/(p.ramp-1));const rev=p.perDay*30*r*sc*p.check;
const prof=rev*(1-(p.cogs+p.roy+p.tax)/100)-fixed;cum+=prof;if(cum<min){min=cum;minM=m}if(pay===null&&cum>=0)pay=m;rows.push({m,rev,prof,cum})}
const unit=p.check*(1-(p.cogs+p.roy+p.tax)/100);const bep=unit>0?fixed/unit/30:Infinity;
return{rows,min,minM,pay,bep,full:rows[35],roi:(rows[35].cum)/p.invest}}

$('#bk').onclick=()=>viewCourse('fm');
document.querySelectorAll('input[data-f]').forEach(i=>i.oninput=()=>{const v=parseFloat(String(i.value).replace(',','.'));if(!isNaN(v)){FM[i.dataset.f]=v;S.fm=FM;save();fmRender()}});
$('#rst').onclick=()=>{FM=Object.assign({},FMDEF);S.fm=FM;save();viewBuilder()};
$('#pzh').onclick=()=>{FM=Object.assign({},FMZH);S.fm=FM;save();viewBuilder()};
document.querySelectorAll('#scn button').forEach(b=>b.onclick=()=>{SC=+b.dataset.s;document.querySelectorAll('#scn button').forEach(x=>x.classList.toggle('g',x===b));fmRender()});
$('#cpm').onclick=()=>{const R=fmCalc(FM,SC);copy('Разбери мою финмодель как инвестор и финансовый директор. Найди слабые допущения и красные флаги.\n\nДопущения:\n'+FMLAB.map(f=>`${f[1]}: ${FM[f[0]]} ${f[2]}`).join('\n')+`\nСценарий: ×${SC}\n\nИтоги: выручка на плане ${rub(FM.perDay*30*SC*FM.check)} ₽/мес, прибыль на плане ${rub(R.full.prof)} ₽/мес, точка безубыточности ${Math.ceil(R.bep)} чеков/день, нужно денег ${rub(-R.min)} ₽ (дно на ${R.minM}-м мес.), окупаемость ${R.pay?R.pay+'-й месяц':'нет за 36 мес.'}, ROI за 3 года ${Math.round(R.roi*100)}%.`)};
fmRender()}
function fmRender(){const R=fmCalc(FM,SC),w=320,h=150,pd=24;const vals=R.rows.map(r=>r.cum);const mn=Math.min(-FM.invest,...vals),mx=Math.max(0,...vals);
const xs=i=>pd+i*(w-2*pd)/36,ys=v=>pd+(mx-v)/((mx-mn)||1)*(h-2*pd);const pts=[[0,-FM.invest],...R.rows.map(r=>[r.m,r.cum])].map(p=>xs(p[0])+','+ys(p[1])).join(' ');
const k=(t,v,s)=>`<div class="stat"><b style="font-size:17px">${v}</b><span>${t}${s?'<br>'+s:''}</span></div>`;
$('#out').innerHTML=`<div class="stats">${k('Прибыль/мес на плане',rub(R.full.prof/1000)+' т')}${k('Безубыточность',Math.ceil(R.bep),'чеков в день')}${k('Нужно денег',(Math.round(-R.min/1e5)/10).toLocaleString('ru-RU')+' млн','дно: '+R.minM+'-й мес.')}</div>
<div class="stats">${k('Окупаемость',R.pay?R.pay+'-й мес.':'> 36 мес.')}${k('ROI за 3 года',Math.round(R.roi*100)+'%')}${k('Выручка на плане',(Math.round(FM.perDay*30*SC*FM.check/1e5)/10).toLocaleString('ru-RU')+' млн','в месяц')}</div>
<div class="card"><h3>Накопленный денежный поток, 36 мес.</h3><svg viewBox="0 0 ${w} ${h}" width="100%"><line x1="${pd}" x2="${w-pd}" y1="${ys(0)}" y2="${ys(0)}" stroke="#8f8a80" stroke-dasharray="4" opacity=".6"/><text x="${w-pd}" y="${ys(0)-4}" font-size="10" text-anchor="end" fill="#8f8a80">0 ₽</text>
<polyline points="${pts}" fill="none" stroke="#d6b25e" stroke-width="2.5"/><circle cx="${xs(R.minM)}" cy="${ys(R.min)}" r="4" fill="#e06a5f"/>${R.pay?`<circle cx="${xs(R.pay)}" cy="${ys(R.rows[R.pay-1].cum)}" r="4" fill="#5fbf7f"/>`:''}</svg>
<p class="mut">🔴 дно — сколько нужно денег · 🟢 окупаемость</p></div>
<div class="card"><h3>Первые 12 месяцев, тыс. ₽</h3><div class="term"><b>Мес.</b><b>Выручка</b><b>Прибыль</b><b>Накоплено</b></div>${R.rows.slice(0,12).map(r=>`<div class="term"><span>${r.m}</span><span>${rub(r.rev/1000)}</span><span style="color:${r.prof<0?'#e06a5f':'#5fbf7f'}">${rub(r.prof/1000)}</span><em>${rub(r.cum/1000)}</em></div>`).join('')}</div>
<div class="card"><h3>Как читать</h3><p class="mut">${R.pay?`Точка окупится на ${R.pay}-м месяце.`:'За 3 года точка не окупается — меняй допущения или отказывайся.'} Денег нужно ${rub(-R.min)} ₽, а не ${rub(FM.invest)} ₽: разница — убытки выхода на план. ${R.full.prof<0?'На плане точка убыточна: постоянные расходы выше маржи.':'Проверь пессимистичный сценарий: если там деньги кончаются — риск слишком высокий.'}</p></div>`}

async function copy(t){try{await navigator.clipboard.writeText(t);toast('Скопировано — вставь в чат с Claude')}catch(e){toast('Не удалось скопировать')}}
checkAch();show('today');
</script>
