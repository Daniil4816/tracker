<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бизнес-академия</title>
<meta name="apple-mobile-web-app-title" content="Академия">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0e">
<link rel="apple-touch-icon" href="academy-icon.png">
<link rel="icon" href="academy-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--card:#151518;--card2:#1c1c20;--ink:#f3efe6;--mut:#8f8a80;--gold:#d6b25e;--gold2:#a8833a;--line:#2a2a2f;--ok:#5fbf7f;--bad:#e06a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:auto;padding:14px 18px calc(96px + env(safe-area-inset-bottom))}
.serif{font-family:"Playfair Display",Georgia,serif}
h1{font:700 28px/1.2 "Playfair Display",Georgia,serif;margin:10px 0 4px}
h2{font:700 21px/1.25 "Playfair Display",Georgia,serif;margin:4px 0 8px}
h3{font-size:16px;margin:0 0 6px;font-weight:600}
.mut{color:var(--mut);font-size:14px}
.gold{color:var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
.card.hl{background:linear-gradient(160deg,#1f1b12 0%,#151518 60%);border-color:#3a3220}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#141414;font-weight:700;border-radius:14px;padding:14px 18px;margin-top:12px;font-size:16px;font-family:inherit}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.4}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin:0 6px 6px 0}
.pill.g{border-color:#4a3e22;color:var(--gold);background:#1d1910}
.pill.ok{border-color:#24482f;color:var(--ok)}
.bar{height:6px;background:#26262b;border-radius:9px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font:700 22px "Playfair Display",serif;color:var(--gold)}.stat span{font-size:12px;color:var(--mut)}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
.ic.done{background:#1d1910;border-color:#4a3e22}
.chev{color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(12,12,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button span{font-size:20px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--gold)}.tabs button.on span{filter:none;opacity:1}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:13px;margin:8px 0;font:15px Inter,sans-serif}
.opt.good{border-color:var(--ok);background:#13241a}.opt.badc{border-color:var(--bad);background:#2a1513}
input[type=number],input[type=text],textarea{width:100%;font:16px Inter,sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
textarea{min-height:110px}
.lesson-card{min-height:52vh;display:flex;flex-direction:column}
.lesson-card .body{flex:1;font-size:17px;line-height:1.6}
.lesson-card .body b{color:var(--gold)}
.dots{display:flex;gap:5px;margin:4px 0 14px}.dots i{flex:1;height:4px;border-radius:4px;background:#2a2a2f}.dots i.on{background:var(--gold)}
.term{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.term em{color:var(--gold);font-style:normal;text-align:right}
.back{background:none;border:0;color:var(--gold);font:600 16px Inter,sans-serif;padding:6px 0}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.map div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.map .l0{background:#3a1714;color:#ffb4aa;border-color:#5a2520}.map .l1{background:#3a2c12;color:#f3cf7a;border-color:#5a4520}.map .l2{background:#163021;color:#9be3b4;border-color:#25503a}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach div{text-align:center;font-size:11px;color:var(--mut)}
.ach div b{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0 auto 6px;border-radius:50%;font-size:24px;background:var(--card2);border:1px solid var(--line);filter:grayscale(1);opacity:.45}
.ach div.on{color:var(--ink)}.ach div.on b{filter:none;opacity:1;border-color:var(--gold);background:#1d1910}
.week{padding:12px 0;border-top:1px solid var(--line)}.week:first-child{border-top:0}
.week.cur{background:#1d1910;margin:0 -18px;padding:12px 18px;border-top-color:#4a3e22}
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.ov.on{display:flex}.ov .bar2{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.ov iframe{flex:1;border:0;width:100%;background:#f6f4ef}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:linear-gradient(180deg,var(--gold),var(--gold2));color:#141414;font-weight:700;padding:10px 18px;border-radius:12px;font-size:14px;display:none;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--card2);padding:12px;border-radius:12px;color:#cfcac0}
ul.core{padding-left:18px;margin:6px 0}ul.core li{margin:7px 0}
a{color:var(--gold)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs">
<button data-t="today" class="on"><span>☀️</span>Сегодня</button>
<button data-t="plan"><span>🗺️</span>План</button>
<button data-t="spheres"><span>🏛️</span>Сферы</button>
<button data-t="me"><span>🏆</span>Профиль</button>
</nav>
<div class="ov" id="ov"><div class="bar2"><b class="serif">ЦП-тренажёр</b><button class="back" id="ovx">Готово</button></div><iframe id="ovf" title="ЦП-тренажёр"></iframe></div>
<div class="toast" id="toast"></div>
<script>
const SP=[
{n:"Ценностные предложения",b:0,link:"vp.html",core:["Профиль клиента: работы, боли, выгоды","Карта ценности: продукты, обезболивающие, создатели выгод","Формула: кто → боль → измеримый результат → отличие от альтернативы","Тест подстановки: подставь конкурента — если правда, переделывай","12 приёмов прорыва: убрать боль целиком, плата за результат, ускорить в 10 раз…"],
q:[["Что относится к профилю клиента?",["Продукты и услуги","Работы, боли, выгоды","Каналы продаж"],1,"Профиль клиента — правая часть канвы: работы, боли, выгоды."],
["Какое предложение сильнее?",["Качественные услуги по подбору помещений","5 помещений за 72 часа, оплата только после подписания"],1,"Конкретный срок, результат и снятый риск."],
["Главный дефект: «Инновационные решения для вашего бизнеса»",["Нет конкретного клиента","Слишком дорого","Слишком длинно"],0,"Кто клиент — неизвестно."],
["Что такое «работа клиента»?",["Его должность","То, что он пытается сделать или решить","Задача продавца"],1,"Job to be done — задача, ради которой «нанимают» продукт."],
["Что делает предложение трудно копируемым?",["Скидка 10%","Уникальная связка ресурсов или модели, которую долго строить","Красивый логотип"],1,"Скидку повторят завтра, систему — нет."]],
t:["Придумай ценностное предложение для автомойки рядом с бизнес-центром.","Оцени по шкале 0–10 предложение любого банка из рекламы, которую видел сегодня."]},

{n:"Бизнес-модели и юнит-экономика",b:0,core:["Бизнес-модель — как ты создаёшь, доставляешь и забираешь ценность","Юнит — одна единица: заказ, клиент, точка","CAC — стоимость привлечения клиента","LTV — сколько маржи принесёт клиент за всё время","LTV/CAC ≥ 3 — здоровая модель; < 1 — каждый клиент в минус","Маржинальность = (цена − переменные затраты) / цена"],
q:[["Клиент приносит 3 000 ₽ маржи в месяц и остаётся 10 месяцев. LTV?",["3 000 ₽","30 000 ₽","300 000 ₽"],1,"3 000 × 10 = 30 000 ₽."],
["LTV = 30 000 ₽, CAC = 12 000 ₽. Модель здоровая?",["Да, отлично","Пограничная: 2,5 — ниже ориентира 3","Убыточная"],1,"30 000 / 12 000 = 2,5. Работает, но запаса мало."],
["Цена 500 ₽, себестоимость 300 ₽. Маржинальность?",["40%","60%","67%"],0,"(500 − 300) / 500 = 40%."],
["Что такое юнит-экономика?",["Бухгалтерия по юнитам компании","Прибыль или убыток на одной единице продаж","Экономика стартапов"],1,"Если в минусе один юнит — масштаб только умножит убыток."],
["Модель «база бесплатно, расширенные функции платно» называется…",["Подписка","Freemium","Франшиза"],1,"Freemium: Duolingo, Zoom, Telegram Premium."]],
t:["Посчитай юнит-экономику кофейни навынос: средний чек, себестоимость, сколько чашек в день нужно для окупаемости аренды 150 000 ₽.","Распиши бизнес-модель своей работы в «Хлебнике»: кто платит, за что, какие затраты на одно подписанное помещение."]},

{n:"Проверка идей и MVP",b:0,core:["Гипотеза + критерий успеха: «если X, то Y, проверим так, успех = Z»","MVP — самая дешёвая версия, чтобы проверить гипотезу, а не «плохой продукт»","Лучший сигнал спроса — деньги (предоплата), а не «интересно»","Интервью: спрашивай о прошлом поведении, не «купили бы вы»","Smoke test: лендинг или пост с кнопкой «купить» до создания продукта"],
q:[["Какой сигнал спроса самый надёжный?",["«Классная идея!»","Лайки под постом","Предоплата"],2,"Слова бесплатны, деньги — нет."],
["Какой вопрос в интервью правильный?",["Купили бы вы такой сервис?","Как вы решали эту задачу в последний раз?","Сколько бы вы заплатили?"],1,"Прошлое поведение не врёт, прогнозы про будущее — врут."],
["MVP — это…",["Первая полная версия продукта","Минимальный способ проверить ключевую гипотезу","Дешёвая копия конкурента"],1,"Иногда MVP — это таблица и Telegram, а не приложение."],
["Чего не хватает гипотезе «Людям понравится доставка хлеба»?",["Красивого названия","Измеримого критерия успеха и сегмента","Инвестора"],1,"Кому, сколько, как поймём, что «да»."],
["Лендинг с кнопкой «Заказать» до создания продукта — это…",["Обман клиентов","Smoke test для проверки спроса","Таргет"],1,"Измеряешь клики и заявки и честно сообщаешь о запуске позже."]],
t:["Сформулируй 3 гипотезы для идеи «лиды для брокеров в США» с критериями успеха.","Придумай MVP для своей идеи, который можно запустить за 3 дня и за 0 ₽."]},

{n:"Продажи и переговоры",b:1,core:["Воронка: лиды → контакт → встреча → предложение → сделка","SPIN: ситуационные, проблемные, извлекающие, направляющие вопросы","На хорошей встрече больше говорит клиент","Возражение — запрос информации: сначала уточни, потом отвечай","Закрытие: всегда договорённость о следующем шаге с датой","Переговоры: знай свою BATNA — лучшую альтернативу без сделки"],
q:[["200 лидов → 20 встреч → 5 сделок. Конверсия из лида в сделку?",["2,5%","5%","25%"],0,"5 / 200 = 2,5%."],
["Клиент говорит «дорого». Первое действие?",["Дать скидку","Уточнить: по сравнению с чем?","Перечислить преимущества"],1,"Сначала пойми, с чем он сравнивает."],
["Кто больше говорит на сильной встрече?",["Продавец","Клиент","Поровну"],1,"Вопросы продают лучше презентаций."],
["Что такое BATNA?",["Скидка для клиента","Лучшая альтернатива, если сделка не состоится","Тип контракта"],1,"Сильная альтернатива — сильная позиция."],
["Как закончить встречу правильно?",["«Подумайте и позвоните»","Договориться о конкретном следующем шаге и дате","Отправить прайс"],1,"Без следующего шага сделка умирает."]],
t:["Напиши 5 SPIN-вопросов для собственника помещения, который не хочет сдавать пекарне.","Отработай возражение «у нас уже есть брокер» — 3 разных ответа."]},

{n:"Маркетинг",b:1,core:["Позиционирование — какое место ты занимаешь в голове клиента относительно альтернатив","Сегментация: не «все», а группы с общей болью","4P: продукт, цена, место, продвижение","AIDA: внимание → интерес → желание → действие","Бренд — обещание, которое ты стабильно выполняешь","Каналы: выбирай 1–2, где точно есть твой клиент"],
q:[["Позиционирование — это…",["Логотип и цвета","Место в голове клиента относительно альтернатив","Расположение магазина"],1,"«Самый быстрый», «самый надёжный» — выбери одно."],
["Что входит в 4P?",["Продукт, цена, место, продвижение","План, прибыль, персонал, процесс","Партнёры, платформа, покупатель, пиар"],0,"Product, Price, Place, Promotion."],
["Порядок AIDA?",["Действие → интерес → желание → внимание","Внимание → интерес → желание → действие","Интерес → внимание → действие → желание"],1,"Attention, Interest, Desire, Action."],
["Лучший старт для малого бизнеса с маленьким бюджетом?",["Реклама везде понемногу","1–2 канала, где точно есть клиент","Билборды"],1,"Фокус бьёт распыление."],
["Бренд — это прежде всего…",["Дизайн","Обещание, которое стабильно выполняется","Слоган"],1,"Дизайн — упаковка обещания."]],
t:["Опиши позиционирование ВкусВилла и Пятёрочки в одном предложении каждое.","Выбери 2 канала продвижения для сорсинга из Вэньчжоу и объясни, почему именно они."]},

{n:"Цифровой маркетинг и аналитика",b:1,core:["CTR = клики / показы","CPA (CPL) = расход / число заявок","Конверсия = целевые действия / посетители","ROMI = (доход от маркетинга − расход) / расход","UTM-метки — видно, из какого источника пришёл клиент","Решения по цифрам, а не по ощущениям"],
q:[["10 000 показов, 150 кликов. CTR?",["0,15%","1,5%","15%"],1,"150 / 10 000 = 1,5%."],
["Бюджет 30 000 ₽, 60 заявок. Стоимость заявки?",["200 ₽","500 ₽","2 000 ₽"],1,"30 000 / 60 = 500 ₽."],
["1 000 визитов на сайт, 20 заявок. Конверсия?",["2%","20%","0,2%"],0,"20 / 1 000 = 2%."],
["Вложили 50 000 ₽, получили 150 000 ₽ дохода. ROMI?",["300%","200%","150%"],1,"(150 − 50) / 50 = 200%."],
["Зачем UTM-метки?",["Для SEO","Чтобы понять, какой источник привёл клиента","Для дизайна"],1,"Без них не понять, какой канал работает."]],
t:["Реклама: 40 000 ₽, 80 заявок, 8 сделок по 25 000 ₽ маржи. Посчитай CPL, стоимость сделки и ROMI. Стоит продолжать?","Придумай, какие 3 метрики ты бы отслеживал для своего будущего бизнеса каждую неделю."]},

{n:"Финансы",b:2,core:["Прибыль ≠ деньги на счёте: кассовый разрыв убивает прибыльные бизнесы","P&L (ОПиУ): доходы − расходы = прибыль за период","ДДС: реальное движение денег — когда пришли, когда ушли","Баланс: что есть (активы) и откуда (обязательства + капитал)","Точка безубыточности = постоянные расходы / маржа на единицу","Валовая прибыль = выручка − себестоимость"],
q:[["Постоянные расходы 300 000 ₽, маржа с единицы 150 ₽. Точка безубыточности?",["2 000 единиц","450 единиц","20 000 единиц"],0,"300 000 / 150 = 2 000."],
["Компания прибыльна по отчёту, но нечем платить зарплату. Это…",["Невозможно","Кассовый разрыв","Ошибка бухгалтера"],1,"Деньги застряли в дебиторке или запасах."],
["Какой отчёт показывает реальные поступления и платежи?",["P&L","ДДС","Баланс"],1,"P&L — про начисления, ДДС — про живые деньги."],
["Выручка 1 млн, себестоимость 600 тыс., аренда и зарплаты 300 тыс. Валовая прибыль?",["400 тыс.","100 тыс.","700 тыс."],0,"Валовая = 1 000 − 600. Операционная = 100 тыс."],

"1-1":{c:["<b>Выручка</b> — все деньги от продаж. <b>Прибыль</b> — то, что осталось после всех расходов. <b>Денежный поток</b> — деньги, которые реально пришли и ушли со счёта.","Компания может быть <b>прибыльной по отчёту и при этом банкротом</b>. Причина — <b>кассовый разрыв</b>: деньги нужно платить сейчас, а клиенты заплатят потом.","Пример: пекарня продала сети хлеба на 1 млн ₽ с оплатой через 60 дней. По отчёту прибыль есть. А зарплаты, аренду и муку нужно оплатить в этом месяце — денег нет.","Как защищаться: <b>предоплата</b> от клиентов, <b>отсрочка</b> поставщикам, <b>резерв</b> на 2–3 месяца постоянных расходов, <b>платёжный календарь</b>.","Правило предпринимателя: <b>«Выручка — тщеславие, прибыль — здравомыслие, деньги на счёте — реальность»</b>."],
terms:[["Выручка","Revenue"],["Прибыль","Profit"],["Денежный поток","Cash flow"],["Кассовый разрыв","Cash gap"],["Предоплата","Prepayment"]],
task:{q:"Выручка за месяц 800 000 ₽, но клиенты оплатили только 50% (остальное — через 2 месяца). Расходы 600 000 ₽ оплачены полностью. Как изменился остаток на счёте за месяц? (Убыль — со знаком минус.)",a:-200000,tol:0,u:"₽",ex:"Пришло 400 000, ушло 600 000 → −200 000 ₽. Прибыль по отчёту +200 000, а денег на 200 000 меньше. Это и есть кассовый разрыв."},
real:"Открой банковское приложение и посчитай свой личный денежный поток за прошлый месяц: всего пришло − всего ушло. Запиши цифру."},
"1-2":{c:["<b>P&L</b> (ОПиУ, отчёт о прибылях и убытках) показывает, заработал ли бизнес за период.","Структура сверху вниз:<br>Выручка<br>− Себестоимость<br>= <b>Валовая прибыль</b><br>− Операционные расходы (аренда, зарплаты, маркетинг)<br>= <b>Операционная прибыль</b><br>− Проценты и налоги<br>= <b>Чистая прибыль</b>","<b>Себестоимость</b> — затраты, которые растут вместе с продажами: мука, упаковка. <b>Операционные расходы</b> есть, даже если ты ничего не продал.","Смотри не только на итог, но и на <b>доли</b>: какой процент выручки съедает каждая строка. Аренда больше 15–20% выручки для общепита — тревожный сигнал.","P&L считается <b>по начислению</b>: продажа учитывается, когда случилась, а не когда пришли деньги. Поэтому P&L и деньги на счёте расходятся."],
terms:[["Отчёт о прибылях и убытках","P&L / Income statement"],["Себестоимость","COGS"],["Валовая прибыль","Gross profit"],["Операционные расходы","OPEX"],["Чистая прибыль","Net profit"]],
task:{q:"Кофейня за месяц: выручка 1 200 000, себестоимость 400 000, аренда 200 000, зарплаты 350 000, прочее 50 000, налог УСН 6% от выручки. Чистая прибыль, ₽?",a:128000,tol:0,u:"₽",ex:"1 200 000 − 400 000 − 200 000 − 350 000 − 50 000 − 72 000 (6%) = 128 000 ₽. Рентабельность ≈ 10,7%."},
real:"Составь P&L своего месяца: доходы (оклад + бонусы) минус расходы по категориям. Сколько остаётся на учёбу в США? Запиши."},
"1-3":{c:["<b>ДДС</b> (отчёт о движении денежных средств) — это все реальные поступления и платежи. Главный инструмент выживания малого бизнеса.","Деньги движутся в трёх потоках:<br><b>Операционный</b> — клиенты, поставщики, зарплаты<br><b>Инвестиционный</b> — покупка оборудования, ремонт<br><b>Финансовый</b> — кредиты, займы, деньги от инвесторов, дивиденды","Здоровый бизнес зарабатывает деньги в <b>операционном</b> потоке. Если живёшь только за счёт займов в финансовом — это дорога в долги.","<b>Платёжный календарь</b> — ДДС на будущее: по дням видно, когда деньги придут и уйдут. Кассовый разрыв видно заранее, а не в день зарплаты.","Привычка: раз в неделю обновляй платёжный календарь на 4–8 недель вперёд."],
terms:[["ДДС","Cash flow statement"],["Операционная деятельность","Operating activities"],["Инвестиционная","Investing activities"],["Финансовая","Financing activities"],["Платёжный календарь","Payment calendar"]],
task:{q:"На начало месяца на счёте 150 000 ₽. Пришло от клиентов 500 000, оплачено поставщикам 300 000, куплена печь за 200 000, получен заём 100 000. Остаток на конец месяца, ₽?",a:250000,tol:0,u:"₽",ex:"150 + 500 − 300 − 200 + 100 = 250 тыс. ₽. Операционный поток +200, инвестиционный −200, финансовый +100."},
real:"Составь личный платёжный календарь на следующий месяц: даты поступлений (зарплата, бонусы) и платежей. Есть ли дни, когда денег не хватит?"},
"1-4":{c:["<b>Постоянные расходы</b> не зависят от продаж: аренда, оклады. <b>Переменные</b> растут с каждой продажей: сырьё, упаковка, эквайринг.","<b>Маржинальный доход</b> с единицы = цена − переменные затраты. Именно из него оплачиваются постоянные расходы.","<b>Точка безубыточности</b> = постоянные расходы / маржинальный доход с единицы. Столько нужно продать, чтобы выйти в ноль.","<b>Запас прочности</b> — насколько продажи выше точки безубыточности. Если всего на 5%, любой плохой месяц уводит в минус.","Ты подбираешь помещения. Теперь можешь считать, сколько чеков в день нужно точке, чтобы окупить аренду. Это сильный аргумент в переговорах."],
terms:[["Постоянные расходы","Fixed costs"],["Переменные расходы","Variable costs"],["Маржинальный доход","Contribution margin"],["Точка безубыточности","Break-even point"],["Запас прочности","Margin of safety"]],
task:{q:"Пекарня: постоянные расходы 650 000 ₽ в месяц. Средний чек 450 ₽, переменные затраты на чек 180 ₽. Сколько чеков в месяц нужно для безубыточности? (Округли вверх.)",a:2408,tol:1,u:"чеков",ex:"Маржа с чека 450 − 180 = 270 ₽. 650 000 / 270 = 2 407,4 → 2 408 чеков, это около 80 в день."},
real:"Возьми любое помещение, которое ты подбирал для «Хлебника». Прикинь аренду и посчитай, сколько чеков в день нужно точке, чтобы окупить только аренду."},
"1-5":{c:["<b>Баланс</b> — снимок на дату: что у компании есть и откуда это взялось.","Главная формула: <b>Активы = Обязательства + Собственный капитал</b>.","<b>Активы</b>: деньги, оборудование, запасы, <b>дебиторка</b> (тебе должны). <b>Обязательства</b>: кредиты, <b>кредиторка</b> (должен ты).","Большая дебиторка — это деньги, «застрявшие» у клиентов. Частая причина кассовых разрывов.","Связка трёх отчётов: <b>P&L</b> — заработал ли ты, <b>ДДС</b> — где деньги, <b>баланс</b> — сколько стоит бизнес. Предприниматель смотрит на все три."],
terms:[["Баланс","Balance sheet"],["Активы","Assets"],["Обязательства","Liabilities"],["Собственный капитал","Equity"],["Дебиторская задолженность","Accounts receivable"]],
task:{q:"Активы компании 5 000 000 ₽, обязательства 3 200 000 ₽. Собственный капитал, ₽?",a:1800000,tol:0,u:"₽",ex:"5 000 000 − 3 200 000 = 1 800 000 ₽."},
real:"Спроси руководителя или знакомого предпринимателя: «Какой у вашего бизнеса самый большой финансовый риск?» Запиши ответ и что ты из него понял."},

/* ---------- НЕДЕЛЯ 2 · ФИНАНСЫ: МОДЕЛЬ И РЕШЕНИЯ ---------- */
"2-1":{c:["<b>Финмодель</b> — таблица, которая отвечает на 3 вопроса: <b>сколько денег нужно</b>, <b>когда бизнес выйдет в плюс</b> и <b>что будет, если что-то пойдёт не так</b>.","Структура из 5 блоков:<br>1. <b>Допущения</b> — все вводные цифры в одном месте<br>2. <b>Выручка</b> по драйверам<br>3. <b>Затраты</b>: переменные и постоянные<br>4. <b>P&L и ДДС</b> по месяцам<br>5. <b>Итоги</b>: безубыточность, окупаемость, сколько нужно денег","Главное правило — <b>выручка по драйверам</b>, а не «с потолка». Не «продадим на 1 млн», а <b>трафик × конверсия × средний чек × дни</b>. Каждый драйвер можно проверить и обсудить.","<b>Сколько нужно денег</b> = самая глубокая точка накопленного денежного потока: вложения плюс убытки первых месяцев до выхода в плюс. Добавь запас 20–30%: всё всегда дольше и дороже.","Делай <b>3 сценария</b>: пессимистичный, базовый, оптимистичный. И <b>тест чувствительности</b>: что будет, если чек упадёт на 10%, а трафик — на 20%? Инвестор задаст эти вопросы первыми."],
terms:[["Финансовая модель","Financial model"],["Допущения","Assumptions"],["Драйверы выручки","Revenue drivers"],["Анализ сценариев","Scenario analysis"],["Анализ чувствительности","Sensitivity analysis"]],
task:{q:"Мимо пекарни проходит 4 000 человек в день, заходит 3%, средний чек 400 ₽. Какая выручка за месяц (30 дней), ₽?",a:1440000,tol:0,u:"₽",ex:"4 000 × 3% = 120 чеков в день × 400 ₽ = 48 000 ₽ в день × 30 = 1 440 000 ₽. При конверсии 2% было бы 960 000 ₽. Вот почему важны сценарии."},
real:"Выбери помещение, которое видел вживую. Постой у входа 10 минут, посчитай прохожих и пересчитай на день. Построй выручку пекарни там по драйверам: трафик × конверсия × чек."},

"2-2":{c:["Финмодель без юнит-экономики — как машина без приборной панели. Сначала проверь, что <b>один юнит прибыльный</b>, потом масштабируй.","Выбери юнит под бизнес: <b>заказ</b> (доставка), <b>клиент</b> (подписка, сервис), <b>точка</b> (сеть пекарен). Для сорсинга юнит — клиент: он делает много заказов.","<b>LTV</b> = маржа с заказа × заказов в месяц × месяцев жизни клиента.<br><b>CAC</b> = расходы на привлечение / число новых клиентов.<br>Ориентир: <b>LTV/CAC ≥ 3</b>.","<b>Окупаемость CAC</b> = CAC / маржа с клиента в месяц. Если клиент окупается за 3 месяца, а уходит через 2, ты платишь за свой рост из своего кармана.","<b>Когорты</b>: смотри на клиентов, пришедших в одном месяце, — сколько из них осталось через 1, 3, 6 месяцев. Средние цифры прячут правду, когорты её показывают."],
terms:[["Юнит-экономика","Unit economics"],["Стоимость привлечения клиента","CAC — Customer acquisition cost"],["Пожизненная ценность клиента","LTV — Lifetime value"],["Окупаемость CAC","CAC payback period"],["Когорта","Cohort"]],
task:{q:"Клиент сорсинга делает заказ раз в 2 месяца, твоя чистая маржа с заказа — 600 $, клиент работает с тобой 12 месяцев. Его LTV, $?",a:3600,tol:0,u:"$",ex:"12 мес. / 2 = 6 заказов × 600 $ = 3 600 $. При CAC 900 $ соотношение LTV/CAC = 4 — отлично. Окупаемость CAC: 900 / 300 $ в месяц = 3 месяца."},
real:"Посчитай свою юнит-экономику в «Хлебнике»: сколько часов уходит на одно подписанное помещение (поиск, выезды, переговоры) и сколько ты за него получаешь. Сколько ты зарабатываешь в час? Как поднять эту цифру?"},

"2-3":{c:["<b>Оборотный капитал</b> — деньги, «замороженные» в операционке: в <b>запасах</b> и у <b>клиентов</b> (дебиторка), минус то, что ты должен <b>поставщикам</b> (кредиторка).","<b>Финансовый цикл</b> = дни запасов + дни дебиторки − дни кредиторки. Столько дней бизнес живёт на свои деньги между оплатой поставщику и деньгами от клиента.","Сорсинг: фабрике 30% предоплаты и 70% до отгрузки, море 35–45 дней, клиент платит после получения. Ты <b>кредитуешь клиента</b> 2–3 месяца. Без своих денег такой бизнес не вырастет.","Парадокс: <b>чем быстрее растёшь, тем больше денег нужно</b>. Каждый новый заказ замораживает ещё деньги. Прибыльные компании умирают от роста.","Как сократить цикл: <b>предоплата</b> от клиента (50% при заказе), <b>отсрочка</b> у поставщика, меньше запасов, <b>факторинг</b> — банк платит тебе сразу за счёт клиента под процент."],
terms:[["Оборотный капитал","Working capital"],["Запасы","Inventory"],["Кредиторская задолженность","Accounts payable"],["Финансовый цикл","Cash conversion cycle"],["Факторинг","Factoring"]],
task:{q:"Товар лежит на складе 40 дней, клиенты платят через 30 дней после отгрузки, поставщикам ты платишь через 20 дней после получения товара. Финансовый цикл, дней?",a:50,tol:0,u:"дней",ex:"40 + 30 − 20 = 50 дней. Всё это время бизнес финансирует себя сам. Договоришься о 50% предоплаты от клиента — цикл резко сократится."},
real:"Подумай про пекарню: покупатели платят картой в момент покупки, а поставщикам муки часто платят с отсрочкой. Какой у пекарни финансовый цикл? Почему это огромное преимущество перед сорсингом? Запиши выводы."},

"2-4":{c:["<b>ROI</b> (окупаемость инвестиций) = (заработано − вложено) / вложено × 100%. Отвечает на вопрос: сколько принёс каждый вложенный рубль.","<b>Срок окупаемости</b> = вложения / чистая прибыль в месяц. Простой и понятный показатель, но он не учитывает риск и то, что будет после окупаемости.","Деньги сегодня дороже денег завтра. <b>Альтернативная стоимость</b>: вместо бизнеса деньги могли лежать на депозите без риска. Бизнес обязан давать <b>больше депозита плюс премию за риск</b>.","<b>Дисконтирование</b>: 100 000 ₽ через год при ставке 20% стоят сегодня ≈ 83 000 ₽ (100 000 / 1,2). <b>NPV</b> — сумма будущих денежных потоков, приведённых к сегодня, минус вложения. NPV > 0 — проект создаёт ценность.","Быстрая проверка любой инвестиции: 1) срок окупаемости, 2) ROI за 3 года, 3) сравнение с депозитом, 4) что будет в пессимистичном сценарии."],
terms:[["Окупаемость инвестиций","ROI — Return on investment"],["Срок окупаемости","Payback period"],["Альтернативная стоимость","Opportunity cost"],["Ставка дисконтирования","Discount rate"],["Чистая приведённая стоимость","NPV — Net present value"]],
task:{q:"Вложения в пекарню — 3 600 000 ₽, чистая прибыль — 150 000 ₽ в месяц. Срок окупаемости, месяцев?",a:24,tol:0,u:"мес.",ex:"3 600 000 / 150 000 = 24 месяца. ROI за 3 года: (150 000 × 36 − 3 600 000) / 3 600 000 = 50%. А депозит под 15% годовых за 3 года дал бы ≈ 52% без риска. Пекарне нужна прибыль выше, иначе риск не оправдан."},
real:"Посчитай ROI своей учёбы: сколько стоят годы в WKU и семестр в США (цифры из нашего документа) и насколько может вырасти твой доход после. Через сколько лет вложения окупятся?"},

"2-5":{c:["Предприниматель не может смотреть на всё сразу. Нужны <b>5 цифр</b>, по которым за минуту видно здоровье бизнеса. Смотри их каждую неделю.","1. <b>Выручка и темп роста</b> — растём или нет<br>2. <b>Валовая маржа, %</b> — зарабатываем ли на самом продукте","3. <b>Чистая рентабельность, %</b> — что остаётся в итоге<br>4. <b>Остаток денег и runway</b> — сколько месяцев проживём при текущих расходах","5. <b>LTV/CAC или окупаемость CAC</b> — выгоден ли рост.<br>Бонус: <b>дебиторка</b> — сколько нам должны и как давно.","<b>Burn rate</b> — на сколько расходы превышают поступления в месяц. <b>Runway</b> = деньги на счёте / burn rate. Если runway меньше 6 месяцев, искать деньги или резать расходы нужно прямо сейчас."],
terms:[["Ключевые показатели","KPI — Key performance indicators"],["Валовая маржа","Gross margin"],["Чистая рентабельность","Net margin"],["Скорость сжигания денег","Burn rate"],["Запас хода","Runway"]],
task:{q:"На счёте 900 000 ₽. Каждый месяц бизнес тратит на 150 000 ₽ больше, чем зарабатывает. Сколько месяцев runway?",a:6,tol:0,u:"мес.",ex:"900 000 / 150 000 = 6 месяцев. Это граница: поиск инвестора или кредита занимает 3–6 месяцев, начинать нужно уже сейчас."},
real:"Заведи свои личные 5 KPI на пути к США: доход в месяц, % сбережений, накоплено на семестр в Kean (цель ~$20 тыс.), расходы, месяцев до цели. Заполни их за этот месяц."},

/* ---------- НЕДЕЛЯ 3 · БУХУЧЁТ И НАЛОГИ I ---------- */
"3-1":{c:["Три главные формы для старта. Выбор определяет <b>налоги, риски и что тебе можно делать</b>. Неправильная форма может стоить сотни тысяч рублей.","<b>Самозанятый (НПД)</b>: 4% с доходов от физлиц, 6% — от компаний и ИП. Регистрация за 5 минут в приложении «Мой налог», отчётов нет. Ограничения: доход до <b>2,4 млн ₽ в год</b>, <b>нельзя нанимать сотрудников и перепродавать чужие товары</b>. Можно совмещать с работой по найму, но нельзя оказывать услуги своему работодателю.","<b>ИП</b>: быстро, дёшево, деньги со счёта можно свободно тратить на себя. Минус — <b>по долгам бизнеса отвечаешь личным имуществом</b>. Взносы «за себя» обязательны, даже если дохода нет: за 2026 год — 57 390 ₽ + 1% с дохода свыше 300 000 ₽.","<b>ООО</b>: отвечаешь в пределах доли, кроме случаев, когда директор довёл компанию до банкротства, — тогда субсидиарная ответственность. Подходит для <b>партнёров и инвесторов</b>: доли, устав, корпоративный договор. Минусы: деньги выводятся только через зарплату или дивиденды (НДФЛ 13%, с суммы свыше 2,4 млн ₽ — 15%), бухгалтерия сложнее.","Правило выбора: <b>проверка идеи без сотрудников</b> — НПД. <b>Работаешь один, нужна свобода и товары</b> — ИП. <b>Партнёры, инвестор, крупные клиенты</b> — ООО. Законы меняются: перед решением сверься с nalog.gov.ru."],
terms:[["Самозанятый","Self-employed"],["Индивидуальный предприниматель","Sole proprietor"],["ООО","LLC — Limited liability company"],["Ответственность","Liability"],["Дивиденды","Dividends"]],
task:{q:"Самозанятый за год получил 600 000 ₽ от физлиц и 400 000 ₽ от компаний. Сколько налога НПД он заплатит, ₽? (Вычет 10 000 ₽ не учитывай.)",a:48000,tol:0,u:"₽",ex:"600 000 × 4% = 24 000 + 400 000 × 6% = 24 000 → 48 000 ₽. С вычетом 10 000 ₽ ставки временно ниже (3% и 4%), пока вычет не израсходован."},
real:"Для двух своих идей (лиды для брокеров и сорсинг из Вэньчжоу) реши: можно ли начать на НПД? Помни про запрет перепродажи товаров. Запиши, какую форму выберешь для каждой и почему."},

"3-2":{c:["<b>УСН (упрощёнка)</b> — самый популярный режим малого бизнеса: один налог вместо нескольких и простая отчётность. Подходит и ИП, и ООО.","<b>«Доходы» — 6%</b> со всех поступлений, расходы не важны. Налог можно <b>уменьшить на страховые взносы</b>: ИП без сотрудников — до 100%, с сотрудниками — до 50%. ИП с доходом около 1 млн ₽ на 6% фактически платит только взносы.","<b>«Доходы минус расходы» — 15%</b> с разницы. Но расходы должны быть <b>подтверждены документами</b> и входить в закрытый список. Даже при убытке платишь <b>минимальный налог — 1% от доходов</b>.","<b>Правило 60%</b>: 6% от выручки равны 15% от разницы, когда расходы составляют 60% выручки. Расходы меньше 60% — выгоднее 6%, больше — обычно 15%. Взносы сдвигают порог примерно до 65–70%. Считай на своих цифрах.","Регионы могут снижать ставки: до 1% на «доходах» и до 5% на «доходах минус расходы». Объект налогообложения меняется только с 1 января, уведомление — до 31 декабря."],
terms:[["Упрощённая система","Simplified tax system (STS)"],["Налоговая база","Tax base"],["Налоговая ставка","Tax rate"],["Минимальный налог","Minimum tax"],["Страховые взносы","Social insurance contributions"]],
task:{q:"Выручка за год 6 000 000 ₽, подтверждённые расходы 4 800 000 ₽. Сколько сэкономишь, выбрав УСН 15% вместо 6%, ₽? (Взносы не учитывай.)",a:180000,tol:0,u:"₽",ex:"6%: 6 000 000 × 6% = 360 000 ₽. 15%: (6 000 000 − 4 800 000) × 15% = 180 000 ₽. Экономия — 180 000 ₽: расходы здесь 80% выручки, это больше 60%."},
real:"Возьми финмодель пекарни из проекта недели 1. Посчитай налог за год на УСН 6% и на 15%. Какой режим выгоднее и при какой доле расходов всё меняется?"},

"3-3":{c:["<b>НДС</b> — налог на добавленную стоимость. Каждый в цепочке платит налог только с той стоимости, которую <b>добавил сам</b>. В итоге весь налог оплачивает конечный покупатель в цене.","Механика: начислил НДС с продажи − принял к вычету НДС, уплаченный поставщикам = заплатил в бюджет.<br>Купил за 100 + 22 НДС, продал за 200 + 44 НДС → в бюджет 44 − 22 = <b>22</b>, то есть 22% от добавленных тобой 100.","Ставки с 2026 года: <b>22%</b> — основная, <b>10%</b> — часть продуктов, детских товаров и лекарств, <b>0%</b> — экспорт.","<b>Упрощенцы</b> освобождены от НДС, пока доход ниже порога: <b>20 млн ₽</b> в 2026, <b>15 млн</b> в 2027, <b>10 млн</b> в 2028. Выше — НДС обязателен: либо <b>5% или 7%</b> без вычетов, либо 22% с вычетами. Это по закону на 2026 год — перед решением проверь на nalog.gov.ru.","<b>Импорт</b>: при ввозе товара в Россию НДС платят на таможне, даже на УСН, и это сразу идёт в себестоимость. В США НДС нет: там пошлины (tariffs) и налог с продаж (sales tax), который в каждом штате свой. Для сорсинга это важно."],
terms:[["НДС","VAT — Value added tax"],["Вычет входящего НДС","Input VAT credit"],["Счёт-фактура","VAT invoice"],["Освобождение от налога","Tax exemption"],["Налог с продаж (США)","Sales tax"]],
task:{q:"Ты на общей системе. Купил товар на 500 000 ₽ + НДС 22%, продал на 800 000 ₽ + НДС 22%. Сколько НДС заплатишь в бюджет, ₽?",a:66000,tol:0,u:"₽",ex:"Начислено: 800 000 × 22% = 176 000. Вычет: 500 000 × 22% = 110 000. В бюджет: 66 000 ₽ — это 22% от добавленных тобой 300 000 ₽."},
real:"Найди в любом своём чеке из магазина строку «НДС». Сколько налога ты заплатил с покупки? Вот так конечный покупатель оплачивает весь НДС цепочки."},

"3-4":{c:["Есть две зарплаты: <b>gross</b> — начисленная и <b>net</b> — «на руки». Разница — <b>НДФЛ 13%</b>, который работодатель удерживает и платит за сотрудника. С доходов свыше 2,4 млн ₽ в год ставка выше: с 2025 года шкала прогрессивная.","Сверху работодатель платит <b>страховые взносы</b> из своего кармана: общий тариф — <b>30%</b> от зарплаты до предельной базы, сверх неё — 15,1%. У малого бизнеса бывают льготные тарифы, но условия часто меняются — уточняй у бухгалтера.","Плюс <b>взносы «на травматизм»</b>: от 0,2% до 8,5% в зависимости от риска отрасли. Итог: сотрудник с 87 000 ₽ «на руки» стоит бизнесу около 130 000 ₽ в месяц. <b>К сумме «на руки» закладывай × 1,5</b>.","<b>Самозанятые исполнители</b> обходятся без взносов: ты платишь сумму, налог они платят сами. Но если человек работает по твоему графику, подчиняется тебе и работает только на тебя, налоговая признает трудовые отношения и доначислит налоги со штрафами. А своих бывших сотрудников 2 года нельзя оформлять у себя самозанятыми.","<b>ИП «за себя»</b> платит фиксированные взносы: за 2026 год — 57 390 ₽ + 1% с дохода свыше 300 000 ₽. Закладывай их в финмодель с первого дня."],
terms:[["Зарплата до вычетов","Gross salary"],["Зарплата «на руки»","Net salary / take-home pay"],["НДФЛ","Personal income tax"],["Страховые взносы работодателя","Payroll contributions"],["Подрядчик","Contractor"]],
task:{q:"Сотрудник хочет 87 000 ₽ «на руки». НДФЛ 13%, взносы работодателя 30% (без льгот, травматизм не учитывай). Сколько он обойдётся бизнесу в месяц, ₽?",a:130000,tol:0,u:"₽",ex:"Gross = 87 000 / 0,87 = 100 000 ₽. Взносы: 100 000 × 30% = 30 000 ₽. Итого 130 000 ₽ — в 1,5 раза больше суммы «на руки»."},
real:"Посчитай, во сколько ты обходишься работодателю в месяц: оклад + бонусы + взносы. Сравни с тем, сколько приносит компании одно подписанное тобой помещение. Это готовый аргумент для переговоров о повышении."},

"3-5":{c:["<b>Первичные документы</b> подтверждают, что операция была: <b>договор</b> — о чём договорились, <b>счёт</b> — на оплату, <b>акт</b> — услуга оказана, <b>накладная</b> — товар передан.","<b>УПД</b> (универсальный передаточный документ) заменяет накладную или акт, а для плательщиков НДС — ещё и счёт-фактуру. Сейчас это самый частый документ в B2B.","Главное правило: <b>нет документа — нет расхода</b>. На УСН 15% и общей системе расход без документов не уменьшит налог. Потерянный акт = переплаченный налог.","<b>Кассовый чек</b>: при расчётах с покупателями-физлицами почти всегда нужна онлайн-касса (54-ФЗ). Самозанятые формируют чек в приложении «Мой налог». Документы храни <b>минимум 5 лет</b>.","Система, которая спасает от штрафов: каждая оплата → документ в тот же день → папка по месяцам или <b>ЭДО</b> (электронный документооборот: Диадок, СБИС и другие). Хороший бухгалтер стоит дешевле одной налоговой проверки."],
terms:[["Первичные документы","Source documents"],["Счёт на оплату","Invoice"],["Акт выполненных работ","Certificate of completion"],["Электронный документооборот","EDI — Electronic data interchange"],["Онлайн-касса","Online cash register"]],
task:{q:"ИП на УСН 15%: доход 2 000 000 ₽, реальные расходы 1 200 000 ₽, но на 300 000 ₽ из них нет документов. Сколько налога он переплатит из-за потерянных документов, ₽?",a:45000,tol:0,u:"₽",ex:"С документами: (2 000 000 − 1 200 000) × 15% = 120 000. Без: (2 000 000 − 900 000) × 15% = 165 000. Переплата — 45 000 ₽."},
real:"Узнай, какие документы оформляются при подписании аренды помещения в «Хлебнике»: договор, акт приёма-передачи, что ещё? Составь список и запиши, зачем нужен каждый."},

/* ---------- НЕДЕЛЯ 4 · БУХУЧЁТ И НАЛОГИ II ---------- */
"4-1":{c:["Продавать услуги иностранцам из России можно и на НПД, и как ИП, и через ООО. Валютную выручку пересчитывают в рубли <b>по курсу ЦБ на дату поступления</b> и платят налог как обычно.","Базовый пакет документов: <b>контракт</b> на двух языках, <b>инвойс</b> — счёт на английском, <b>акт</b> об оказании услуг. Чётко пропиши валюту, срок оплаты, кто платит банковские комиссии и право какой страны применяется.","Главная сложность после 2022 года — <b>платежи</b>. Многие банки не проводят переводы между Россией и США или ЕС, а платежи с Китаем идут медленно и часто возвращаются. Заранее уточняй в банке, какие маршруты работают.","Поэтому бизнес с клиентами в США обычно строят <b>через компанию и счёт за пределами России</b>. Это законно, но требует правильной структуры и консультанта. Обход санкций — нет: это уголовный риск.","Правило: <b>сначала маршрут денег, потом продажи</b>. Прежде чем искать первого иностранного клиента, ответь: как именно и куда придут деньги и какие налоги ты с них заплатишь."],
terms:[["Контракт","Contract / Agreement"],["Инвойс","Invoice"],["Условия оплаты","Payment terms"],["Применимое право","Governing law"],["Банк-корреспондент","Correspondent bank"]],
task:{q:"ИП на УСН 6% получил от клиента из Казахстана 5 000 $. Курс ЦБ на дату поступления — 90 ₽ за доллар. Сколько налога он заплатит, ₽? (Взносы не учитывай.)",a:27000,tol:0,u:"₽",ex:"5 000 × 90 = 450 000 ₽ дохода × 6% = 27 000 ₽. Курс берут на дату поступления денег, а не на дату выставления счёта."},
real:"Составь шаблон инвойса на английском для иностранного клиента: твои реквизиты, данные клиента, описание услуги, сумма, валюта, срок оплаты."},

"4-2":{c:["<b>Валютный контроль</b> — правила, по которым государство следит за деньгами, пересекающими границу. Для бизнеса в России контролёр — <b>твой банк</b>, для физлиц — налоговая.","<b>Все граждане РФ — валютные резиденты</b>, даже если живут за границей. Это отдельное понятие от налогового резидентства, о нём следующий урок.","Счета за рубежом: о них нужно уведомлять налоговую, а в ряде случаев сдавать отчёты о движении денег. Обязанности зависят от страны банка, сумм и твоего налогового статуса, для нерезидентов есть послабления. Перед открытием счёта проверь актуальные правила на nalog.gov.ru.","Компании и ИП: внешнеторговые контракты <b>ставятся на учёт в банке</b>, если сумма выше порога: импорт — от 3 млн ₽, экспорт — от 6 млн ₽. Выручку по экспорту, как правило, нужно получить на счёт в российском банке.","Скрытая цена валютных операций — <b>спред</b>: банк покупает и продаёт валюту по разным курсам. 1–3% на каждой конвертации незаметно съедают маржу. Учитывай его в финмодели."],
terms:[["Валютный контроль","Currency control"],["Валютный резидент","Currency resident"],["Постановка контракта на учёт","Contract registration"],["Спред","Spread"],["Конвертация","Currency conversion"]],
task:{q:"Ты переводишь фабрике 20 000 $. Биржевой курс — 90 ₽, банк продаёт доллары на 2% дороже. Сколько рублей ты потеряешь на спреде?",a:36000,tol:0,u:"₽",ex:"20 000 × 90 = 1 800 000 ₽ × 2% = 36 000 ₽ потерь на одной операции. Несколько конвертаций в цепочке — и маржа тает."},
real:"Посмотри в приложении своего банка курсы покупки и продажи юаня и доллара сегодня и сравни с курсом ЦБ. Посчитай спред в процентах."},

"4-3":{c:["<b>Налоговый резидент РФ</b> — тот, кто находится в России <b>не менее 183 дней в течение 12 месяцев подряд</b>. Гражданство не важно — важны дни.","Когда ты уедешь учиться в Китай, со временем станешь <b>нерезидентом РФ</b>. Тогда многие доходы из российских источников облагаются по ставке <b>30%</b>. Исключение — зарплата по трудовому договору с российской компанией за удалённую работу: с 2024 года она облагается по ставке 13% (15% с суммы свыше 2,4 млн ₽).","В Китае своё правило: <b>183 дня и больше в календарном году</b> делают тебя налоговым резидентом Китая. Для иностранцев в первые 6 лет есть льготы на доходы из-за рубежа — уточняй условия.","Между Россией и Китаем действует <b>соглашение об избежании двойного налогообложения</b>. Оно определяет, в какой стране платить налог с конкретного дохода, чтобы не платить дважды.","План на 2027–2031: <b>посчитай дни</b> в каждой стране по годам, определи статус и только потом выбирай схему работы с «Хлебником» и бизнесом. Это первый вопрос к налоговому консультанту."],
terms:[["Налоговый резидент","Tax resident"],["Нерезидент","Non-resident"],["Источник дохода","Source of income"],["Соглашение об избежании двойного налогообложения","Double tax treaty (DTT)"],["Подоходный налог","Individual income tax"]],
task:{q:"За последние 12 месяцев подряд ты провёл в России 150 дней. Сколько дней не хватило, чтобы остаться налоговым резидентом РФ?",a:33,tol:0,u:"дней",ex:"183 − 150 = 33 дня. Статус проверяют по 12 месяцам подряд, а окончательно — по итогам календарного года."},
real:"Распиши свой календарь на 2027–2028 годы: сколько дней в России, сколько в Китае. С какого момента ты станешь налоговым нерезидентом РФ?"},

"4-4":{c:["Варианты: <b>сам в онлайн-сервисе</b> (для ИП на УСН без сотрудников это реально), <b>бухгалтер на аутсорсе</b>, <b>бухгалтерская компания</b>, <b>штатный бухгалтер</b> — когда операций сотни в месяц.","Налоги платятся <b>единым налоговым платежом (ЕНП)</b> до 28-го числа. УСН: авансы за кварталы — до 28 апреля, июля и октября. Годовой налог: ООО — до 28 марта, ИП — до 28 апреля. Декларация: ООО — до 25 марта, ИП — до 25 апреля.","ИП без сотрудников на УСН 6% уменьшает налог на взносы «за себя». Пример: доход 2,4 млн ₽ → налог 144 000, взносы 57 390 + 21 000 = 78 390 → к уплате 65 610 ₽.","Что давать бухгалтеру: доступ к банку, все первичные документы, договоры. Вопросы задавай <b>до сделки, а не после</b>. Хороший бухгалтер не только считает, но и предупреждает о рисках.","Даже с бухгалтером <b>ответственность твоя</b>. Раз в квартал задавай 3 вопроса: сколько налогов заплатим за год, какие риски видишь, что можно законно оптимизировать."],
terms:[["Бухгалтер","Accountant"],["Аутсорсинг","Outsourcing"],["Налоговая декларация","Tax return"],["Авансовый платёж","Advance tax payment"],["Налоговый календарь","Tax calendar"]],
task:{q:"ИП без сотрудников на УСН 6%, доход за год 2 400 000 ₽. Взносы за себя: 57 390 ₽ + 1% с дохода свыше 300 000 ₽. Сколько налога УСН к уплате после уменьшения на взносы, ₽?",a:65610,tol:0,u:"₽",ex:"Налог: 2 400 000 × 6% = 144 000. Взносы: 57 390 + 1% × 2 100 000 = 78 390. К уплате: 144 000 − 78 390 = 65 610 ₽. Налог и взносы вместе — 144 000 ₽."},
real:"Открой бизнес-раздел приложения или сайта своего банка: есть ли онлайн-бухгалтерия для ИП на УСН? Запиши, что она умеет и сколько стоит."},

"4-5":{c:["<b>Не заплатил налог</b> — штраф 20% от неуплаченной суммы, при умысле — 40%. Плюс <b>пени</b> за каждый день просрочки.","<b>Не сдал декларацию</b> — 5% от неуплаченного по ней налога за каждый месяц, от 1 000 ₽ до 30%. А через 20 рабочих дней после срока налоговая может <b>заблокировать счёт</b>. Это страшнее штрафа: бизнес встаёт.","<b>Не выдал кассовый чек</b> — для ИП от 1/4 до 1/2 суммы расчёта, но не меньше 10 000 ₽; для компании — от 3/4 до 100% суммы, но не меньше 30 000 ₽.","<b>Самозанятые вместо сотрудников</b> — налоговая переквалифицирует отношения в трудовые и доначислит НДФЛ, взносы, штрафы и пени за все годы. Частая ошибка растущих бизнесов.","Защита простая: <b>налоговый календарь</b> с напоминаниями, документы в день оплаты, ответы на требования налоговой в срок. Большинство штрафов — от невнимательности, а не от сложных схем."],
terms:[["Штраф","Penalty / Fine"],["Пени","Late payment interest"],["Блокировка счёта","Account freeze"],["Налоговая проверка","Tax audit"],["Требование налоговой","Tax authority request"]],
task:{q:"Ты не заплатил налог 200 000 ₽ — без умысла, по ошибке. Штраф — 20% от неуплаченной суммы. Сколько штрафа, ₽? (Пени не учитывай.)",a:40000,tol:0,u:"₽",ex:"200 000 × 20% = 40 000 ₽ плюс сам налог и пени. При умысле было бы 80 000 ₽."},
real:"Сделай налоговый календарь ИП на УСН на 2027 год: даты авансов, декларации, годового налога и взносов. Поставь напоминания в телефон."},

/* ---------- НЕДЕЛЯ 5 · МЕЖДУНАРОДНЫЙ БИЗНЕС I ---------- */
"5-1":{c:["<b>Инкотермс</b> — международные правила, которые тремя буквами определяют, <b>кто платит</b> за каждый этап доставки и <b>где риск переходит</b> от продавца к покупателю. Действует редакция 2020 года, в ней 11 терминов.","<b>EXW</b> — забираешь товар у ворот фабрики, всё остальное на тебе, включая экспортное оформление. <b>FOB</b> — фабрика доставляет товар в порт и грузит на судно, дальше риск твой. Это самый популярный термин в Китае.","<b>CIF</b> — продавец оплачивает фрахт и минимальную страховку до порта назначения, но <b>риск переходит к тебе уже при погрузке</b> в Китае. Ловушка для новичков: «оплачено до порта» не значит «под ответственностью продавца до порта».","<b>DAP</b> — продавец доставляет до указанного места, растаможка твоя. <b>DDP</b> — продавец делает всё, включая пошлины. Удобно, но дороже, и у тебя меньше контроля.","FOB, CFR, CIF и FAS — только для морских перевозок. Для контейнеров и авиа правильнее <b>FCA, CPT, CIP</b>. Всегда пиши термин с местом и редакцией: «FOB Ningbo, Incoterms 2020»."],
terms:[["Инкотермс","Incoterms"],["Франко-борт","FOB — Free on board"],["Стоимость, страхование и фрахт","CIF — Cost, insurance and freight"],["Поставка с оплатой пошлин","DDP — Delivered duty paid"],["Переход риска","Transfer of risk"]],
task:{q:"Товар FOB Ningbo — 10 000 $. Фрахт до Лос-Анджелеса — 1 500 $, страховка — 50 $, пошлина США — 10% от таможенной стоимости (в США это цена FOB). Себестоимость с доставкой (landed cost) без прочих сборов, $?",a:12550,tol:0,u:"$",ex:"10 000 + 1 500 + 50 + 1 000 (10% от 10 000) = 12 550 $. В России и ЕС пошлину считают от цены с доставкой до границы — с фрахтом и страховкой."},
real:"Открой Alibaba или 1688, найди 3 фабрики обуви из Вэньчжоу и посмотри, на каких условиях Инкотермс они дают цену: EXW, FOB или другие."},

"5-2":{c:["<b>Море</b> — самый дешёвый вариант, 25–40 дней от двери до двери в США. Можно взять целый контейнер (FCL: 20 футов ≈ 33 м³, 40 футов ≈ 67 м³) или отправить сборный груз (LCL) и платить за свои кубометры. Для Вэньчжоу основные порты — Нинбо и Шанхай.","<b>Авиа</b> — 3–7 дней, но в разы дороже за килограмм. Подходит для дорогих и срочных товаров и первых партий. <b>Экспресс-курьеры</b> (DHL, FedEx, UPS) — для образцов.","<b>Ж/д</b> — 14–25 дней из Китая в Россию и Европу, золотая середина по цене и сроку. В США этот вариант не работает.","В авиа платишь за <b>оплачиваемый вес</b> — больший из фактического и объёмного. Объёмный вес = Д × Ш × В в см / 6 000 (у курьеров часто / 5 000). Лёгкая, но большая коробка стоит как тяжёлая.","<b>Экспедитор</b> организует всю цепочку: забор с фабрики, экспорт, фрахт, страховку, растаможку. Главный документ морской перевозки — <b>коносамент</b>: без него груз не выдадут."],
terms:[["Экспедитор","Freight forwarder"],["Полный контейнер / сборный груз","FCL / LCL"],["Коносамент","Bill of lading (B/L)"],["Объёмный вес","Volumetric weight"],["Время в пути","Transit time"]],
task:{q:"Коробка 60 × 50 × 40 см весит 12 кг. Авиаперевозчик считает объёмный вес с делителем 6 000. Какой оплачиваемый вес, кг?",a:20,tol:0,u:"кг",ex:"60 × 50 × 40 = 120 000 / 6 000 = 20 кг объёмного веса. Это больше фактических 12 кг, поэтому платишь за 20 кг."},
real:"Напиши 2–3 экспедиторам (в Telegram или через сайт) и спроси примерную ставку за 1 м³ сборного груза из Нинбо или Шанхая в Лос-Анджелес и в Москву. Сравни."},

"5-3":{c:["Всё начинается с <b>кода товара</b>: в России — ТН ВЭД, в США — HTS. От кода зависят пошлина, НДС, нужные сертификаты и запреты. Ошибка в коде — переплата или штраф.","<b>Импорт в Россию</b>: пошлина + НДС на ввоз (22% или 10%, считается от стоимости вместе с пошлиной) + сборы. Нужны документы о соответствии требованиям ЕАЭС. Для обуви и одежды обязательна маркировка «Честный знак».","<b>Импорт в США</b>: пошлина зависит от HTS-кода и страны происхождения. Пошлины на китайские товары в 2025–2026 годах менялись несколько раз и бывают очень высокими. Всегда проверяй актуальную ставку на hts.usitc.gov и в новостях.","Для морского ввоза в США до погрузки нужно подать данные <b>ISF</b> («10+2»). Нужен <b>импортёр</b> (importer of record) и обычно <b>таможенный брокер</b>. Льготу на ввоз посылок до 800 $ без пошлины в 2025 году отменили.","Отдельные товары требуют допусков: детские товары, электроника, косметика, продукты. Перед закупкой спроси брокера: «Что нужно, чтобы законно ввезти и продать товар с этим кодом?»"],
terms:[["Код товара (США)","HTS code"],["Таможенная пошлина","Customs duty"],["Таможенный брокер","Customs broker"],["Импортёр","Importer of record"],["Сертификат происхождения","Certificate of origin"]],
task:{q:"Импорт в Россию: таможенная стоимость товара 1 000 000 ₽, пошлина 10%, НДС на ввоз 22% считается от суммы стоимости и пошлины. Сколько всего платежей на таможне, ₽? (Сборы не учитывай.)",a:342000,tol:0,u:"₽",ex:"Пошлина: 100 000. НДС: (1 000 000 + 100 000) × 22% = 242 000. Итого 342 000 ₽ — плюс 34% к цене товара ещё до продажи."},
real:"Найди в онлайн-справочнике код ТН ВЭД для кожаной обуви и HTS-код для США. Запиши ставки пошлины из обоих справочников и дату проверки."},

"5-4":{c:["Главный вопрос международной сделки: <b>кто рискует деньгами</b>. Покупатель боится заплатить и не получить товар, продавец — отгрузить и не получить деньги.","<b>Предоплата 100%</b> — весь риск на тебе. <b>30/70</b> — стандарт в Китае: 30% депозит при заказе, 70% перед отгрузкой или против копии коносамента. <b>Отсрочка</b> — риск на фабрике, её дают только постоянным клиентам.","<b>Аккредитив</b>: банк покупателя обязуется заплатить продавцу, когда тот предоставит правильные документы об отгрузке. Надёжно, но дорого и бюрократично — для крупных сделок.","<b>Эскроу</b>: деньги лежат у третьей стороны, пока ты не подтвердишь получение. Пример — Trade Assurance на Alibaba: защищает платёж, если фабрика нарушила сроки или качество по заказу. Работает, только если платишь через платформу.","Комбинация для старта: маленький пробный заказ → инспекция перед отгрузкой → оплата 70% только после отчёта инспектора. Доверие растёт — условия улучшаются."],
terms:[["Аккредитив","Letter of credit (L/C)"],["Эскроу","Escrow"],["Банковский перевод","Telegraphic transfer (T/T)"],["Депозит, аванс","Deposit"],["Отсрочка платежа","Open account / Net terms"]],
task:{q:"Банк берёт за аккредитив 0,3% от суммы, но не меньше 150 $, плюс 200 $ за проверку документов. Сколько стоит аккредитив на 40 000 $?",a:350,tol:0,u:"$",ex:"0,3% от 40 000 = 120 $ — меньше минимума, значит берут 150 $. Плюс 200 $ = 350 $. На маленьких сделках аккредитив невыгоден."},
real:"Прочитай условия Trade Assurance на Alibaba: что он покрывает, в какой срок нужно открыть спор, что не покрывается. Запиши 3 главных правила."},

"5-5":{c:["<b>Валютный риск</b> возникает, когда закупаешь в одной валюте, а продаёшь в другой. Курс меняется между оплатой фабрике и деньгами от клиента — и маржа исчезает.","Пример: закупка в юанях, продажа в долларах. Если юань дорожает к доллару, закупка в долларах растёт, а цена для клиента зафиксирована. За год курсы легко двигаются на 5–10%.","Способы защиты: <b>естественный хедж</b> — продавай и закупай в одной валюте; <b>фиксируй курс</b> в контракте; закладывай <b>запас в цене</b> 3–5%; держи <b>короткие сроки</b> между оплатой и продажей.","<b>Форвард</b> — договор с банком купить валюту в будущем по курсу, зафиксированному сегодня. Защищает от скачков, но стоит денег и доступен не везде.","Правило: в финмодели всегда делай строку «курс +10%» и смотри, выживет ли маржа."],
terms:[["Валютный риск","Currency risk / FX risk"],["Хеджирование","Hedging"],["Форвардный контракт","Forward contract"],["Обменный курс","Exchange rate"],["Естественный хедж","Natural hedge"]],
task:{q:"Закупка — 70 000 юаней. Клиенту ты продаёшь в долларах по фиксированной цене. Курс был 7,0 юаня за доллар, стал 6,5. Сколько теперь стоит закупка в долларах? (Округли до целых.)",a:10769,tol:1,u:"$",ex:"70 000 / 6,5 ≈ 10 769 $ вместо 10 000 $ при курсе 7,0. Закупка подорожала на 769 $: при продаже за 12 000 $ маржа упала с 2 000 до примерно 1 231 $."},
real:"Посмотри график курса юаня к доллару и к рублю за последний год (сайт ЦБ или любой финансовый сайт). Каким был максимальный размах в процентах? Это твой минимальный запас в цене."},
/* ---------- НЕДЕЛЯ 6 · МЕЖДУНАРОДНЫЙ БИЗНЕС II ---------- */
"6-1":{c:["В Китае сначала строят <b>отношения</b>, потом делают сделки. <b>Гуаньси</b> (关系) — сеть доверия и взаимных услуг. Первая встреча — знакомство, а не подписание.","<b>Мяньцзы</b> (面子), или «лицо», — репутация и достоинство. Никогда не критикуй партнёра при его команде и не загоняй в угол публично. Сложные вопросы обсуждай один на один.","«Да» не всегда значит «да». «Это сложно», «мы изучим», «возможно» часто означают вежливое «нет». Проверяй договорённости вопросами: «Когда пришлёте образец? Какая дата отгрузки?»","Главный канал — <b>WeChat</b>, а не почта. Визитку дают и берут двумя руками. Ужин с партнёром — часть переговоров. Решения принимает старший, и иногда его нет за столом.","Защита: все договорённости — <b>письменно</b> и с цифрами: спецификация, допуски, сроки, штрафы. Для китайской стороны контракт — начало отношений, поэтому повторяй ключевые условия на каждом этапе."],
terms:[["Отношения, связи","Guanxi (关系)"],["Сохранить лицо","Save face / Mianzi (面子)"],["Спецификация","Specification"],["Минимальная партия","MOQ — Minimum order quantity"],["Образец","Sample"]],
task:{q:"Фабрика просит MOQ 1 200 пар по 14 $. Ты договорился о пробной партии 600 пар, но по 16 $. На сколько долларов меньше денег ты заморозил в первом заказе?",a:7200,tol:0,u:"$",ex:"1 200 × 14 = 16 800 $. 600 × 16 = 9 600 $. В первом заказе ты заморозил на 7 200 $ меньше. Цена за пару выше, но риск ниже — для первого заказа это правильный обмен."},
real:"Заведи WeChat, если его ещё нет, и выучи 5 фраз: 你好 (привет), 谢谢 (спасибо), 多少钱 (сколько стоит), 最低起订量 (минимальная партия), 合作愉快 (приятного сотрудничества)."},

"6-2":{c:["<b>Alibaba.com</b> — площадка для экспорта на английском. <b>1688.com</b> — внутренний китайский рынок: цены ниже, но всё на китайском и нужен агент. <b>Made-in-China</b> и <b>Global Sources</b> — альтернативы.","Выставки — лучший способ увидеть сотни фабрик за день. <b>Кантонская ярмарка</b> в Гуанчжоу проходит дважды в год, весной и осенью. Рядом с Вэньчжоу, в той же провинции Чжэцзян, — гигантский оптовый рынок <b>Иу</b>.","Вэньчжоу — промышленный центр: <b>обувь</b> (один из главных «обувных» городов Китая), <b>очки</b>, <b>зажигалки</b>, <b>электротехника</b> (Юэцин), <b>клапаны и насосы</b>. Ты будешь жить рядом с фабриками — это твоё преимущество.","Фабрика или торговая компания? Попроси <b>бизнес-лицензию</b> (营业执照) и проверь её на gsxt.gov.cn или в сервисах Qichacha и Tianyancha: вид деятельности, уставный капитал, дату регистрации, суды.","Красные флаги: цена сильно ниже рынка, отказ от видеозвонка с цеха, оплата на личный счёт, нет образцов. Хорошая фабрика спокойно показывает производство."],
terms:[["Поставщик","Supplier"],["Производитель","Manufacturer"],["Торговая компания","Trading company"],["Бизнес-лицензия","Business license"],["Выставка","Trade fair"]],
task:{q:"Ты написал 40 фабрикам. Ответили 60%, из ответивших прислали образцы 25%, из них прошли проверку качества 50%. Сколько фабрик осталось в шорт-листе?",a:3,tol:0,u:"фабрики",ex:"40 × 60% = 24 → × 25% = 6 → × 50% = 3 фабрики. Воронка поставщиков узкая, поэтому начинай с десятков контактов."},
real:"Найди 5 фабрик обуви из Вэньчжоу на Alibaba или 1688. У одной проверь лицензию на gsxt.gov.cn или в Qichacha и запиши, что узнал."},

"6-3":{c:["Качество в Китае не «случается» само — его <b>контролируют</b>. Без инспекции ты узнаешь о браке, только когда товар уже приедет.","<b>Золотой образец</b> — утверждённый эталон с подписью обеих сторон. Плюс <b>спецификация</b>: материалы, размеры, допуски, цвет по Pantone, упаковка, маркировка.","Инспекции: <b>до производства</b> — проверка материалов; <b>во время</b> — на 20–30% готовности; <b>перед отгрузкой</b> — при 80–100% упакованной партии; <b>проверка загрузки</b> контейнера.","<b>AQL</b> — статистическая выборка по стандарту ISO 2859-1. Для партии 5 000 штук при обычном уровне проверки берут 200 штук. При AQL 2,5 партию принимают, если серьёзных дефектов не больше 10.","Независимые инспекторы: SGS, Bureau Veritas, QIMA, V-Trust. Человеко-день обычно стоит несколько сотен долларов. Дешевле одной бракованной партии."],
terms:[["Контроль качества","Quality control (QC)"],["Инспекция перед отгрузкой","Pre-shipment inspection (PSI)"],["Приемлемый уровень качества","AQL — Acceptable quality limit"],["Золотой образец","Golden sample"],["Дефект","Defect"]],
task:{q:"Партия 5 000 пар, выборка по AQL 2,5 — 200 пар, допускается не больше 10 дефектных. Инспектор нашёл 12. Сколько дефектов сверх нормы?",a:2,tol:0,u:"шт.",ex:"12 − 10 = 2. Партия не принята: фабрика должна пересортировать или переделать её. Платить 70% до этого нельзя."},
real:"Напиши спецификацию «золотого образца» для любого товара: материалы, размеры, допуски, цвет, упаковка, маркировка — 10 пунктов."},

"6-4":{c:["Для бизнеса с клиентами в США часто открывают компанию <b>вне России</b>. Это законно, но у каждого варианта свои налоги, банки и обязательства.","<b>LLC в США</b> (штаты Делавэр, Вайоминг): регистрация онлайн, нужен зарегистрированный агент, налоговый номер EIN. LLC с одним владельцем-иностранцем обязана ежегодно сдавать <b>форму 5472</b> — штраф за несдачу 25 000 $.","<b>Компания в Гонконге</b> — классика для торговли с Китаем: налог на прибыль 8,25% с первых 2 млн гонконгских долларов, дальше 16,5%. Прибыль из источников вне Гонконга может не облагаться.","Главная проблема для граждан РФ — <b>банки</b>. Многие банки и финтехи в США, Гонконге и ЕС отказывают россиянам или закрывают счета. Узнай, где реально откроют счёт, <b>до регистрации</b> компании.","Иностранная компания не снимает с тебя обязанностей в России: контролируемые иностранные компании (КИК), уведомления, налоги. Структуру собирай только с консультантом."],
terms:[["Общество с ограниченной ответственностью (США)","LLC — Limited liability company"],["Налоговый номер работодателя (США)","EIN — Employer identification number"],["Зарегистрированный агент","Registered agent"],["Контролируемая иностранная компания","CFC — Controlled foreign company"],["Соответствие требованиям","Compliance"]],
task:{q:"LLC в США с одним владельцем-иностранцем не сдала форму 5472 два года подряд. Штраф — 25 000 $ за каждый год. Сколько всего, $?",a:50000,tol:0,u:"$",ex:"25 000 × 2 = 50 000 $. Об этом часто не знают те, кто открыл LLC «за 100 $ онлайн». Отчётность — часть цены компании."},
real:"Сравни LLC в США и компанию в Гонконге для идеи сорсинга в таблице: налоги, банки, ежегодные расходы, сложность, риски для гражданина РФ."},

"6-5":{c:["<b>Санкции</b> — ограничения, которые страны вводят против других стран, компаний и людей. Для бизнеса с США главный регулятор — <b>OFAC</b> (Минфин США) со списком SDN.","<b>Вторичные санкции</b>: банк или компания из любой страны рискует, если помогает обходить санкции США. Поэтому китайские банки в 2024–2025 годах стали массово отклонять платежи, связанные с Россией.","<b>Экспортный контроль</b>: часть товаров (электроника, станки, товары двойного назначения) нельзя поставлять в определённые страны без лицензии. Перед сделкой проверь товар и страну назначения.","Проверка контрагента: бесплатный поиск OFAC (sanctionssearch.ofac.treas.gov), списки ЕС и Великобритании, проверка владельцев. Процедура <b>KYC</b> («знай своего клиента») — норма для серьёзного бизнеса.","Обход санкций через подставные компании и «серые» схемы — <b>уголовный риск</b> в нескольких странах. Честная структура медленнее, но только она позволяет построить бизнес в США надолго."],
terms:[["Санкции","Sanctions"],["Список особо обозначенных лиц","SDN list"],["Вторичные санкции","Secondary sanctions"],["Экспортный контроль","Export control"],["Знай своего клиента","KYC — Know your customer"]],
task:{q:"Перевод фабрике 20 000 $: банк отправителя берёт 0,5%, банк-корреспондент — 40 $, банк получателя — 20 $. Сколько стоит перевод, $?",a:160,tol:0,u:"$",ex:"0,5% × 20 000 = 100 + 40 + 20 = 160 $. Заранее договорись, кто платит комиссии (OUR, SHA или BEN в платёжке), иначе фабрика получит меньше и попросит доплату."},
real:"Проверь любую известную компанию в бесплатном поиске OFAC (sanctionssearch.ofac.treas.gov). Разберись, как работает поиск и что значат результаты."},

/* ---------- НЕДЕЛЯ 7 · МАРКЕТИНГ ---------- */
"7-1":{c:["Маркетинг начинается не с рекламы, а с вопроса <b>«для кого?»</b>. Продукт «для всех» не нужен никому: сообщение размывается, деньги сгорают.","Критерии сегментации B2C: география, возраст, доход, поведение и, главное, <b>потребность</b> (работа клиента). B2B: отрасль, размер компании, регион, роль покупателя.","<b>ICP</b> (профиль идеального клиента) — описание компании, которой твой продукт нужнее всего и которая быстрее всех платит. <b>Персона</b> — конкретный человек внутри: роль, цели, страхи.","<b>Плацдарм</b>: начни с одного узкого сегмента, где можешь стать лучшим, — например, «брокеры по ритейл-помещениям в Нью-Джерси». Захвати его и расширяйся. Так растут почти все успешные компании.","Как выбрать сегмент: сильная боль, есть деньги, легко достучаться, ты можешь выиграть, есть куда расти. Оцени 3–5 сегментов по этим критериям."],
terms:[["Сегментация","Segmentation"],["Целевая аудитория","Target audience"],["Профиль идеального клиента","ICP — Ideal customer profile"],["Персона покупателя","Buyer persona"],["Плацдарм, стартовый рынок","Beachhead market"]],
task:{q:"В штате 12 000 брокеров по коммерческой недвижимости. С ритейлом работают 15%, из них 20% готовы платить за лиды. Сколько потенциальных клиентов в сегменте?",a:360,tol:0,u:"клиентов",ex:"12 000 × 15% = 1 800 × 20% = 360 клиентов. Небольшой, но чёткий плацдарм: до каждого можно дотянуться лично."},
real:"Опиши ICP для лидогенерации брокерам в 7 пунктах: размер компании, роль покупателя, регион, тип объектов, боль, бюджет, где его найти."},

"7-2":{c:["<b>Позиционирование</b> — место, которое ты занимаешь в голове клиента относительно альтернатив. Его формулируешь не ты в презентации, а клиент одной фразой: «Это те, кто…».","Сильные бренды владеют <b>одним словом</b>: Volvo — безопасность, «Самокат» — 15 минут. Попытка владеть тремя словами = не владеть ни одним.","<b>Точки паритета</b> — что у тебя должно быть «как у всех», чтобы тебя рассматривали. <b>Точки отличия</b> — за что выбирают именно тебя. Без паритета не рассматривают, без отличия не выбирают.","<b>Карта позиционирования</b>: две важные для клиента оси (цена и скорость, премиум и масс-маркет) и конкуренты на них. Ищи пустой квадрат, в котором есть спрос.","Проверка: спроси 10 клиентов «Почему выбрали нас?». Если ответы разные или «не знаю», позиционирования нет."],
terms:[["Позиционирование","Positioning"],["Точки отличия","Points of difference"],["Точки паритета","Points of parity"],["Карта позиционирования","Perceptual map"],["Отличительное преимущество","Differentiation"]],
task:{q:"Опрос 200 клиентов: 46 назвали вас «самыми быстрыми», 30 — «дешёвыми», 124 не смогли назвать отличие. Какой % клиентов не понимает вашего позиционирования?",a:62,tol:0,u:"%",ex:"124 / 200 = 62%. Позиционирования фактически нет. Укрепляй «скорость» — её уже замечают 23% клиентов."},
real:"Нарисуй карту позиционирования 5 пекарен или кофеен у твоего дома: оси «цена» и «скорость / удобство». Где есть свободное место?"},

"7-3":{c:["Три подхода к цене: <b>затраты + наценка</b> (просто, но оставляет деньги на столе), <b>по конкурентам</b> (безопасно, но ведёт к войне цен), <b>по ценности</b> — сколько стоит результат для клиента. Сильные бизнесы используют третий.","<b>Якорь</b>: первая цена, которую видит клиент, задаёт шкалу. Сначала покажи дорогой тариф, и средний кажется разумным.","<b>Три тарифа</b> (базовый, оптимальный, премиум): большинство выбирает средний. Премиум делает средний привлекательным и иногда продаётся сам.","Опасность скидок: при марже 30% скидка 10% требует <b>+50% продаж</b>, чтобы прибыль не упала. Формула: скидка / (маржа − скидка).","Повышай цену, когда клиенты соглашаются слишком легко. Если никто не возражает против цены, ты продаёшь дёшево."],
terms:[["Ценообразование","Pricing"],["Ценообразование по ценности","Value-based pricing"],["Ценовой якорь","Price anchoring"],["Тарифные уровни","Pricing tiers"],["Скидка","Discount"]],
task:{q:"Твоя маржа — 40%. Ты даёшь скидку 10%. На сколько процентов должны вырасти продажи, чтобы прибыль не упала? (Округли до десятых.)",a:33.3,tol:0.2,u:"%",ex:"10 / (40 − 10) = 0,333 → +33,3%. Маленькая скидка требует большого роста продаж. Вместо скидки лучше добавить ценность."},
real:"Найди сервис с тремя тарифами (подписка, банк, мобильный оператор). Как в нём работают якорь и «выгодный» средний тариф? Запиши выводы."},

"7-4":{c:["Каналы делятся на три типа: <b>собственные</b> (сайт, Telegram-канал, база клиентов), <b>платные</b> (реклама), <b>заработанные</b> (рекомендации, отзывы, пресса).","B2B-каналы: <b>холодные сообщения</b> (email, LinkedIn), <b>партнёрства</b>, рекомендации, отраслевые мероприятия, контент. B2C: соцсети, реклама, маркетплейсы, блогеры.","Метод <b>«мишени»</b> из книги «Traction»: выпиши все возможные каналы, протестируй 3 самых перспективных маленьким бюджетом и сфокусируйся на одном лучшем.","Для каждого канала считай <b>CAC</b> отдельно. Средний CAC по бизнесу обманывает: один канал может кормить компанию, а другой — сжигать деньги.","У каждого продукта свой канал. Дорогая B2B-услуга продаётся через личные разговоры, дешёвый товар — через рекламу и маркетплейсы. Не перепутай."],
terms:[["Канал привлечения","Acquisition channel"],["Собственные медиа","Owned media"],["Заработанные медиа","Earned media"],["Холодные продажи","Cold outreach"],["Реферальная программа","Referral program"]],
task:{q:"Канал А: 60 000 ₽ и 12 клиентов. Канал Б: 40 000 ₽ и 5 клиентов. На сколько рублей CAC канала Б выше, чем у канала А?",a:3000,tol:0,u:"₽",ex:"А: 60 000 / 12 = 5 000 ₽. Б: 40 000 / 5 = 8 000 ₽. Разница — 3 000 ₽. Деньги из Б стоит переложить в А, пока его CAC не начнёт расти."},
real:"Выпиши 10 каналов, где можно найти американских брокеров по коммерческой недвижимости, и выбери 3 для теста с бюджетом и критерием успеха."},

"7-5":{c:["<b>Бренд</b> — не логотип, а <b>обещание плюс опыт</b>: что клиент ожидает от тебя и что реально получает. Каждый контакт либо укрепляет бренд, либо разрушает его.","Платформа бренда: <b>миссия</b> (зачем ты существуешь), <b>ценности</b>, <b>тон голоса</b> (как говоришь), <b>визуальный стиль</b>. Всё должно быть узнаваемым в любой точке контакта.","Контент работает, когда помогает клиенту, а не хвалит тебя. Правило <b>80/20</b>: 80% полезного и интересного, 20% продающего.","<b>Личный бренд основателя</b> — самый дешёвый маркетинг для старта. Люди покупают у людей. Твой будущий блог — это актив, который будет работать на любой твой бизнес.","Главное — <b>регулярность</b>. Средний контент каждую неделю год подряд сильнее гениального поста раз в полгода."],
terms:[["Бренд","Brand"],["Тон голоса","Tone of voice"],["Контент-маркетинг","Content marketing"],["Личный бренд","Personal brand"],["Вовлечённость","Engagement"]],
task:{q:"Пост набрал 8 000 просмотров, 240 переходов в профиль и 12 заявок. Конверсия из просмотра в заявку, %?",a:0.15,tol:0.01,u:"%",ex:"12 / 8 000 = 0,0015 = 0,15%. Из профиля в заявку — 12 / 240 = 5%. Слабое место — переход из поста в профиль: улучшай призыв к действию."},
real:"Опиши свой личный бренд для будущего блога: о чём ты, для кого, какой тон, 3 постоянные рубрики и 5 первых тем постов."},
/* ---------- НЕДЕЛЯ 8 · ЦИФРОВОЙ МАРКЕТИНГ ---------- */
"8-1":{c:["Любой цифровой маркетинг — это <b>воронка</b>: показы → клики → заявки → продажи → повторные продажи. На каждом шаге часть людей отваливается, и задача — найти самый «дырявый» шаг.","Метрики рекламы: <b>CPM</b> — цена 1 000 показов, <b>CTR</b> — доля кликов, <b>CPC</b> — цена клика, <b>CR</b> — конверсия в заявку, <b>CPL</b> — цена заявки, <b>CPA</b> — цена целевого действия или продажи.","Связь метрик: CPC = CPM / (1 000 × CTR). CPL = CPC / CR. Улучшив CTR вдвое, ты вдвое снижаешь цену заявки, не трогая бюджет.","<b>AARRR</b> — «пиратские метрики» для продукта: привлечение, активация (первая ценность), удержание, рекомендации, доход. Удержание обычно важнее привлечения.","Правило: смотри не на клики и лайки, а на <b>деньги</b>. Цель рекламы — продажи с окупаемостью, а не красивые отчёты."],
terms:[["Воронка продаж","Sales funnel"],["Цена за 1 000 показов","CPM — Cost per mille"],["Цена за клик","CPC — Cost per click"],["Цена заявки","CPL — Cost per lead"],["Пиратские метрики","AARRR metrics"]],
task:{q:"CPM — 300 ₽, CTR — 1%, конверсия сайта в заявку — 5%. Сколько стоит одна заявка, ₽?",a:600,tol:0,u:"₽",ex:"1 000 показов = 300 ₽ → 10 кликов → CPC = 30 ₽. CPL = 30 / 5% = 600 ₽. Подними конверсию сайта до 10% — заявка подешевеет до 300 ₽."},
real:"Нарисуй воронку своей работы: объявления → звонки → выезды → одобрения → подписания. Посчитай конверсии каждого шага за последний месяц. Где самая большая «дыра»?"},

"8-2":{c:["<b>Контекстная реклама</b> (Яндекс Директ, Google Ads) ловит <b>готовый спрос</b>: человек уже ищет «аренда помещения под пекарню». Дороже за клик, зато горячие клиенты.","<b>Таргетированная реклама</b> (VK Реклама, Meta, LinkedIn) <b>создаёт спрос</b>: показываешь рекламу людям по интересам и признакам, даже если они не ищут. Дешевле клик, но клиент холоднее.","Инструменты точности: <b>ключевые слова</b> и <b>минус-слова</b>, аудитории, <b>похожие аудитории</b> (look-alike), <b>ретаргетинг</b> — догоняешь тех, кто уже был на сайте.","Креатив — 70% результата. Тестируй 3–5 вариантов заголовка и картинки одновременно, отключай слабые, усиливай сильные.","Старт: маленький бюджет, тест 7–14 дней, решение по цифрам. В B2B в США дорого, но точно бьёт LinkedIn: клик стоит в разы больше, чем в соцсетях."],
terms:[["Контекстная реклама","Search ads / PPC"],["Таргетированная реклама","Targeted ads / Paid social"],["Ключевое слово","Keyword"],["Ретаргетинг","Retargeting"],["Похожая аудитория","Lookalike audience"]],
task:{q:"Бюджет — 20 000 ₽, цена клика — 25 ₽, конверсия в заявку — 4%. Сколько заявок получишь?",a:32,tol:0,u:"заявки",ex:"20 000 / 25 = 800 кликов × 4% = 32 заявки. Цена заявки — 625 ₽. Если сделка приносит 100 000 ₽, это очень выгодно."},
real:"Открой Яндекс Вордстат и посмотри, сколько раз в месяц ищут «аренда помещения под пекарню» и 3 похожих запроса. Какие формулировки популярнее?"},

"8-3":{c:["<b>SEO</b> — бесплатный поисковый трафик. Это долгая игра: первые результаты через 3–6 месяцев, зато потом клиенты приходят годами без оплаты за клик.","Основа — <b>интент</b> (намерение): что человек хочет найти по запросу. Страница должна отвечать на него лучше всех, а не просто содержать ключевые слова.","Технический минимум: понятный title и заголовок H1, быстрая загрузка, мобильная версия, нормальная структура. Плюс <b>ссылки</b> на тебя с других авторитетных сайтов.","Для офлайн-точек главное — <b>локальное SEO</b>: карточки в Яндекс Картах и 2ГИС, Google Business Profile в США. Фото, часы работы, ответы на отзывы. Для пекарни это важнее сайта.","Новая реальность: всё больше людей спрашивает у ИИ-ассистентов. Полезный экспертный контент с конкретикой и цифрами чаще попадает в их ответы."],
terms:[["Поисковая оптимизация","SEO — Search engine optimization"],["Поисковое намерение","Search intent"],["Обратные ссылки","Backlinks"],["Локальное SEO","Local SEO"],["Органический трафик","Organic traffic"]],
task:{q:"Статья приносит 1 500 визитов в месяц из поиска. Конверсия в заявку — 2%, из заявок покупает 10%, средний чек — 20 000 ₽. Выручка в месяц от статьи, ₽?",a:60000,tol:0,u:"₽",ex:"1 500 × 2% = 30 заявок × 10% = 3 продажи × 20 000 = 60 000 ₽ в месяц от одной статьи — без оплаты за клики."},
real:"Посмотри карточку любой пекарни «Хлебник» в Яндекс Картах: фото, отзывы, ответы на них, часы работы. Запиши 3 улучшения."},

"8-4":{c:["Без аналитики маркетинг — гадание. Задача — знать, <b>какой рубль из какого канала принёс клиента</b>.","<b>UTM-метки</b> — хвост ссылки, который сообщает аналитике источник: utm_source (откуда), utm_medium (тип), utm_campaign (кампания), utm_content (вариант креатива), utm_term (ключевое слово).","Системы: <b>Яндекс Метрика</b>, <b>Google Analytics 4</b>. Настрой <b>цели</b>: заявка, звонок, покупка. Без целей видны только посещения, а не результат.","<b>Атрибуция</b> — кому засчитать продажу, если клиент видел 3 рекламы. Самая простая модель — последний клик, но она недооценивает каналы, которые знакомят с брендом.","Сквозная аналитика связывает рекламу, сайт, CRM и деньги. Для старта хватит UTM-меток, целей и таблицы, куда ты переносишь продажи из CRM."],
terms:[["UTM-метка","UTM parameter"],["Цель / конверсионное событие","Goal / Conversion event"],["Атрибуция","Attribution"],["Сквозная аналитика","End-to-end analytics"],["Источник трафика","Traffic source"]],
task:{q:"Из 400 заявок за месяц у 120 нет UTM-меток. Какой процент заявок с неизвестным источником?",a:30,tol:0,u:"%",ex:"120 / 400 = 30%. Почти треть бюджета ты оцениваешь вслепую. Первое улучшение — метки на всех ссылках."},
real:"Составь UTM-ссылку для поста в Telegram о будущем сервисе: utm_source=telegram, utm_medium=post, utm_campaign=launch. Проверь её в любом генераторе UTM."},

"8-5":{c:["<b>A/B-тест</b> — показываешь двум равным группам разные версии (заголовок, цену, фото) и смотришь, какая работает лучше. Решения по данным, а не по вкусу.","Правила: <b>одна гипотеза — одно изменение</b>. Гипотеза формулируется заранее: «Если в заголовке будет срок 72 часа, заявок станет на 20% больше».","Нужен <b>достаточный объём</b>: на десятках заявок разница может быть случайной. Используй калькулятор статистической значимости и не останавливай тест, увидев первую разницу.","Гоняй тест <b>полными неделями</b>: поведение в понедельник и субботу разное. И не запускай несколько тестов на одной странице одновременно.","Сначала тестируй крупное: оффер, цену, главный заголовок. Цвет кнопки — в последнюю очередь."],
terms:[["A/B-тест","A/B test / Split test"],["Гипотеза","Hypothesis"],["Статистическая значимость","Statistical significance"],["Контрольная группа","Control group"],["Коэффициент конверсии","Conversion rate"]],
task:{q:"Вариант А: 2 000 визитов, 60 заявок. Вариант Б: 2 000 визитов, 84 заявки. На сколько процентов выросла конверсия Б относительно А?",a:40,tol:0,u:"%",ex:"А: 3%. Б: 4,2%. Рост: (4,2 − 3) / 3 = 40%. Перед внедрением проверь значимость в калькуляторе: при таком объёме разница, скорее всего, реальная."},
real:"Придумай 3 гипотезы A/B-теста для объявления о сдаче помещения на Авито: заголовок, первое фото, цена. Сформулируй каждую по шаблону «Если…, то…, потому что…»."},

/* ---------- НЕДЕЛЯ 9 · СТРАТЕГИЯ И АНАЛИЗ РЫНКА ---------- */
"9-1":{c:["<b>TAM</b> — весь рынок, если бы все возможные клиенты купили у тебя. <b>SAM</b> — часть, которую реально обслужить твоим продуктом и каналами. <b>SOM</b> — доля, которую реально захватить за 2–3 года.","Считай <b>снизу вверх</b>: число клиентов × цена × частота. Расчёт сверху («рынок 10 млрд, возьмём 1%») инвесторы не любят: он ничего не доказывает.","Пример для сорсинга: число брендов на Amazon в нише × доля закупающих в Китае × годовой чек за услугу = SAM. SOM — сколько клиентов ты реально обслужишь.","Большой рынок не обязателен для маленького бизнеса. Важно, чтобы SOM покрывал твои цели: доход, накопления на учёбу, рост.","Рынок оценивают через: отраслевые отчёты, статистику, число компаний в базах, поисковые запросы, интервью с клиентами. Каждую цифру подписывай источником."],
