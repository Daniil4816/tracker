<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Трекер">
<meta name="theme-color" content="#FAF8F4">
<title>Трекер целей</title>
<style>
  :root{
    --bg:#FAF8F4; --card:#FFFFFF; --ink:#2B2B2B; --muted:#8A8478; --beige:#EFE6D8; --empty:#F3F0EA;
    --yellow:#F4E3BE; --mint:#DDEBDF; --gold:#D9A441; --green:#7FAE8C; --green-dark:#5E8F6F;
    --pink:#E9B7B7; --red:#C8736F; --radius:20px;
  }
  body.dark{
    --bg:#1B1A17; --card:#25231F; --ink:#F2EFE9; --muted:#9C978C; --beige:#37342E; --empty:#2E2C27;
    --yellow:#4A4330; --mint:#2E3A31; --green-dark:#8FBF9E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
  body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 96px);max-width:600px;margin:0 auto}
  button,input,select,textarea{font-family:inherit;color:var(--ink)}
  header{padding:16px 4px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  h1{font-size:27px;margin:0;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .hright{display:flex;gap:8px;align-items:center}
  .monthnav{display:flex;gap:6px;align-items:center}
  .monthnav button,.gear{background:var(--card);border:none;border-radius:12px;height:34px;min-width:34px;padding:0 8px;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .monthnav .txt{font-size:12px;color:var(--muted)}
  .small{font-size:12px}.muted{color:var(--muted)}

  .tabs{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--beige);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  .tabs button{flex:1;background:none;border:none;padding:12px 2px;font-size:12px;color:var(--muted)}
  .tabs button.on{color:var(--ink);font-weight:700}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .card{border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .c-month{background:var(--yellow)} .c-plan{background:var(--mint)}
  .ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ring{width:110px;height:110px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
  .ring-label{font-size:12px;color:var(--muted);text-align:center}
  .chart{grid-column:1/-1;background:var(--card)}
  .chart-title{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
  .bars{display:flex;align-items:flex-end;gap:4px;height:90px;position:relative}
  .bar{flex:1;border-radius:6px 6px 3px 3px;background:var(--green);min-height:3px;transition:height .35s ease}
  .bar.today{outline:2px solid var(--gold);outline-offset:1px}
  .bar.empty{background:var(--beige)}
  .xlabels{display:flex;gap:4px;margin-top:6px;font-size:10px;color:var(--muted)}
  .xlabels span{flex:1;text-align:center}

  .today-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .today-head{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:8px}
  .trow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--beige)}
  .trow:first-of-type{border-top:none}
  .tname{flex:1;font-size:14px;min-width:0}
  .tbtn{width:30px;height:30px;border-radius:10px;border:2px solid var(--beige);background:var(--card);font-size:14px;color:#fff;font-weight:700;flex:none;padding:0}
  .tbtn.on{background:var(--green);border-color:var(--green)}
  .tbtn.sm{width:24px;height:24px;border-radius:8px}

  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px 2px 2px;padding-bottom:4px}
  .chip{flex:none;background:var(--card);border:none;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .chip.on{background:var(--ink);color:var(--bg)}

  .section-title{font-size:15px;font-weight:600;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
  .add-btn{background:var(--ink);color:var(--bg);border:none;border-radius:12px;padding:8px 12px;font-size:13px}

  .habit{background:var(--card);border-radius:var(--radius);padding:14px 14px 10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .habit-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .bar-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .habit-name{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .habit-pct{font-size:14px;font-weight:700;color:var(--green-dark)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{font-size:11px;color:var(--muted);background:var(--empty);border-radius:8px;padding:3px 7px}
  .habit-note{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 8px}
  .habit-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;gap:8px}
  .progress{height:6px;border-radius:3px;background:var(--beige);overflow:hidden;margin-bottom:10px}
  .progress > div{height:100%;background:var(--green);border-radius:3px;transition:width .35s ease}
  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:5px}
  .day{aspect-ratio:1;border-radius:8px;background:var(--empty);border:none;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
  .day.done{background:var(--green);color:#fff;font-size:13px;font-weight:700}
  .day.missed{background:var(--beige)}
  .day.off{opacity:.25}
  .day.paused{background:repeating-linear-gradient(45deg,var(--empty),var(--empty) 4px,var(--beige) 4px,var(--beige) 8px)}
  .day.future{opacity:.4}
  .day.today{box-shadow:0 0 0 2px var(--gold) inset}
  .day:disabled{pointer-events:none}

  .subs{margin-top:10px;border-top:1px solid var(--beige);padding-top:8px}
  .subs-title{font-size:12px;color:var(--muted);margin-bottom:4px}
  .sub-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
  .sub-row .t{flex:1;min-width:0}
  .strike{text-decoration:line-through;color:var(--muted)}
  .x{background:none;border:none;color:var(--muted);font-size:16px;padding:0 4px}
  .subadd{display:flex;gap:6px;margin-top:6px}
  .subadd input{flex:1;border:1px solid var(--beige);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
  .subadd button{background:var(--beige);border:none;border-radius:10px;padding:0 12px;font-size:16px}

  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;border-top:1px solid var(--beige);padding-top:8px}
  .acts button{background:var(--empty);border:none;border-radius:9px;padding:6px 9px;font-size:12px;color:var(--ink)}
  .acts button.danger{color:var(--red)}

  .empty-note{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
  .tip{font-size:12px;color:var(--muted);margin:16px 4px 0;line-height:1.5}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .panel{background:var(--card);border-radius:var(--radius);padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h4{margin:0 0 10px;font-size:14px}
  .wdrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
  .wdrow span:first-child{width:24px}
  .wdrow .progress{flex:1;margin:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:7px 4px;border-top:1px solid var(--beige);text-align:left}
  th{color:var(--muted);font-weight:500;font-size:12px}

  .heat-wrap{overflow-x:auto;padding-bottom:6px}
  .heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;gap:3px;width:max-content}
  .heat i{width:12px;height:12px;border-radius:3px;background:var(--empty);display:block}
  .heat .ph,.heat .fut{background:transparent}
  .heat .l1{background:#CFE3D4}.heat .l2{background:#A6CDB2}.heat .l3{background:#7FAE8C}.heat .l4{background:#4F7F5F}

  .card-plain{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .rate{display:flex;gap:8px}
  .rate button{flex:1;padding:10px 0;border-radius:12px;border:none;background:var(--empty);font-size:15px}
  .rate button.on{background:var(--green);color:#fff;font-weight:700}
  .jentry{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .jhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .jtext{font-size:14px;line-height:1.45;white-space:pre-wrap}

  .sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet-back.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:12px;flex:1;min-width:0}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--beige);background:var(--bg);font-size:15px;outline:none}
  .row2{display:flex;gap:10px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
  .swatch.on{border-color:var(--ink)}
  .wdays{display:flex;gap:6px;flex-wrap:wrap}
  .wd{flex:1;min-width:38px;padding:9px 0;border-radius:10px;border:none;background:var(--empty);font-size:13px}
  .wd.on{background:var(--green);color:#fff;font-weight:700}
  .sheet .row{display:flex;gap:10px;margin-top:6px}
  .sheet .row button{flex:1;padding:14px;border-radius:14px;border:none;font-size:15px}
  .btn-cancel{background:var(--beige)} .btn-ok{background:var(--ink);color:var(--bg)}
  .stack{display:flex;flex-direction:column;gap:9px}
  .wide{width:100%;padding:13px;border-radius:14px;border:none;background:var(--empty);font-size:15px;text-align:left}
  .wide.danger{color:var(--red)} .wide.ghost{background:none;text-align:center;color:var(--muted)}

  .toast{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:572px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;justify-content:space-between;align-items:center;gap:10px;z-index:20;font-size:14px}
  .toast.show{display:flex}
  .toast button{background:none;border:none;color:var(--gold);font-weight:700;font-size:14px}

  .sch{background:var(--card);border-radius:var(--radius);padding:6px 14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--beige)}
  .srow:first-child{border-top:none}
  .stime{width:92px;flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sdot{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .sname{flex:1;font-size:15px;min-width:0}
  .srow.past{opacity:.45}
  .srow.now{background:var(--empty);margin:0 -14px;padding:11px 14px;border-radius:14px;border-top-color:transparent}
  .srow.now .sname{font-weight:700}
  .nowbar{height:5px;border-radius:3px;background:var(--beige);margin-top:6px;overflow:hidden}
  .nowbar i{display:block;height:100%;background:var(--green)}
  .snow{background:var(--yellow);border-radius:var(--radius);padding:14px 16px;margin-top:12px}
  .daynav{display:flex;align-items:center;gap:8px;margin-top:10px}
  .daynav button{background:var(--card);border:none;border-radius:12px;height:34px;min-width:34px;padding:0 10px;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .daytitle{flex:1;text-align:center;font-weight:600;font-size:15px}
  .wakes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .addrow{display:flex;gap:8px;margin-top:8px}
  .addrow input,.wakes input{background:var(--empty);border:none;border-radius:10px;padding:9px 10px;font-size:14px}
  .addrow input[type=text]{flex:1;min-width:0}
  .xbtn{background:none;border:none;color:var(--muted);font-size:15px;padding:6px}
  .tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--beige);background:var(--card);color:#fff;font-weight:700;font-size:14px;flex:none;padding:0}
  .tick.on{background:var(--green);border-color:var(--green)}
  .srow.done .sname{text-decoration:line-through;opacity:.55}
  .srow .stime{width:84px}
  .warn{font-size:11px;color:#C0504D;font-weight:600;margin-left:4px}
  .addrow select{background:var(--empty);border:none;border-radius:10px;padding:9px 6px;font-size:16px}
  .card-plain textarea{width:100%;background:var(--empty);border:none;border-radius:10px;padding:10px;font-size:14px;resize:vertical}
  .eng-hero{background:linear-gradient(135deg,var(--yellow),var(--mint));border-radius:var(--radius);padding:18px;margin-top:12px}
  .eng-hero h2{margin:0 0 2px;font-size:20px}
  .eng-row{display:flex;gap:14px;align-items:center;margin-top:10px}
  .eng-ring{position:relative;width:110px;height:110px;flex:none}
  .eng-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px}
  .eng-ring .val small{font-size:11px;font-weight:400;color:var(--muted)}
  .pill{display:inline-block;background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;margin:3px 4px 0 0}
  .chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--beige)}
  .chk:first-child{border-top:none}
  .chk .tx{flex:1;font-size:14px}.chk.done .tx{text-decoration:line-through;opacity:.55}
  .chk .dt{font-size:12px;color:var(--muted);flex:none}
  .strip{display:flex;gap:4px;margin-top:10px}
  .strip i{flex:1;height:26px;border-radius:7px;background:var(--empty);font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .strip i.l1{background:#cfe3d5}.strip i.l2{background:#a9cdb4}.strip i.l3{background:#7FAE8C;color:#fff}.strip i.l4{background:#5E8F6F;color:#fff}
  .res{padding:10px 0;border-top:1px solid var(--beige)}.res:first-child{border-top:none}
  .res .rh{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
  .rp{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
  .rp b{width:26px;color:var(--ink)}.rp .bar2{flex:1;height:7px;background:var(--beige);border-radius:4px;overflow:hidden}
  .rp .bar2 i{display:block;height:100%;border-radius:4px}.rp em{font-style:normal;width:54px;text-align:right}
  details.jr{border-top:1px solid var(--beige);padding:10px 0}details.jr:first-child{border-top:none}
  details.jr summary{font-weight:600;font-size:14px;cursor:pointer;list-style:none}
  details.jr .body{white-space:pre-line;font-size:13px;line-height:1.55;margin-top:8px;color:var(--ink)}
  .ms{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
  .ms .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--beige);margin-top:3px;flex:none;background:var(--card)}
  .ms.on .dot{background:var(--green);border-color:var(--green)}
</style>
</head>
<body>

<header>
  <div>
    <h1>Трекер целей</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="hright">
    <div class="monthnav" id="monthNav">
      <button data-act="prev" aria-label="Назад">‹</button>
      <button class="txt" data-act="today">сегодня</button>
      <button data-act="next" aria-label="Вперёд">›</button>
    </div>
    <button class="gear" data-act="settings" aria-label="Настройки">⚙</button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs">
  <button data-act="tab" data-v="day">День</button>
  <button data-act="tab" data-v="track">Трекер</button>
  <button data-act="tab" data-v="eng">Англ.</button>
  <button data-act="tab" data-v="stats">Статистика</button>
  <button data-act="tab" data-v="year">Год</button>
  <button data-act="tab" data-v="journal">Дневник</button>
</nav>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn" data-act="undo">Отменить</button></div>

<!-- Editor sheet: add / edit habit -->
<div class="sheet-back" id="editorBack">
  <div class="sheet">
    <h3 id="edTitle"></h3>
    <div class="field"><label>Название</label><input id="fName" maxlength="40" placeholder="Например: Зарядка"></div>
    <div class="row2">
      <div class="field" style="flex:0 0 80px"><label>Значок</label><input id="fIcon" maxlength="2" placeholder="⚡"></div>
      <div class="field"><label>Категория</label><input id="fCat" list="catList" maxlength="20" placeholder="Здоровье"><datalist id="catList"></datalist></div>
    </div>
    <div class="field"><label>Цвет</label><div class="swatches" id="fColors"></div></div>
    <div class="field"><label>Что это</label>
      <select id="fKind">
        <option value="habit">Привычка: отмечаю каждый день</option>
        <option value="goal">Цель или проект: шаги и срок</option>
      </select>
    </div>
    <div class="field habit-only"><label>Как часто</label>
      <select id="fType">
        <option value="daily">Каждый день</option>
        <option value="weekdays">По дням недели</option>
        <option value="weekly">Несколько раз в неделю</option>
      </select>
    </div>
    <div class="field" id="wdWrap"><label>Дни недели</label><div class="wdays" id="fDays"></div></div>
    <div class="field" id="pwWrap"><label>Сколько раз в неделю</label><input id="fPerWeek" type="number" min="1" max="7" value="3"></div>
    <div class="row2 habit-only">
      <div class="field"><label>Цель за день</label><input id="fTarget" type="number" min="1" value="1"></div>
      <div class="field"><label>Единица</label><input id="fUnit" maxlength="12" placeholder="стр., мин"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Напоминание</label><input id="fRem" type="time"></div>
      <div class="field"><label>Срок</label><input id="fDeadline" type="date"></div>
    </div>
    <div class="row2 habit-only">
      <div class="field"><label>Пауза с</label><input id="fPF" type="date"></div>
      <div class="field"><label>Пауза по</label><input id="fPT" type="date"></div>
    </div>
    <div class="field"><label>Описание</label><textarea id="fNote" rows="3" maxlength="300" placeholder="Что конкретно делать"></textarea></div>
    <div class="row">
      <button class="btn-cancel" data-act="close">Отмена</button>
      <button class="btn-ok" data-act="editor-save">Сохранить</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet-back" id="settingsBack">
  <div class="sheet">
    <h3>Настройки</h3>
    <div class="stack">
      <button class="wide" data-act="theme">Тёмная тема</button>
      <button class="wide" data-act="notify">Включить уведомления</button>
      <button class="wide" data-act="seed">Добавить мои задачи и цели из плана</button>

function mkSubs(list){
  return (list || []).map(s => typeof s === "string" ? {id:uid(), text:s, done:false} : {id:uid(), text:s.t, done:!!s.done});
}
function fromSeed(s){
  return {...base(), ...s, id:uid(), kind:s.kind || "habit", subtasks:mkSubs(s.subtasks), marks:{}};
}
// adds seed items whose names are not in the list yet; returns how many were added
function addSeed(){
  const names = new Set(state.habits.map(h => h.name));
  let added = 0;
  SEED.forEach(s => { if(!names.has(s.name)){ state.habits.push(fromSeed(s)); added++; } });
  return added;
}

const $ = id => document.getElementById(id);

const daysIn = (y,m0) => new Date(y, m0+1, 0).getDate();
const dow = (y,m0,d) => new Date(y,m0,d).getDay();
function todayParts(){ const t=new Date(); return {y:t.getFullYear(), m:t.getMonth(), d:t.getDate(), iso:iso(t.getFullYear(),t.getMonth(),t.getDate())}; }
function elapsedFor(y,m0){
  const T = todayParts();
  if (y < T.y || (y === T.y && m0 < T.m)) return daysIn(y,m0);
  if (y === T.y && m0 === T.m) return T.d;
  return 0;
}

function base(){

// ---------- state ----------
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && s.habits) return s; }catch(e){}

  try{ const o = JSON.parse(localStorage.getItem(OLD)); if(o && o.habits) habits = o.habits.map(h => ({...base(), ...h})); }catch(e){}
  if(!habits) habits = SEED.map(fromSeed);
  return { habits, journal:{}, dark:false };
}

// ---------- habit logic ----------
const valOf = (h,k) => h.marks[k] || 0;
const isDoneKey = (h,k) => valOf(h,k) >= (h.target || 1);
const isPausedKey = (h,k) => !!(h.pauseFrom && h.pauseTo && k >= h.pauseFrom && k <= h.pauseTo);
function isPlannedDay(h,y,m0,d){
  if(h.archived || h.type === "weekly") return false;
  if(isPausedKey(h, iso(y,m0,d))) return false;
  if(h.type === "weekdays") return (h.days || []).includes(dow(y,m0,d));
  return true;
}
function monthStats(h,y,m0,E){
  if(h.type === "weekly"){
    let done = 0;
    for(let d=1; d<=E; d++) if(isDoneKey(h, iso(y,m0,d))) done++;
    const planned = (h.perWeek || 1) * E / 7;
    return { planned, done, pct: planned ? Math.min(100, Math.round(100*done/planned)) : 0 };
  }
  let planned = 0, done = 0;
  for(let d=1; d<=E; d++){
    if(!isPlannedDay(h,y,m0,d)) continue;
    planned++;
    if(isDoneKey(h, iso(y,m0,d))) done++;
  }
  return { planned, done, pct: planned ? Math.min(100, Math.round(100*done/planned)) : 0 };
}
function totals(list,y,m0,E){
  return list.reduce((a,h) => { const s = monthStats(h,y,m0,E); a.planned += s.planned; a.done += s.done; return a; }, {planned:0, done:0});
}
function perDayCounts(list,y,m0,E){
  const out = [];
  for(let d=1; d<=E; d++){
    const k = iso(y,m0,d);
    out.push(list.filter(h => isDoneKey(h,k) && (h.type === "weekly" || isPlannedDay(h,y,m0,d))).length);
  }
  return out;
}
function walk(h){
  const T0 = new Date(); T0.setHours(0,0,0,0);
  if(h.type === "weekly"){
    let cur = 0;
    for(let w=1; w<300; w++){
      let done = 0;
      for(let off=7*w-6; off<=7*w; off++){
        const dt = new Date(T0.getFullYear(), T0.getMonth(), T0.getDate()-off);
        if(isDoneKey(h, iso(dt.getFullYear(), dt.getMonth(), dt.getDate()))) done++;
      }
      if(done >= (h.perWeek || 1)) cur++; else break;
    }
    return { current:cur, best:cur };
  }
  const keys = Object.keys(h.marks);
  let start = T0;
  if(keys.length){ const mn = keys.sort()[0].split("-").map(Number); start = new Date(mn[0], mn[1]-1, mn[2]); }
  const tk = iso(T0.getFullYear(), T0.getMonth(), T0.getDate());
  let cur = 0, best = 0;
  for(let dt = new Date(start); dt <= T0; dt.setDate(dt.getDate()+1)){
    const y=dt.getFullYear(), m=dt.getMonth(), d=dt.getDate();
    if(!isPlannedDay(h,y,m,d)) continue;
    const k = iso(y,m,d);
    if(isDoneKey(h,k)){ cur++; best = Math.max(best,cur); }
    else if(k !== tk) cur = 0;
  }
  return { current:cur, best };
}
function deadlineText(s){
  const [y,m,d] = s.split("-").map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((new Date(y,m-1,d) - t) / 864e5);
  return diff >= 0 ? `до ${pad(d)}.${pad(m)} · ${diff} дн.` : "срок прошёл";
}
function clickKey(h,k){
  if((h.target || 1) > 1){
    const v = prompt(`${h.name}: сколько сделано? (цель ${h.target}${h.unit ? " "+h.unit : ""})`, valOf(h,k) || "");
    if(v === null) return;
    const n = Math.max(0, Math.round(Number(v) || 0));
    commit(() => { const hh = find(h.id); if(n > 0) hh.marks[k] = n; else delete hh.marks[k]; });
  } else {
    commit(() => { const hh = find(h.id); if(hh.marks[k]) delete hh.marks[k]; else hh.marks[k] = 1; });
  }
}
function move(id, dir){
  commit(() => {
    const i = state.habits.findIndex(h => h.id === id), j = i + dir;
    if(i < 0 || j < 0 || j >= state.habits.length) return;
    [state.habits[i], state.habits[j]] = [state.habits[j], state.habits[i]];
  });
}

}

}

}
function goalCard(h){
  const total = (h.subtasks || []).length, dn = (h.subtasks || []).filter(s => s.done).length;
  const pct = total ? Math.round(100*dn/total) : 0;
  const dl = h.deadline ? deadlineText(h.deadline) : "";
  return `<div class="habit">
    <div class="habit-head">
      <span class="bar-dot" style="background:${h.color}"></span>
      <div class="habit-name" data-act="edit" data-id="${h.id}">${iconOf(h)}${esc(h.name)}</div>

      ${h.archived ? `<span class="tag">в архиве</span>` : ""}
    </div>

    <div class="habit-meta"><span>шагов: ${dn} из ${total}</span><span>${dl}</span></div>

}

function habitCard(h, E, D){
  if(h.kind === "goal") return goalCard(h);
  const y = view.year, m = view.month, T = todayParts();
  const st = monthStats(h,y,m,E), sk = walk(h);
  const streakTxt = h.type === "weekly" ? `серия: ${sk.current} нед.` : `серия: ${sk.current} дн. · рекорд ${sk.best}`;
  const sched = h.type === "weekly" ? `${h.perWeek} раз в неделю`
    : h.type === "weekdays" ? ((h.days||[]).length ? (h.days.slice().sort((a,b)=>WD_ORDER.indexOf(a)-WD_ORDER.indexOf(b)).map(v => WD[WD_ORDER.indexOf(v)]).join(", ")) : "дни не выбраны")
    : "каждый день";
  const goal = (h.target || 1) > 1 ? `цель ${h.target}${h.unit ? " "+esc(h.unit) : ""} в день` : "";
  const paused = isPausedKey(h, T.iso);
  const days = Array.from({length:D}, (_,i) => {
    const d = i+1, k = iso(y,m,d);
    const future = d > E, pz = isPausedKey(h,k), planned = h.type === "weekly" || isPlannedDay(h,y,m,d);
    const done = isDoneKey(h,k), v = valOf(h,k);
    const cls = ["day"];
    if(done) cls.push("done");
    else if(!future && !pz && planned) cls.push("missed");
    if(future) cls.push("future");
    if(pz && !future) cls.push("paused");
    if(!planned && !pz && !future) cls.push("off");
    if(k === T.iso) cls.push("today");
    const dis = (future || pz || !planned) ? "disabled" : "";
    const label = done ? ((h.target||1) > 1 ? v : "✓") : d;
    return `<button class="${cls.join(" ")}" data-act="cell" data-id="${h.id}" data-d="${d}" ${dis}>${label}</button>`;
  }).join("");
  const subs = (h.subtasks || []).map(s =>
    `<div class="sub-row"><button class="tbtn sm ${s.done?"on":""}" data-act="subt" data-id="${h.id}" data-sid="${s.id}">${s.done?"✓":""}</button>
     <span class="t ${s.done?"strike":""}">${esc(s.text)}</span>
     <button class="x" data-act="subdel" data-id="${h.id}" data-sid="${s.id}" aria-label="Удалить шаг">×</button></div>`).join("");
  const subDone = (h.subtasks || []).filter(s => s.done).length;
  const subBlock = `<div class="subs">
      <div class="subs-title">Шаги ${h.subtasks.length ? `· ${subDone}/${h.subtasks.length}` : ""}</div>
      ${subs}
      <div class="subadd"><input id="sub-${h.id}" placeholder="Новый шаг" maxlength="80"><button data-act="subadd" data-id="${h.id}">+</button></div>
    </div>`;
  const dl = h.deadline ? deadlineText(h.deadline) : "";
  return `<div class="habit">
    <div class="habit-head">
      <span class="bar-dot" style="background:${h.color}"></span>
      <div class="habit-name" data-act="edit" data-id="${h.id}">${iconOf(h)}${esc(h.name)}</div>
      <div class="habit-pct">${st.pct}%</div>
    </div>
    <div class="tags">
      ${h.category ? `<span class="tag">${esc(h.category)}</span>` : ""}
      <span class="tag">${sched}</span>
      ${goal ? `<span class="tag">${goal}</span>` : ""}
      ${h.reminder ? `<span class="tag">🔔 ${h.reminder}</span>` : ""}
      ${dl ? `<span class="tag">${dl}</span>` : ""}
      ${paused ? `<span class="tag">⏸ пауза</span>` : ""}
      ${h.archived ? `<span class="tag">в архиве</span>` : ""}
    </div>
    ${h.note ? `<div class="habit-note">${esc(h.note)}</div>` : ""}
    <div class="habit-meta"><span>${streakTxt}</span><span>${st.done} из ${Math.round(st.planned*10)/10} за месяц</span></div>
    <div class="progress"><div style="width:${st.pct}%;background:${h.color}"></div></div>
    <div class="days">${days}</div>
    ${subBlock}
    <div class="acts">
      <button data-act="edit" data-id="${h.id}">Изменить</button>
      <button data-act="up" data-id="${h.id}">↑</button>
      <button data-act="down" data-id="${h.id}">↓</button>
      <button data-act="archive" data-id="${h.id}">В архив</button>
      <button class="danger" data-act="del" data-id="${h.id}">Удалить</button>
    </div>
  </div>`;
}

function trackHTML(){

  const goals = everything.filter(h => h.kind === "goal");
  const cats = [...new Set(everything.map(h => h.category).filter(Boolean))];
  if(filter !== "Все" && !cats.includes(filter)) filter = "Все";
  const shown = filter === "Все" ? active : active.filter(h => h.category === filter);
  const goalsShown = filter === "Все" ? goals : goals.filter(h => h.category === filter);
  const tot = totals(active, view.year, view.month, E);
  const pct = tot.planned ? Math.min(100, Math.round(100*tot.done/tot.planned)) : 0;
  const cnt = perDayCounts(active, view.year, view.month, E);
  const maxH = Math.max(active.length, 1);
  const bars = Array.from({length:D}, (_,i) => {
    const d = i+1, c = d <= E ? cnt[i] : 0;

    const cls = ["bar", (d===E) ? "today" : "", (d<=E && !c) ? "empty" : ""].join(" ");

  const cardsHTML = shown.map(h => habitCard(h, E, D)).join("") || `<div class="empty-note">Пока пусто. Нажми «+ Добавить».</div>`;

function statsHTML(){
  const active = state.habits.filter(h => !h.archived && h.kind !== "goal");
  const E = elapsedFor(view.year, view.month);
  const prev = view.month === 0 ? {y:view.year-1, m:11} : {y:view.year, m:view.month-1};
  const Ep = elapsedFor(prev.y, prev.m);
  const t = totals(active, view.year, view.month, E), tp = totals(active, prev.y, prev.m, Ep);
  const pctOf = x => x.planned ? Math.min(100, Math.round(100*x.done/x.planned)) : 0;
  const bestAll = Math.max(0, ...active.map(h => walk(h).best));
  const wdStats = Array.from({length:7}, () => ({p:0, d:0}));
  active.forEach(h => {
    if(h.type === "weekly") return;
    for(let d=1; d<=E; d++){
      if(!isPlannedDay(h, view.year, view.month, d)) continue;
      const w = dow(view.year, view.month, d);
      wdStats[w].p++;
      if(isDoneKey(h, iso(view.year, view.month, d))) wdStats[w].d++;
    }
  });
  const wdRows = WD_ORDER.map((w,i) => {
    const s = wdStats[w], p = s.p ? Math.round(100*s.d/s.p) : 0;
    return `<div class="wdrow"><span>${WD[i]}</span><div class="progress"><div style="width:${p}%"></div></div><span class="muted small">${p}%</span></div>`;
  }).join("");
  const T = todayParts();
  let wp = 0, wd = 0;
  for(let off=0; off<7; off++){
    const dt = new Date(T.y, T.m, T.d-off), y=dt.getFullYear(), m=dt.getMonth(), d=dt.getDate(), k=iso(y,m,d);
    active.forEach(h => {
      if(h.type === "weekly"){ wp += h.perWeek/7; if(isDoneKey(h,k)) wd++; return; }
      if(isPlannedDay(h,y,m,d)){ wp++; if(isDoneKey(h,k)) wd++; }
    });
  }
  const pct7 = wp ? Math.min(100, Math.round(100*wd/wp)) : 0;
  const rows = active.map(h => {
    const s = monthStats(h, view.year, view.month, E), w = walk(h);
    return `<tr><td>${iconOf(h)}${esc(h.name)}</td><td>${s.pct}%</td><td>${w.current}</td><td>${h.type==="weekly"?"—":w.best}</td></tr>`;
  }).join("");
  return `
    <div class="stats-grid">
      <div class="stat"><div class="n">${bestAll}</div><div class="l">рекордная серия, дней</div></div>
      <div class="stat"><div class="n">${pctOf(t)}%</div><div class="l">${MONTHS[view.month]}: выполнено</div></div>
      <div class="stat"><div class="n">${pctOf(tp)}%</div><div class="l">${MONTHS[prev.m]}: выполнено</div></div>
      <div class="stat"><div class="n">${pct7}%</div><div class="l">последние 7 дней</div></div>
    </div>
    <div class="panel"><h4>По дням недели (${MONTHS[view.month]})</h4>${wdRows}</div>
    <div class="panel"><h4>По привычкам (${MONTHS[view.month]})</h4>
      <table><tr><th>Привычка</th><th>За месяц</th><th>Серия</th><th>Рекорд</th></tr>${rows || `<tr><td colspan="4" class="muted">Нет привычек</td></tr>`}</table>
    </div>`;
}

function yearHTML(){
  const Y = view.year, active = state.habits.filter(h => !h.archived && h.kind !== "goal"), T = todayParts();
  const offset = new Date(Y,0,1).getDay();
  const days = (Y%4===0 && (Y%100!==0 || Y%400===0)) ? 366 : 365;
  let cells = "";
  for(let i=0; i<offset; i++) cells += `<i class="ph"></i>`;
  for(let n=0; n<days; n++){
    const dt = new Date(Y,0,1+n), y=dt.getFullYear(), m=dt.getMonth(), d=dt.getDate(), k=iso(y,m,d);
    const future = k > T.iso;
    let p = 0, dn = 0;
    active.forEach(h => {
      if(h.type === "weekly"){ p += h.perWeek/7; if(isDoneKey(h,k)) dn++; }
      else if(isPlannedDay(h,y,m,d)){ p++; if(isDoneKey(h,k)) dn++; }
    });
    let lvl = 0;
    if(!future && p > 0){ const r = dn/p; lvl = r === 0 ? 0 : r < 0.34 ? 1 : r < 0.67 ? 2 : r < 1 ? 3 : 4; }
    cells += `<i class="${future ? "fut" : "l"+lvl}" title="${k}: ${dn} из ${Math.round(p*10)/10}"></i>`;
  }
  return `
    <div class="section-title"><span>${Y}</span><span class="muted small">каждый квадрат — день, чем темнее, тем больше выполнено</span></div>
    <div class="card-plain"><div class="heat-wrap"><div class="heat">${cells}</div></div></div>
    <div class="tip">Серый — ничего не запланировано или не отмечено, зелёный — выполнено. Листай месяцы стрелками сверху.</div>`;
}

function toMin(t){ const [h,m] = t.split(":").map(Number); return h*60+m; }
function fromMin(x){ x = Math.max(0, Math.min(1439, x)); return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
function sched(){
  const s = state.sched = state.sched || {};
  s.wake = s.wake || {}; s.extra = s.extra || {}; s.plans = s.plans || {}; s.seeded = s.seeded || {};
  return s;
}
// Известные дела на конкретные даты (добавляются один раз, потом это обычные дела: можно править и удалять)

    tasks:["Выезд по одобренным точкам Хлебника — по желанию"] }
};
function seedDay(key){
  const sc = sched(); let changed = false;
  Object.keys(DATED).filter(k => k === key || k.startsWith(key + "#")).forEach(id => {
    if(sc.seeded[id]) return; sc.seeded[id] = 1; changed = true; const d = DATED[id];
    if(d.wake && !sc.wake[key]) sc.wake[key] = d.wake;
    if(d.extra){ const pb = sc.plans[key] && sc.plans[key].blocks;
      if(pb) d.extra.forEach(e => pb.push({id:uid(), from:e.from, to:e.to, name:e.name, icon:e.icon || "📌", done:false}));
      else sc.extra[key] = (sc.extra[key] || []).concat(d.extra.map(e => ({...e}))); }
    if(d.tasks){ const pl = plan(key); d.tasks.forEach(t => { if(!pl.tasks.some(q => q.text === t)) pl.tasks.push({id:uid(), text:t.slice(0,80), done:false}); }); }
    if(d.move){ materialize(key); const pb = plan(key).blocks;
      d.move.forEach(m => { const b = pb.find(q => q.name === m.name); if(b){ b.from = m.from; b.to = m.to; } }); }
  });
  if(changed) save();
}
let dayOff = 0, editId = null;
function dayDate(){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+dayOff); return d; }
function dateFromKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); }
function curKey(){ const D = dayDate(); return iso(D.getFullYear(), D.getMonth(), D.getDate()); }
function plan(key){ const sc = sched(); return sc.plans[key] = sc.plans[key] || {blocks:null, tasks:[], note:""}; }
const byFrom = (a,b) => toMin(a.from) - toMin(b.from) || toMin(a.to) - toMin(b.to);
function blocksFor(d, key){
  const sc = sched(), wd = d.getDay(), weekend = wd === 0 || wd === 6, pl = sc.plans[key];
  if(pl && pl.blocks) return {list: pl.blocks.slice().sort(byFrom), weekend, custom:true};
  let list;
  if(weekend){
    const wake = toMin(sc.wake[key] || "09:00"); let t = wake;
    list = WEEKEND_MORNING.map(b => { const o = {from:fromMin(t), to:fromMin(t+b.dur), name:b.name, icon:b.icon}; t += b.dur; return o; })
      .concat(WEEKEND_FIXED.map(b => ({from:b.from, to:b.to, name:b.name, icon:b.icon})));
  } else list = WEEKDAY.map(b => ({from:b.from, to:b.to, name:b.name, icon:b.icon}));
  (sc.extra[key] || []).forEach(e => list.push({from:e.from, to:e.to, name:e.name, icon:e.icon || "📌"}));
  list.sort(byFrom); list.forEach((b,i) => { b.id = "v"+i; });
  return {list, weekend, custom:false};
}

    const on = !!E.ms[m.id], d = daysTo(m.date);
    return `<div class="ms ${on ? "on" : ""}" data-act="engms" data-v="${m.id}" style="cursor:pointer"><div class="dot"></div>
      <div style="flex:1"><div style="font-size:14px;${on ? "text-decoration:line-through;opacity:.6" : ""}">${esc(m.text)}</div>
      <div class="small muted">${fmtD(m.date)}${on ? "" : d >= 0 ? " · осталось " + d + " дн." : " · срок прошёл"}</div></div></div>`; }).join("")}
    <div class="small muted" style="margin-top:4px">Нажми на точку, чтобы отметить выполненной.</div></div>`;
  const goals = `<div class="section-title"><span>Цели на ноябрь (к 30.11)</span></div><div class="card-plain">${ENG_SEED.goals.map(g => {
    const on = !!E.gd[g.id]; return `<div class="chk ${on ? "done" : ""}"><button class="tick ${on ? "on" : ""}" data-act="enggoal" data-v="${g.id}">${on ? "✓" : ""}</button><div class="tx">${esc(g.text)}</div></div>`; }).join("")}</div>`;
  const planBox = `<div class="section-title"><span>План на ближайшее</span></div><div class="card-plain">${ENG_SEED.plan.map(x => `<div class="chk"><div class="tx" style="padding-left:2px">• ${esc(x)}</div></div>`).join("")}</div>`;
  const results = `<div class="section-title"><span>Результаты</span></div><div class="card-plain">${E.results.slice().sort((a,b) => b.date.localeCompare(a.date)).map(r => {
    const g = r.parts.reduce((x,q) => x+q.g, 0), m = r.parts.reduce((x,q) => x+q.m, 0);
    return `<div class="res"><div class="rh"><span>${esc(r.name)}</span><span class="muted small">${fmtD(r.date)}</span></div>
      ${r.parts.map(q => `<div class="rp"><b>${esc(q.l || "")}</b><div class="bar2"><i style="width:${Math.round(q.g/q.m*100)}%;background:${scoreColor(q.g/q.m)}"></i></div><em>${q.a ? "≈" : ""}${q.g}/${q.m}</em></div>`).join("")}
      ${r.parts.length > 1 ? `<div class="small muted" style="margin-top:4px">Итого ${g}/${m} · ${Math.round(g/m*100)}%</div>` : ""}</div>`; }).join("")}
    <div class="res" style="color:var(--muted);font-size:13px">Листы 1 и 8 (V1, V2, V3): пока не присланы.</div>
    <div class="addrow"><input type="text" id="rName" maxlength="40" placeholder="Что сдал (лист, блок)"><input type="number" id="rGot" placeholder="верно" style="width:70px"><input type="number" id="rMax" placeholder="из" style="width:60px"><button class="chip on" data-act="engres">+</button></div></div>`;
  const log = `<div class="section-title"><span>Журнал занятий</span></div><div class="card-plain">
    <div class="addrow" style="margin-top:0"><input type="date" id="jlDate" value="${tk}"><input type="text" id="jlTitle" maxlength="60" placeholder="Заголовок"></div>
    <textarea id="jlBody" rows="3" maxlength="2000" placeholder="Что делали, слабые места, сильные стороны" style="margin-top:8px"></textarea>
    <button class="wide" style="text-align:center;background:var(--ink);color:var(--bg);margin-top:8px" data-act="englog">Добавить запись</button>
    <div style="margin-top:12px">${E.log.slice().sort((a,b) => b.date.localeCompare(a.date)).map((j,i) => `<details class="jr" ${i === 0 ? "open" : ""}><summary>${fmtD(j.date)} · ${esc(j.title)}</summary><div class="body">${esc(j.body)}</div></details>`).join("")}</div></div>`;
  return `${hero}${today}${ms}${goals}${planBox}${results}${log}`;
}

function render(){
  document.body.classList.toggle("dark", !!state.dark);
  document.querySelectorAll(".tabs [data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === tab));
  $("monthNav").style.display = (tab === "journal" || tab === "day" || tab === "eng") ? "none" : "";
  $("subtitle").textContent = tab === "day" ? "Расписание" : tab === "eng" ? "Английский" : tab === "year" ? String(view.year) : `${MONTHS[view.month]} ${view.year}`;
  $("main").innerHTML = tab === "day" ? dayHTML() : tab === "eng" ? engHTML() : tab === "track" ? trackHTML() : tab === "stats" ? statsHTML() : tab === "year" ? yearHTML() : journalHTML();
}

// ---------- navigation ----------
function nav(dir){
  if(tab === "year"){ view.year += dir; }
  else { view.month += dir; if(view.month < 0){ view.month = 11; view.year--; } if(view.month > 11){ view.month = 0; view.year++; } }
  render();
}
function goToday(){ const t = new Date(); view = {year:t.getFullYear(), month:t.getMonth()}; render(); }

// ---------- editor ----------
function renderPickers(){
  $("fColors").innerHTML = PALETTE.map(c => `<button type="button" class="swatch ${c===ef.color?"on":""}" style="background:${c}" data-act="color" data-v="${c}" aria-label="цвет"></button>`).join("");
  $("fDays").innerHTML = WD_ORDER.map((v,i) => `<button type="button" class="wd ${ef.days.includes(v)?"on":""}" data-act="wd" data-v="${v}">${WD[i]}</button>`).join("");
}
function updateEditorVis(){
  const goal = $("fKind").value === "goal", ty = $("fType").value;
  document.querySelectorAll(".habit-only").forEach(el => el.style.display = goal ? "none" : "");
  $("wdWrap").style.display = (!goal && ty === "weekdays") ? "" : "none";
  $("pwWrap").style.display = (!goal && ty === "weekly") ? "" : "none";
}
function openEditor(id){
  editing = id;
  const h = id ? find(id) : null, src = h || base();
  ef = { color: src.color || PALETTE[0], days: [...(src.days || [])] };
  $("edTitle").textContent = h ? "Изменить привычку" : "Новая привычка";
  $("fName").value = src.name || ""; $("fIcon").value = src.icon || ""; $("fCat").value = src.category || "";
  $("fKind").value = src.kind || "habit";
  $("fType").value = src.type || "daily"; $("fPerWeek").value = src.perWeek || 3;
  $("fTarget").value = src.target || 1; $("fUnit").value = src.unit || "";
  $("fRem").value = src.reminder || ""; $("fDeadline").value = src.deadline || "";
  $("fPF").value = src.pauseFrom || ""; $("fPT").value = src.pauseTo || ""; $("fNote").value = src.note || "";
  $("catList").innerHTML = [...new Set(state.habits.map(x => x.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join("");
  renderPickers(); updateEditorVis();
  $("editorBack").classList.add("show");
}
function saveEditor(){
  const name = $("fName").value.trim();
  if(!name){ toast("Введите название"); return; }
  const type = $("fType").value;
  const days = type === "weekdays" ? WD_ORDER.filter(v => ef.days.includes(v)) : [];
  const obj = {
    kind: $("fKind").value,
    name: name.slice(0,40), icon: $("fIcon").value.trim().slice(0,2), category: $("fCat").value.trim().slice(0,20),
    color: ef.color, type, days,
    perWeek: Math.min(7, Math.max(1, Math.round(Number($("fPerWeek").value) || 1))),
    target: Math.max(1, Math.round(Number($("fTarget").value) || 1)),
    unit: $("fUnit").value.trim().slice(0,12), reminder: $("fRem").value, deadline: $("fDeadline").value,
    pauseFrom: $("fPF").value, pauseTo: $("fPT").value, note: $("fNote").value.trim().slice(0,300)
  };
  if(editing){ commit(() => Object.assign(find(editing), obj)); }
  else { commit(() => state.habits.push({...base(), ...obj})); }
  closeSheets();
}
function closeSheets(){ document.querySelectorAll(".sheet-back").forEach(s => s.classList.remove("show")); }

// ---------- export / import ----------
function download(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
// ---------- calendar export (.ics): reminders arrive from the phone's Calendar even when the page is closed ----------
function exportIcs(){
  const BYDAY = ["SU","MO","TU","WE","TH","FR","SA"];   // index = JS getDay()
  const T = todayParts(), today = T.iso.replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const esc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const title = h => (h.icon ? h.icon + " " : "") + h.name;
  const out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//tracker//RU","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:Трекер целей","X-WR-TIMEZONE:Europe/Moscow",
    "BEGIN:VTIMEZONE","TZID:Europe/Moscow","BEGIN:STANDARD","DTSTART:19700101T000000",
    "TZOFFSETFROM:+0300","TZOFFSETTO:+0300","TZNAME:MSK","END:STANDARD","END:VTIMEZONE"];
  let n = 0;
  state.habits.forEach(h => {
    if(h.archived) return;
    if(h.kind !== "goal" && h.reminder){
      const days = (h.type === "daily" ? [0,1,2,3,4,5,6] : (h.days || [])).slice();
      if(!days.length) return;
      const rule = days.length === 7 ? "FREQ=DAILY" : "FREQ=WEEKLY;BYDAY=" + days.map(d => BYDAY[d]).join(",");
      const hm = h.reminder.replace(":", "") + "00";
      out.push("BEGIN:VEVENT", `UID:habit-${h.id}@tracker`, `DTSTAMP:${stamp}`,
        `DTSTART;TZID=Europe/Moscow:${today}T${hm}`, "DURATION:PT15M", `RRULE:${rule}`,
        `SUMMARY:${esc(title(h))}`, `DESCRIPTION:${esc(h.note || "Пора отметить в трекере")}`,
        "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc(title(h))}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT");
      n++;
    }
    if(h.kind === "goal" && h.deadline && h.deadline >= T.iso){
      const d = h.deadline.replace(/-/g, "");
      out.push("BEGIN:VEVENT", `UID:goal-${h.id}@tracker`, `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${d}`, "DURATION:P1D", `SUMMARY:${esc("Срок: " + title(h))}`,
        "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc("Через неделю срок: " + h.name)}`,"TRIGGER:-P7D","END:VALARM",
        "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc("Завтра срок: " + h.name)}`,"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
      n++;
    }
  });
  out.push("END:VCALENDAR");
  if(!n){ toast("Нет привычек со временем напоминания и целей со сроком"); return; }
  const body = out.map(l => { // fold lines longer than 75 bytes, as the format requires
    const parts = []; let cur = "", bytes = 0;
    for(const ch of l){ const b = new TextEncoder().encode(ch).length;
      if(bytes + b > 73){ parts.push(cur); cur = " "; bytes = 1; }
      cur += ch; bytes += b; }
    parts.push(cur); return parts.join("\r\n");
  }).join("\r\n") + "\r\n";
  download(new Blob([body], {type:"text/calendar;charset=utf-8"}), `tracker-${T.iso}.ics`);
  toast(`В календарь: ${n} напоминаний. Открой скачанный файл и нажми «Добавить все»`);
}

// ---------- минуты из приложения «English: тексты и слова» (кнопка «Перенести минуты в трекер» копирует ENGMIN {...}) ----------
async function importEngMin(){
  let txt = "";
  try{ txt = await Promise.race([navigator.clipboard.readText(), new Promise(r => setTimeout(() => r(""), 1500))]); }catch(e){}
  if(!/ENGMIN\s*\{/.test(txt || "")) txt = prompt("Вставь код из приложения английского (начинается с ENGMIN)") || "";
  const m = txt.match(/ENGMIN\s*(\{[\s\S]*\})/);
  if(!m){ toast("Код не найден: в приложении нажми «Перенести минуты в трекер»"); return; }
  let data; try{ data = JSON.parse(m[1]); }catch(e){ toast("Код повреждён, скопируй ещё раз"); return; }
  let n = 0;
  commit(() => {
    let h = state.habits.find(q => q.name === "Английский: минимум 2 часа в день" && !q.archived);
    if(!h){ const s = SEED.find(q => q.name === "Английский: минимум 2 часа в день"); if(!s) return; h = fromSeed(s); state.habits.unshift(h); }
    Object.entries(data).forEach(([k, v]) => { v = Math.round(+v || 0); if(/^\d{4}-\d{2}-\d{2}$/.test(k) && v > (h.marks[k] || 0)){ h.marks[k] = v; n++; } });
  });
  toast(n ? `Английский: обновлено дней — ${n}` : "Всё уже перенесено");
}
function exportCsv(){
  const rows = ["дата;привычка;значение;выполнено"];
  state.habits.forEach(h => {
    Object.keys(h.marks).sort().forEach(k => {
      const v = h.marks[k];
      rows.push([k, `"${h.name.replace(/"/g,'""')}"`, v, v >= (h.target||1) ? 1 : 0].join(";"));
    });
  });
  download(new Blob(["﻿" + rows.join("\n")], {type:"text/csv;charset=utf-8"}), "tracker.csv");
}
function exportJson(){
  const T = todayParts();
  download(new Blob([JSON.stringify(state, null, 2)], {type:"application/json"}), `tracker-backup-${T.iso}.json`);
}

// ---------- reminders (only while the page is open) ----------
function checkReminders(){
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const n = new Date(), hm = `${pad(n.getHours())}:${pad(n.getMinutes())}`, T = todayParts();
  state.habits.forEach(h => {
    if(h.archived || !h.reminder || h.reminder !== hm) return;
    if(!(h.type === "weekly" || isPlannedDay(h,T.y,T.m,T.d))) return;
    if(isDoneKey(h, T.iso)) return;
    const key = T.iso + "|" + h.id;
    if(notified.has(key)) return;
    notified.add(key);
    new Notification(`${h.icon ? h.icon+" " : ""}${h.name}`, { body: "Пора отметить" });
  });
}
setInterval(checkReminders, 30000);

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch(a){
    case "tab": tab = t.dataset.v; render(); break;
    case "filter": filter = t.dataset.v; render(); break;
    case "prev": nav(-1); break;
    case "next": nav(1); break;
    case "today": goToday(); break;
    case "cell": { const h = find(id); if(h) clickKey(h, iso(view.year, view.month, +t.dataset.d)); break; }
    case "tcell": { const h = find(id), T = todayParts(); if(h) clickKey(h, T.iso); break; }
    case "add": openEditor(null); break;
    case "edit": openEditor(id); break;
    case "del": { const h = find(id); if(h && confirm(`Удалить «${h.name}» и все отметки?`)) commit(() => { state.habits = state.habits.filter(x => x.id !== id); }, "Привычка удалена"); break; }
    case "up": move(id, -1); break;
    case "down": move(id, 1); break;
    case "archive": commit(() => { find(id).archived = true; }, "Отправлено в архив"); break;
    case "restore": commit(() => { find(id).archived = false; }); break;
    case "subadd": { const v = $("sub-"+id).value.trim(); if(v) commit(() => { find(id).subtasks.push({id:uid(), text:v.slice(0,80), done:false}); }); break; }
    case "subt": { const sid = t.dataset.sid; commit(() => { const s = find(id).subtasks.find(x => x.id === sid); s.done = !s.done; }); break; }
    case "subdel": { const sid = t.dataset.sid; commit(() => { const h = find(id); h.subtasks = h.subtasks.filter(x => x.id !== sid); }); break; }
    case "engday": { const it = ENG_ITEMS.find(x => x.k === t.dataset.v), k = todayParts().iso; commit(() => { engSet(it, k); }); break; }
    case "engms": { const id = t.dataset.v; commit(() => { const m = eng().ms; if(m[id]) delete m[id]; else m[id] = true; }); break; }
    case "enggoal": { const id = t.dataset.v; commit(() => { const m = eng().gd; if(m[id]) delete m[id]; else m[id] = true; }); break; }
    case "engres": {
      const nm = $("rName").value.trim(), g = Number($("rGot").value), m = Number($("rMax").value);
      if(!nm || !(m > 0) || g < 0 || g > m){ toast("Заполни название и результат (верно не больше, чем из)"); break; }
      commit(() => { eng().results.push({id:uid(), name:nm.slice(0,40), date:todayParts().iso, parts:[{l:"", g, m}]}); }, "Результат добавлен"); break; }
    case "englog": {
      const dt = $("jlDate").value, ti = $("jlTitle").value.trim(), bd = $("jlBody").value.trim();
      if(!dt || !ti){ toast("Нужны дата и заголовок"); break; }
      commit(() => { eng().log.push({id:uid(), date:dt, title:ti.slice(0,60), body:bd.slice(0,2000)}); }, "Запись добавлена"); break; }
    case "dayNav": dayOff += +t.dataset.v; editId = null; render(); break;
    case "dayToday": dayOff = 0; editId = null; render(); break;
    case "wake": { const k = curKey(); commit(() => { sched().wake[k] = t.dataset.v; }); break; }
    case "wakeCustom": { const v = $("wakeCustom").value; if(v){ const k = curKey(); commit(() => { sched().wake[k] = v; }); } break; }
    case "dayReset": { e.preventDefault(); const k = curKey(); editId = null; commit(() => { plan(k).blocks = null; }, "День вернулся к шаблону"); break; }
    case "bdone": { const k = curKey(), vid = t.dataset.v; commit(() => { const m = materialize(k); const id = m[vid] || vid; const b = plan(k).blocks.find(x => x.id === id); if(b) b.done = !b.done; }); break; }
    case "bdel": { const k = curKey(), vid = t.dataset.v; editId = null; commit(() => { const m = materialize(k); const id = m[vid] || vid; const pl = plan(k); pl.blocks = pl.blocks.filter(x => x.id !== id); }, "Дело удалено"); break; }
    case "bedit": { const k = curKey(), vid = t.dataset.v; undoStack.push(JSON.stringify(state)); const m = materialize(k); save(); editId = m[vid] || vid; render(); break; }
    case "bcancel": editId = null; render(); break;
    case "bsave": {
      const f = $("bFrom").value, z = $("bTo").value, nm = $("bName").value.trim(), ic = $("bIcon").value;
      if(!f || !z || !nm || toMin(z) <= toMin(f)){ toast("Заполни время (конец позже начала) и название"); break; }
      const k = curKey(), eid = editId; editId = null;
      commit(() => { materialize(k); const pl = plan(k);
        if(eid){ const b = pl.blocks.find(x => x.id === eid); if(b){ b.from = f; b.to = z; b.name = nm.slice(0,60); b.icon = ic; } }
        else pl.blocks.push({id:uid(), from:f, to:z, name:nm.slice(0,60), icon:ic, done:false}); }, eid ? "Сохранено" : "Дело добавлено");
      break; }
    case "tadd": { const v = $("tText").value.trim(); if(!v) break; const k = curKey(); commit(() => { plan(k).tasks.push({id:uid(), text:v.slice(0,80), done:false}); }); break; }
    case "tdone": { const k = curKey(), id = t.dataset.v; commit(() => { const x = plan(k).tasks.find(q => q.id === id); if(x) x.done = !x.done; }); break; }
    case "tdel": { const k = curKey(), id = t.dataset.v; commit(() => { const pl = plan(k); pl.tasks = pl.tasks.filter(q => q.id !== id); }); break; }
    case "rate": draft.rating = +t.dataset.v; render(); break;
    case "jsave": {
      const entry = { rating: draft.rating, text: draft.text.trim() };
      commit(() => { if(!entry.rating && !entry.text) delete state.journal[draft.date]; else state.journal[draft.date] = entry; }, "Запись сохранена");
      break;
    }
    case "color": ef.color = t.dataset.v; renderPickers(); break;
    case "wd": { const v = +t.dataset.v; ef.days = ef.days.includes(v) ? ef.days.filter(x => x !== v) : [...ef.days, v]; renderPickers(); break; }
    case "editor-save": saveEditor(); break;
    case "settings": $("settingsBack").classList.add("show"); break;
    case "close": closeSheets(); break;
    case "theme": state.dark = !state.dark; save(); render(); break;
    case "notify":
      if(typeof Notification === "undefined") toast("Уведомления не поддерживаются в этом браузере");
      else Notification.requestPermission().then(p => toast(p === "granted" ? "Уведомления включены" : "Уведомления не разрешены"));
      break;
    case "seed": { let added = 0; commit(() => { added = addSeed(); }); toast(added ? `Добавлено: ${added}` : "Всё уже на месте", !!added); break; }
    case "exportIcs": exportIcs(); break;
    case "engMin": importEngMin(); break;
    case "exportCsv": exportCsv(); break;
    case "exportJson": exportJson(); break;
    case "import": $("importFile").click(); break;
    case "clearAll": if(confirm("Удалить все привычки, отметки и записи?")) commit(() => { state = {habits:[], journal:{}, dark:state.dark}; }, "Всё очищено"); closeSheets(); break;
    case "undo": undo(); break;
  }
});
document.addEventListener("input", e => { if(e.target.id === "jtext") draft.text = e.target.value; });
document.addEventListener("change", e => {
  if(e.target.id === "fType" || e.target.id === "fKind") updateEditorVis();
  if(e.target.id === "jdate"){
    const v = e.target.value, rec = state.journal[v] || {};
    draft = { date: v, rating: rec.rating || 0, text: rec.text || "" };
    render();
  }
  if(e.target.id === "importFile"){
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const obj = JSON.parse(rd.result);
        if(!obj || !Array.isArray(obj.habits)) { toast("Это не файл трекера"); return; }
        if(confirm("Заменить все данные содержимым файла?")) commit(() => { state = obj; state.journal = state.journal || {}; }, "Данные восстановлены");
        closeSheets();
      }catch(err){ toast("Не удалось прочитать файл"); }
      e.target.value = "";
    };
    rd.readAsText(f);
  }
});

save();
render();
checkReminders();
</script>
